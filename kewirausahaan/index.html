<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ruang Usaha — Manajemen dan Kewirausahaan</title>
<style>
/* =========================================================
   RUANG USAHA — Manajemen dan Kewirausahaan (D3 Administrasi Bisnis)
   Sekeluarga dengan Lab Tiga Engine: kertas & tinta sama,
   aksen amber karena ini meja kerja, bukan ruang mesin.
   ========================================================= */
:root{
  --paper:#F1F2EC; --card:#FBFBF7; --ink:#17202B; --ink-soft:#4A5563; --rule:#CDD1C2;
  --amber:#8C3A2B; --good:#2E6B45; --bad:#A32020; --info:#2547C8; --plum:#7B2D7A;
  --sans:"Arial Narrow","Helvetica Neue Condensed","Liberation Sans Narrow",system-ui,sans-serif;
  --serif:Georgia,"Iowan Old Style","Palatino Linotype",serif;
  --mono:ui-monospace,"SFMono-Regular","Consolas","Liberation Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper); color:var(--ink); font-family:var(--serif); font-size:17px; line-height:1.6; -webkit-text-size-adjust:100%}
h1,h2,h3,h4,.u-sans{font-family:var(--sans); letter-spacing:-.01em; font-weight:700; line-height:1.1}
h1{font-size:2.3rem;margin:0}
h2{font-size:1.75rem;margin:0 0 6px}
h3{font-size:1.15rem;margin:22px 0 6px}
p{margin:0 0 .9em; max-width:68ch}
button:focus{outline:2px solid var(--amber); outline-offset:2px}
:focus-visible{outline:3px solid var(--amber); outline-offset:2px}

.wrap{display:grid; grid-template-columns:258px minmax(0,1fr); min-height:100vh}
.rail{background:var(--ink); color:#E7EAE2; padding:20px 16px 40px; position:sticky; top:0; align-self:start; height:100vh; overflow:auto; -webkit-overflow-scrolling:touch}
.stage{padding:32px 36px 90px; max-width:940px}

.wm{font-family:var(--sans); font-size:1.4rem; line-height:1}
.wm span{display:block; font-family:var(--mono); font-size:.68rem; color:#9AA69B; margin-top:6px; letter-spacing:.02em}
.who{margin:16px 0; padding:10px 12px; background:#22303F; border-radius:3px; font-family:var(--sans); font-size:.88rem}
.who b{display:block; font-size:1.05rem}
.who em{display:block; color:#9AA69B; font-style:normal; font-family:var(--mono); font-size:.72rem; margin-top:3px}
.xp{height:7px; background:#0E151D; border-radius:99px; margin-top:8px; overflow:hidden}
.xp i{display:block; height:100%; background:#D98C6A; width:0; transition:width .6s ease}
.blok{margin:16px 0 5px; font-family:var(--sans); font-size:.8rem; color:#8E9A8F}
.mlist{list-style:none; margin:0; padding:0}
.mlist button{width:100%; text-align:left; background:none; border:0; color:#D8DDD3; cursor:pointer; font-family:var(--sans); font-size:.94rem; padding:6px 8px 6px 26px; border-radius:3px; position:relative; line-height:1.25}
.mlist button:hover{background:#22303F}
.mlist button[aria-current="true"]{background:#2C3C4E; color:#fff}
.mlist button:before{content:attr(data-n); position:absolute; left:6px; top:6px; font-family:var(--mono); font-size:.7rem; color:#7E8A80}
.mlist button.done:before{content:"\2713"; color:#D98C6A}
.mlist button.locked{opacity:.42; cursor:not-allowed}
.mlist .w{font-family:var(--mono); font-size:.68rem; opacity:.65}
.tools{margin-top:20px; border-top:1px solid #2C3C4E; padding-top:12px; display:grid; gap:5px}
.tools button{background:none; border:1px solid #3A4C60; color:#C9D0C6; font-family:var(--sans); font-size:.86rem; padding:5px 9px; border-radius:3px; cursor:pointer; text-align:left}
.tools button:hover{background:#22303F; color:#fff}
.badges{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px}
.badge{font-family:var(--sans); font-size:.76rem; border:1px solid #3A4C60; color:#9AA69B; padding:2px 7px; border-radius:99px}
.badge.on{background:#D98C6A; color:#17202B; border-color:#D98C6A}

.tag{font-family:var(--sans); font-size:.9rem; color:var(--amber); display:flex; align-items:center; gap:8px; margin-bottom:8px}
.tag:before{content:""; width:30px; height:4px; background:var(--amber)}
.mt{display:flex; gap:11px; align-items:baseline; margin-bottom:5px}
.mt .no{font-family:var(--mono); font-size:.95rem; color:var(--ink-soft)}
.goal{font-family:var(--sans); font-size:1.04rem; color:var(--ink-soft); max-width:62ch; margin-bottom:20px}
.brief{border-left:4px solid var(--rule); padding-left:18px; margin-bottom:22px}
ol.steps{counter-reset:s; list-style:none; padding:0; margin:0 0 22px; max-width:68ch}
ol.steps li{counter-increment:s; position:relative; padding-left:38px; margin-bottom:10px}
ol.steps li:before{content:counter(s); position:absolute; left:0; top:2px; width:25px; height:25px; background:var(--amber); color:#fff; font-family:var(--mono); font-size:.8rem; display:grid; place-items:center; border-radius:50%}
.note{background:#E6E9DC; border-radius:3px; padding:12px 16px; font-size:.94rem; margin-bottom:20px; max-width:70ch}
.note b{font-family:var(--sans)}

.card{background:var(--card); border:1px solid var(--rule); border-radius:4px; padding:16px 18px; margin-bottom:16px}
.card>h3:first-child{margin-top:0}
label.fl{display:block; font-family:var(--sans); font-size:.92rem; margin-bottom:3px}
label.fl small{color:var(--ink-soft); font-family:var(--mono); font-size:.72rem; margin-left:5px}
input[type=text],input[type=number],select,textarea{width:100%; font-family:var(--serif); font-size:1rem; color:var(--ink); background:#fff; border:1px solid var(--rule); border-radius:3px; padding:8px 10px; margin-bottom:12px}
input[type=number]{font-family:var(--mono)}
select{font-family:var(--sans)}
textarea{min-height:80px; resize:vertical}
.btn{font-family:var(--sans); font-size:1rem; background:var(--ink); color:#fff; border:0; padding:10px 20px; border-radius:3px; cursor:pointer}
.btn:hover{background:#0E151D}
.btn.go{background:var(--amber)} .btn.go:hover{background:#6E2C21}
.btn.ghost{background:none; color:var(--ink); border:1px solid var(--ink)}
.btn.ghost:hover{background:#E6E9DC}
.btn:disabled{opacity:.45; cursor:not-allowed}
.btnrow{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:4px 0 22px}
.hint{font-family:var(--mono); font-size:.74rem; color:var(--ink-soft); margin:-8px 0 12px}

/* soal & pilihan */
.q{border-bottom:1px solid var(--rule); padding:13px 0}
.q:last-child{border-bottom:0}
.q .stem{font-size:1.02rem; margin-bottom:7px; max-width:70ch}
.q .stem b{font-family:var(--sans)}
.opts{display:flex; gap:7px; flex-wrap:wrap}
.opts button{font-family:var(--sans); font-size:.92rem; background:#fff; border:1px solid var(--rule); padding:6px 12px; border-radius:99px; cursor:pointer}
.opts button[aria-pressed="true"]{background:var(--ink); color:#fff; border-color:var(--ink)}
.opts button.right{background:#DCEBE0; border-color:var(--good); color:var(--good)}
.opts button.part{background:#F3E1DC; border-color:var(--amber); color:var(--amber)}
.opts button.wrong{background:#F4DCDC; border-color:var(--bad); color:var(--bad)}
.why{font-size:.9rem; color:var(--ink-soft); margin-top:7px; max-width:72ch}

/* checklist chip */
.chips{display:flex; gap:7px; flex-wrap:wrap; margin-bottom:6px}
.chip{font-family:var(--sans); font-size:.9rem; background:#fff; border:1px solid var(--rule); padding:6px 12px; border-radius:99px; cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink); color:#fff; border-color:var(--ink)}
.chip.right{background:#DCEBE0; border-color:var(--good); color:var(--good)}
.chip.wrong{background:#F4DCDC; border-color:var(--bad); color:var(--bad)}
.chip.miss{background:#fff; border-color:var(--good); color:var(--good); border-style:dashed}

/* urutan */
.seq{list-style:none; padding:0; margin:0 0 10px}
.seq li{background:#fff; border:1px solid var(--rule); border-radius:3px; padding:8px 12px; margin-bottom:6px; display:flex; gap:10px; align-items:center; font-size:.95rem}
.seq li .n{font-family:var(--mono); font-size:.8rem; width:22px; color:var(--ink-soft)}
.seq li .mv{margin-left:auto; display:flex; gap:4px}
.seq li .mv button{font-family:var(--mono); background:#fff; border:1px solid var(--rule); width:28px; height:26px; border-radius:3px; cursor:pointer}
.seq li.ok{border-color:var(--good); background:#F2F8F3}
.seq li.no{border-color:var(--bad); background:#FBF3F3}

/* tabel kas kecil */
table.t{width:100%; border-collapse:collapse; font-size:.92rem; margin:10px 0 16px}
table.t th,table.t td{border-bottom:1px solid var(--rule); padding:6px 7px; text-align:left; vertical-align:middle}
table.t th{font-family:var(--sans); font-size:.88rem}
table.t td.n,table.t th.n{font-family:var(--mono); text-align:right; white-space:nowrap}
table.t select{margin:0; padding:4px 6px; font-size:.85rem}
table.t tfoot td{font-family:var(--sans); border-top:2px solid var(--ink); border-bottom:0}
.wrapx{overflow-x:auto}

/* grid tata ruang */
.room{display:grid; gap:3px; margin:10px 0 14px; max-width:520px}
.cell{aspect-ratio:1/1; background:#fff; border:1px solid var(--rule); border-radius:2px; font-family:var(--sans); font-size:.62rem; line-height:1.05; padding:2px; cursor:pointer; overflow:hidden; text-align:center; color:var(--ink-soft)}
.cell.fix{background:#E2E5DA; cursor:default; color:var(--ink)}
.cell.door{background:#DDE6D9; border-color:var(--good); color:var(--good)}
.cell.pimp{background:#EBD9EB; border-color:var(--plum); color:var(--plum)}
.cell.win{background:#DDE4EF; border-color:var(--info); color:var(--info)}
.cell.has{background:#F3E1DC; border-color:var(--amber); color:#5E241B; font-weight:700}
.cell.sel{box-shadow:inset 0 0 0 2px var(--amber)}
.palette{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px}
.palette button{font-family:var(--sans); font-size:.86rem; background:#fff; border:1px solid var(--rule); padding:5px 10px; border-radius:3px; cursor:pointer}
.palette button[aria-pressed="true"]{background:var(--amber); color:#fff; border-color:var(--amber)}
.palette button.placed{opacity:.5}

ul.find{list-style:none; padding:0; margin:0 0 16px}
ul.find li{position:relative; padding:8px 0 8px 28px; border-bottom:1px solid var(--rule); max-width:74ch; font-size:.94rem}
ul.find li:before{position:absolute; left:2px; top:8px; font-family:var(--mono); font-size:.88rem}
ul.find li.ok:before{content:"\2713"; color:var(--good)}
ul.find li.part:before{content:"~"; color:var(--amber)}
ul.find li.no:before{content:"\00D7"; color:var(--bad)}
ul.find li.info:before{content:"i"; color:var(--info)}
ul.find li b{font-family:var(--sans)}

.score{border:1px solid var(--ink); border-radius:4px; overflow:hidden; margin-bottom:20px}
.score>header{background:var(--ink); color:#E7EAE2; font-family:var(--sans); font-size:.94rem; padding:8px 14px; display:flex; justify-content:space-between}
.score .body{background:var(--card); padding:15px}
.score .v{font-family:var(--sans); font-size:2.4rem; line-height:1}
.score .track{height:8px; background:#E2E5DA; border-radius:99px; overflow:hidden; margin:8px 0 10px}
.score .track i{display:block; height:100%; width:0; background:var(--amber); transition:width .6s ease}

.modal{position:fixed; top:0; right:0; bottom:0; left:0; background:rgba(23,32,43,.72); display:grid; place-items:center; padding:18px; z-index:40}
.modal[hidden]{display:none}
.sheet{background:var(--paper); border-radius:5px; padding:24px; max-width:720px; width:100%; max-height:88vh; overflow:auto}
.toast{position:fixed; left:50%; bottom:22px; transform:translateX(-50%); background:var(--ink); color:#fff; font-family:var(--sans); padding:10px 18px; border-radius:3px; z-index:50}
.toast[hidden]{display:none}
.rep{font-family:var(--mono); font-size:.78rem; line-height:1.5; white-space:pre; min-height:300px}


/* alokasi satuan usaha (misi 6) */
.alloc{display:grid; gap:12px; margin-bottom:6px}
.arow{display:grid; grid-template-columns:210px 1fr 52px; gap:12px; align-items:center}
.arow .nm{font-family:var(--sans); font-size:.94rem}
.arow .nm small{display:block; color:var(--ink-soft); font-family:var(--serif); font-size:.8rem; line-height:1.3}
.arow output{font-family:var(--mono); font-size:.9rem; text-align:right}
input[type=range]{width:100%; accent-color:var(--amber)}
.sov{display:grid; gap:5px; margin:14px 0 4px}
.sovrow{display:grid; grid-template-columns:200px 1fr; gap:10px; align-items:center; font-size:.9rem}
.sovrow .bar{height:15px; background:#E2E5DA; border-radius:2px; overflow:hidden}
.sovrow .bar i{display:block; height:100%; background:var(--amber); width:0; transition:width .5s ease}
@media (max-width:700px){
  .arow{grid-template-columns:1fr 56px}
  .arow input[type=range]{grid-column:1/-1}
  .sovrow{grid-template-columns:120px 1fr}
}

@media (max-width:820px){
  .wrap{grid-template-columns:1fr}
  .rail{position:static; height:auto; padding-bottom:16px}
  .stage{padding:22px 16px 70px}
  h1{font-size:1.8rem} h2{font-size:1.4rem}
  .room{max-width:100%}
  .cell{font-size:.5rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{.rail,.btnrow,.tools,.modal{display:none!important} body{background:#fff} .stage{max-width:none;padding:0}}
</style>
</head>
<body>
<div class="wrap">
  <nav class="rail" aria-label="Daftar misi">
    <div class="wm">RUANG USAHA<span>manajemen &amp; kewirausahaan &middot; d3 teknik komputer</span></div>
    <div class="who" id="who"></div>
    <div id="nav"></div>
    <div class="tools">
      <button id="btnRubrik">Bobot &amp; Sub-CPMK</button>
      <button id="btnPanduan">Panduan istilah</button>
      <button id="btnRapor">Rapor saya</button>
      <button id="btnExport">Export jawaban</button>
      <button id="btnImport">Import jawaban</button>
      <button id="btnReset">Kosongkan</button>
    </div>
  </nav>
  <main class="stage" id="stage" tabindex="-1"></main>
</div>
<div class="modal" id="modal" hidden><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast" hidden></div>
<script>
/* =======================================================================
   RUANG USAHA \u2014 Manajemen dan Kewirausahaan (TC250606)
   Sepuluh misi mengikuti Sub-CPMK 1\u201310 pada RPS.
   Kasus memakai konteks D3 Teknik Komputer: jasa servis, perangkat,
   dan layanan digital \u2014 bukan contoh dagang umum.
   ======================================================================= */
"use strict";

var KEY = "ruangusaha.v1";
var BLOK = { 1: "Sebelum ETS \u2014 minggu 1\u20139", 2: "Setelah ETS \u2014 minggu 11\u201317" };
var LEVELS = [
  { at: 0, t: "Calon Wirausaha" }, { at: 180, t: "Pemilik Ide" },
  { at: 380, t: "Perintis Usaha" }, { at: 580, t: "Pemilik Usaha" },
  { at: 780, t: "Pengembang Usaha" }
];
var BADGES = [
  { id: "konsep", t: "Paham Konsep" }, { id: "mindset", t: "Pola Pikir Tumbuh" },
  { id: "kreatif", t: "Pembongkar Hambatan" }, { id: "inovasi", t: "Inovator Berguna" },
  { id: "peluang", t: "Pembaca Masalah" }, { id: "validasi", t: "Penguji Asumsi" },
  { id: "etika", t: "Wirausaha Taat" }, { id: "kelayakan", t: "Penghitung BEP" },
  { id: "pasar", t: "Strategi Selaras" }, { id: "bmc", t: "Perancang Model" },
  { id: "lengkap", t: "Sepuluh Misi Tuntas" }
];

var S = null;
function fresh() { return { v: 1, nama: "", npm: "", usaha: "", xp: 0, badges: [], m: {}, cur: null }; }
function load() {
  try { var r = localStorage.getItem(KEY); S = r ? JSON.parse(r) : fresh(); }
  catch (e) { S = fresh(); }
  if (!S || S.v !== 1) S = fresh();
  if (!S.m) S.m = {}; if (!S.badges) S.badges = [];
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { toast("Browser menolak menyimpan. Pakai Export jawaban."); }
}
function award(id) {
  if (S.badges.indexOf(id) < 0) {
    S.badges.push(id);
    for (var i = 0; i < BADGES.length; i++) if (BADGES[i].id === id) { toast("Badge baru: " + BADGES[i].t); return; }
  }
}
function levelOf(xp) {
  var out = LEVELS[0];
  for (var i = 0; i < LEVELS.length; i++) if (xp >= LEVELS[i].at) out = LEVELS[i];
  return out;
}
function finish(id, score, data) {
  var prev = S.m[id] ? S.m[id].score : 0;
  S.m[id] = { score: Math.max(prev, Math.round(score)), attempts: ((S.m[id] && S.m[id].attempts) || 0) + 1, data: data || {}, at: Date.now() };
  S.xp = 0;
  for (var k in S.m) S.xp += S.m[k].score;
  var n = 0;
  for (var j = 0; j < MISSIONS.length; j++) if (S.m[MISSIONS[j].id]) n++;
  if (n === MISSIONS.length) award("lengkap");
  save(); paintRail();
}

function el(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]; }); }
var tt = null;
function toast(m) { var t = el("toast"); t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(function () { t.hidden = true; }, 3400); }
function modal(h) { el("sheet").innerHTML = h; el("modal").hidden = false; }
function closeModal() { el("modal").hidden = true; }
function num(v) { var n = parseFloat(String(v).replace(/[^0-9.,\-]/g, "").replace(",", ".")); return isFinite(n) ? n : null; }
/* "46.875" bisa berarti 46,875 atau 46875 \u2014 keduanya dicoba, supaya
   mahasiswa tidak dihukum karena kebiasaan menulis pemisah ribuan. */
function nums(v) {
  var raw = String(v == null ? "" : v).replace(/[^0-9.,\-]/g, "");
  var out = [], a = parseFloat(raw.replace(/,/g, ".")), b = parseFloat(raw.replace(/\./g, "").replace(/,/g, "."));
  if (isFinite(a)) out.push(a);
  if (isFinite(b) && out.indexOf(b) < 0) out.push(b);
  return out;
}
function okNum(v, target, tol) {
  var c = nums(v);
  for (var i = 0; i < c.length; i++) if (Math.abs(c[i] - target) <= tol) return true;
  return false;
}
function rp(n) {
  if (n == null) return "\u2014";
  var s = Math.round(Math.abs(n)).toString(), out = "", c = 0;
  for (var i = s.length - 1; i >= 0; i--) { out = s.charAt(i) + out; if (++c % 3 === 0 && i > 0) out = "." + out; }
  return (n < 0 ? "-Rp" : "Rp") + out;
}
function mk(w, got, t, why) { return { w: w, got: Math.max(0, Math.min(1, got)), t: t, why: why || "" }; }
function total(cs) {
  var s = 0, m = 0;
  for (var i = 0; i < cs.length; i++) { s += cs[i].w * cs[i].got; m += cs[i].w; }
  return m ? Math.round(s / m * 100) : 0;
}
function checkList(cs) {
  return '<ul class="find">' + cs.map(function (c) {
    var cl = c.got >= .99 ? "ok" : (c.got > 0 ? "part" : "no");
    return '<li class="' + cl + '"><b>' + esc(c.t) + "</b>" + (c.why ? " \u2014 " + esc(c.why) : "") + "</li>";
  }).join("") + "</ul>";
}
function scoreBox(sc, cap, cs) {
  return '<section class="score"><header><span>Penilaian</span><span>' + esc(cap || "") + "</span></header>" +
    '<div class="body"><div class="v">' + sc + '<span style="font-size:1rem;color:var(--ink-soft)">/100</span></div>' +
    '<div class="track"><i style="width:' + sc + '%"></i></div>' + (cs ? checkList(cs) : "") + "</div></section>";
}
function inArr(a, v) { return a && a.indexOf(v) >= 0; }
function near(a, b, tol) { return a != null && Math.abs(a - b) <= tol; }
/* =======================================================================
   DAFTAR MISI \u2014 Sub-CPMK 1\u201310
   kind: match | inovasi | peluang | validasi | kelayakan | pasar | bmc
   ======================================================================= */

var MISSIONS = [
{
  id: "w1", blok: 1, no: 1, bobot: 10, sub: 1,
  title: "Konsep dasar dan karakter wirausaha",
  goal: "Pisahkan apa yang benar tentang wirausaha dari apa yang cuma sering diulang orang.",
  brief:
    "<p>Kewirausahaan bukan soal berdagang. Intinya <b>melihat peluang lalu menanggung risiko untuk mewujudkannya</b> dengan sumber daya yang belum tentu kamu miliki sekarang.</p>" +
    "<p>Bagi mahasiswa Teknik Komputer ini penting justru karena kemampuan teknismu bukan penentu utama. Banyak lulusan bisa merakit dan memperbaiki; yang membedakan adalah kemampuan melihat mana keahlian yang orang mau bayar.</p>" +
    "<p>Beberapa istilah yang sering tertukar: <b>wirausaha</b> membangun usaha sendiri, <b>intrapreneur</b> membangun hal baru di dalam perusahaan orang lain, dan <b>freelancer</b> menjual waktunya sendiri tanpa membangun sistem yang bisa jalan tanpa dia.</p>",
  steps: [
    "Baca tiap pernyataan, jangan langsung menebak yang terdengar paling positif.",

function missionById(id) {
  for (var i = 0; i < MISSIONS.length; i++) if (MISSIONS[i].id === id) return MISSIONS[i];
  return null;
}
function unlocked(i) { return i === 0 ? true : !!S.m[MISSIONS[i - 1].id]; }
/* =======================================================================
   TAMPILAN MISI
   ======================================================================= */
var cur = null;

function paintRail() {
  var lv = levelOf(S.xp), nx = null;
  for (var i = 0; i < LEVELS.length; i++) if (LEVELS[i].at > S.xp) { nx = LEVELS[i]; break; }
  var pct = nx ? Math.round((S.xp - lv.at) / (nx.at - lv.at) * 100) : 100;
  el("who").innerHTML = "<b>" + esc(lv.t) + "</b><em>" + S.xp + " poin" +
    (nx ? " \u00b7 " + (nx.at - S.xp) + " lagi ke " + nx.t : " \u00b7 tertinggi") + "</em>" +
    (S.nama ? "<em>" + esc(S.nama) + (S.npm ? " \u00b7 " + esc(S.npm) : "") + "</em>" : "") +
    '<div class="xp"><i style="width:' + pct + '%"></i></div>' +
    '<div class="badges">' + BADGES.map(function (b) {
      return '<span class="badge' + (inArr(S.badges, b.id) ? " on" : "") + '">' + esc(b.t) + "</span>";
    }).join("") + "</div>";

  var html = "", blok = 0;
  for (var j = 0; j < MISSIONS.length; j++) {
    var m = MISSIONS[j];
    if (m.blok !== blok) {
      if (blok) html += "</ul>";
      blok = m.blok;
      html += '<div class="blok">' + esc(BLOK[blok]) + '</div><ul class="mlist">';
    }
    var dn = !!S.m[m.id], open = unlocked(j);
    html += '<li><button data-go="' + m.id + '" data-n="' + m.no + '" class="' + (dn ? "done" : "") +
      (open ? "" : " locked") + '"' + (open ? "" : " disabled") + (cur === m.id ? ' aria-current="true"' : "") + ">" +
      esc(m.title) + ' <span class="w">Sub-CPMK ' + m.sub + (dn ? " \u00b7 " + S.m[m.id].score : "") + "</span></button></li>";
  }
  html += "</ul>";
  el("nav").innerHTML = html;
}

function shell(m, task) {
  return '<div class="tag">' + esc(BLOK[m.blok]) + " \u00b7 Sub-CPMK " + m.sub + " \u00b7 bobot " + m.bobot + "%</div>" +
    '<div class="mt"><span class="no">Misi ' + m.no + "</span><h2>" + esc(m.title) + "</h2></div>" +
    '<p class="goal">' + esc(m.goal) + "</p>" +
    '<div class="brief">' + m.brief + "</div>" +
    "<h3>Langkah kerja</h3><ol class=\"steps\">" + m.steps.map(function (s) { return "<li>" + s + "</li>"; }).join("") + "</ol>" +
    '<div class="note">' + m.note + "</div>" + task;
}
function nextBtn(m) {
  var i = MISSIONS.indexOf(m), n = MISSIONS[i + 1];
  return '<div class="btnrow" id="after" hidden>' +
    (n ? '<button class="btn ghost" id="bNext">Misi ' + n.no + ": " + esc(n.title) + "</button>"
       : '<button class="btn ghost" id="bRapor">Lihat rapor akhir</button>') + "</div>";
}
function wireNext(m) {
  var i = MISSIONS.indexOf(m), n = MISSIONS[i + 1];
  if (el("bNext") && n) el("bNext").onclick = function () { go(n.id); };
  if (el("bRapor")) el("bRapor").onclick = rapor;
}
function done(m, sc, data, at) {
  finish(m.id, sc, data);
  if (m.badge && sc >= (at || 75)) award(m.badge);
  save(); paintRail();
  el("after").hidden = false; wireNext(m);
}
function go(id) {
  cur = id; S.cur = id; save();
  var m = missionById(id); if (!m) return;
  var f = { match: vMatch, inovasi: vInov, peluang: vPel, validasi: vVal, kelayakan: vKel, pasar: vPas, bmc: vBmc }[m.kind];
  el("stage").innerHTML = shell(m, f.view(m));
  paintRail(); window.scrollTo(0, 0);
  f.wire(m);
}

/* =========================== MATCH (misi 1,2,3,7) =========================== */
var vMatch = {
  view: function (m) {
    var d = (S.m[m.id] && S.m[m.id].data && S.m[m.id].data.pick) || [];
    return '<section class="card" id="qs">' + m.items.map(function (it, i) {
      var opts = it.opts || m.opts;
      return '<div class="q" data-i="' + i + '"><p class="stem"><b>' + (i + 1) + ".</b> " + esc(it.stem) + '</p><div class="opts">' +
        opts.map(function (o, j) {
          return '<button data-q="' + i + '" data-o="' + j + '" aria-pressed="' + (d[i] === j ? "true" : "false") + '">' + esc(o) + "</button>";
        }).join("") + '</div><p class="why" hidden></p></div>';
    }).join("") + "</section>" +
      '<div class="btnrow"><button class="btn go" id="bCek">Periksa jawaban</button></div><div id="out"></div>' + nextBtn(m);
  },
  wire: function (m) {
    var pick = (S.m[m.id] && S.m[m.id].data && S.m[m.id].data.pick) ? S.m[m.id].data.pick.slice() : [];
    el("qs").onclick = function (e) {
      var b = e.target.closest("button[data-q]"); if (!b) return;
      var qi = +b.getAttribute("data-q"); pick[qi] = +b.getAttribute("data-o");
      var row = el("qs").querySelectorAll('.q[data-i="' + qi + '"] .opts button');
      for (var i = 0; i < row.length; i++) row[i].setAttribute("aria-pressed", row[i] === b ? "true" : "false");
    };
    el("bCek").onclick = function () {
      var got = 0, cs = [];
      for (var i = 0; i < m.items.length; i++) {
        var it = m.items[i], bs = el("qs").querySelectorAll('.q[data-i="' + i + '"] .opts button');
        var v = pick[i], g = v === it.ans ? 1 : (it.alt >= 0 && v === it.alt ? .5 : 0);
        got += g;
        for (var j = 0; j < bs.length; j++) {
          bs[j].classList.remove("right", "part", "wrong");
          if (j === it.ans) bs[j].classList.add("right");
          else if (it.alt >= 0 && j === it.alt) bs[j].classList.add("part");
          else if (v === j) bs[j].classList.add("wrong");
        }
        var w = el("qs").querySelector('.q[data-i="' + i + '"] .why');
        w.hidden = false; w.textContent = it.why;
        cs.push(mk(1, g, "Nomor " + (i + 1), g === 1 ? "tepat" : (g > 0 ? "bisa diterima" : (v == null ? "belum dijawab" : "belum tepat"))));
      }
      var sc = Math.round(got / m.items.length * 100);
      el("out").innerHTML = scoreBox(sc, "semua butir bobotnya sama", cs);
      done(m, sc, { pick: pick });
    };
    wireNext(m);
  }
};

  },

    function cnt() { el("cnt").textContent = sel.length + " dari " + m.pick + " dipilih"; }

        }

          else if (ck[q] === z) bs[z].classList.add("wrong");
        }
        var w = el("ck").querySelector('.q[data-i="' + q + '"] .why');
        w.hidden = false; w.textContent = m.cek[q].why;
        if (ck[q] === m.cek[q].ans) cb++;
      }
      cs.push(mk(40, cb / m.cek.length, "Keselarasan model: " + cb + " dari " + m.cek.length + " tepat", ""));
      var sc = total(cs);
      el("out").innerHTML = scoreBox(sc, "penempatan 60 \u00b7 keselarasan 40", cs);
      done(m, sc, { as: as, ck: ck });
    };
    wireNext(m);
  }
};
/* =======================================================================
   RAPOR, RUBRIK, EKSPOR, PEMBUKA
   ======================================================================= */
function nilaiAkhir() {
  var t = 0;
  for (var i = 0; i < MISSIONS.length; i++) {
    var m = MISSIONS[i], r = S.m[m.id];
    if (r) t += r.score * m.bobot / 100;
  }
  return Math.round(t * 10) / 10;
}
function pad(s, n) { s = String(s); while (s.length < n) s += " "; return s; }

function laporan() {
  var L = [];
  L.push("LAPORAN HASIL LATIHAN \u2014 RUANG USAHA");
  L.push("Mata kuliah Manajemen dan Kewirausahaan \u00b7 D3 Teknik Komputer");
  L.push("");
  L.push("Nama : " + (S.nama || "-"));
  L.push("NPM  : " + (S.npm || "-"));
  L.push("");
  L.push(pad("Misi", 40) + pad("Bobot", 8) + pad("Nilai", 8) + "Percobaan");
  L.push(new Array(72).join("-"));
  for (var i = 0; i < MISSIONS.length; i++) {
    var m = MISSIONS[i], r = S.m[m.id];
    var t = m.no + ". " + m.title;
    if (t.length > 38) t = t.slice(0, 37) + "\u2026";
    L.push(pad(t, 40) + pad(m.bobot + "%", 8) + pad(r ? r.score : "-", 8) + (r ? r.attempts + "\u00d7" : "-"));
  }
  L.push(new Array(72).join("-"));
  L.push(pad("Nilai akhir terbobot", 40) + pad("100%", 8) + nilaiAkhir());
  L.push("");
  var got = [];
  for (var b = 0; b < BADGES.length; b++) if (inArr(S.badges, BADGES[b].id)) got.push(BADGES[b].t);
  L.push("Badge: " + (got.length ? got.join(", ") : "belum ada"));
  L.push("");
  L.push("Catatan: nilai di latihan ini bukan nilai mata kuliah. Angkanya");
  L.push("menunjukkan seberapa sesuai pekerjaanmu dengan prosedur yang");
  L.push("diajarkan, dan dipakai untuk berlatih sebelum tugas sebenarnya.");
  return L.join("\n");
}
function rapor() {
  var rows = MISSIONS.map(function (m) {
    var r = S.m[m.id];
    return "<tr><td>" + m.no + "</td><td>" + esc(m.title) + '</td><td class="n">' + m.bobot + '%</td><td class="n">' +
      (r ? r.score : "\u2014") + '</td><td class="n">' + (r ? (r.score * m.bobot / 100).toFixed(1) : "\u2014") + "</td></tr>";
  }).join("");
  modal("<h2>Rapor saya</h2>" +
    '<div class="card"><label class="fl" for="rn">Nama</label><input type="text" id="rn" value="' + esc(S.nama) + '">' +
    '<label class="fl" for="rp">NPM</label><input type="text" id="rp" value="' + esc(S.npm) + '"></div>' +
    '<table class="t"><tr><th>#</th><th>Tugas</th><th class="n">Bobot</th><th class="n">Nilai</th><th class="n">Kontribusi</th></tr>' + rows +
    '<tfoot><tr><td colspan="4">Nilai akhir terbobot</td><td class="n">' + nilaiAkhir() + "</td></tr></tfoot></table>" +
    '<textarea class="rep" id="repT" rows="16"></textarea>' +
    '<div class="btnrow"><button class="btn go" id="rC">Copy laporan</button>' +
    '<button class="btn ghost" onclick="window.print()">Cetak / PDF</button>' +
    '<button class="btn ghost" onclick="closeModal()">Tutup</button></div>');
  el("repT").value = laporan();
  el("rn").oninput = function () { S.nama = this.value; save(); paintRail(); el("repT").value = laporan(); };
  el("rp").oninput = function () { S.npm = this.value; save(); paintRail(); el("repT").value = laporan(); };
  el("rC").onclick = function () { copyBox("repT"); };
}

function rubrik() {
  var rows = MISSIONS.map(function (m) {
    var r = S.m[m.id];
    return "<tr><td>" + m.no + "</td><td>" + esc(m.title) + '</td><td class="n">' + m.sub + '</td><td class="n">' + m.bobot + '%</td><td class="n">' + (r ? r.score : "\u2014") + "</td></tr>";
  }).join("");
  modal("<h2>Bobot dan Sub-CPMK</h2>" +
    "<p>Sepuluh misi ini mengikuti Sub-CPMK 1\u201310 pada RPS. Bobot mingguan di RPS berkisar 10% untuk tiap tahapan, jadi di latihan ini bobotnya dibuat sama rata.</p>" +
    '<table class="t"><tr><th>#</th><th>Misi</th><th class="n">Sub-CPMK</th><th class="n">Bobot</th><th class="n">Nilai</th></tr>' + rows + "</table>" +
    "<h3>Yang dinilai otomatis dan yang tidak</h3>" +
    "<p>Latihan ini menilai ketepatan keputusan: konsep, penggolongan, hitungan kelayakan, keselarasan strategi, dan penempatan blok kanvas. Yang tidak bisa dinilai di sini adalah proposal tertulis dan presentasinya \u2014 dua hal yang justru menjadi tagihan utama pada minggu 14\u201317.</p>" +
    "<h3>Cara memakainya di kelas</h3>" +
    "<p>Misi 1\u20136 cocok dikerjakan sebelum ETS sebagai latihan mandiri. Misi 8 berguna sebagai pemanasan sebelum menyusun studi kelayakan asli, karena mahasiswa bisa mengulang hitungan BEP sampai terbiasa. Misi 9 dan 10 paling baik dikerjakan berkelompok, lalu hasilnya dibandingkan antarkelompok: kombinasi yang selaras lebih dari satu, dan itu bahan diskusi yang bagus.</p>" +
    '<div class="btnrow"><button class="btn ghost" onclick="closeModal()">Tutup</button></div>');
}
function panduan() {
  modal("<h2>Panduan istilah</h2>" +
    "<h3>Kewirausahaan</h3>" +
    "<p><b>Wirausaha</b> \u2014 membangun usaha sendiri dan menanggung risikonya.<br>" +
    "<b>Intrapreneur</b> \u2014 membangun hal baru di dalam perusahaan orang lain.<br>" +
    "<b>Aset dan liabilitas</b> \u2014 aset memasukkan uang, liabilitas mengeluarkan uang.<br>" +
    "<b>Pola pikir tumbuh</b> \u2014 kemampuan dianggap bisa dibangun, kegagalan diperlakukan sebagai data.</p>" +
    "<h3>Peluang dan pengujian</h3>" +
    "<p><b>SCAMPER</b> \u2014 cara menghasilkan variasi: ganti, gabung, sesuaikan, ubah fungsi, hilangkan, balik.<br>" +
    "<b>MVP</b> \u2014 versi paling sederhana yang sudah bisa diuji ke pelanggan sungguhan.<br>" +
    "<b>Pra-pesan</b> \u2014 pembayaran sebelum barang atau jasa tersedia; bukti minat paling kuat.<br>" +
    "<b>Asumsi</b> \u2014 hal yang kamu percaya benar tetapi belum diuji. Setiap rencana usaha berisi banyak.</p>" +
    "<h3>Kelayakan</h3>" +
    "<p><b>Margin kontribusi</b> \u2014 harga jual dikurangi biaya variabel per unit.<br>" +
    "<b>BEP</b> \u2014 titik pulang pokok: biaya tetap dibagi margin kontribusi.<br>" +
    "<b>Payback period</b> \u2014 lama modal awal kembali, dihitung dari laba bersih per bulan.<br>" +
    "<b>Biaya tetap dan variabel</b> \u2014 tetap tidak berubah walau produksi nol; variabel mengikuti jumlah unit.</p>" +
    "<h3>Pemasaran dan model bisnis</h3>" +
    "<p><b>STP</b> \u2014 Segmentasi, Targeting, Positioning.<br>" +
    "<b>Bauran pemasaran</b> \u2014 produk, harga, tempat, promosi.<br>" +
    "<b>Business Model Canvas</b> \u2014 sembilan blok yang menjelaskan cara usaha menciptakan dan menangkap nilai.<br>" +
    "<b>Business plan</b> \u2014 dokumen rencana lengkap; kanvas adalah ringkasan modelnya, bukan penggantinya.</p>" +
    '<div class="btnrow"><button class="btn ghost" onclick="closeModal()">Tutup</button></div>');
}

/* ---------------- ekspor / impor ---------------- */
function copyBox(id) {
  var ta = el(id);
  ta.focus(); ta.select();
  try { ta.setSelectionRange(0, ta.value.length); } catch (e) {}
  var ok = false;
  try { ok = document.execCommand("copy"); } catch (e2) { ok = false; }
  if (!ok && navigator.clipboard) {
    navigator.clipboard.writeText(ta.value).then(function () { toast("Tersalin."); },
      function () { toast("Tekan lama di kotak teks, lalu Select All \u2192 Copy."); });
    return;
  }
  toast(ok ? "Tersalin. Tempel ke dokumen atau LMS." : "Tekan lama di kotak teks, lalu Select All \u2192 Copy.");
}
function exportDialog() {
  var json = JSON.stringify(S, null, 2);
  var name = "ruangusaha-" + (S.npm || "siswa").replace(/[^a-zA-Z0-9]+/g, "") + "-" + new Date().toISOString().slice(0, 10) + ".json";
  modal("<h2>Export jawaban</h2><p>Di iPhone dan iPad tombol download biasanya tidak berfungsi \u2014 pakai Copy, lalu tempel ke WhatsApp, email, atau kolom tugas di LMS.</p>" +
    '<div class="btnrow"><button class="btn go" id="eC">Copy semua teks</button><button class="btn ghost" id="eD">Download .json</button></div>' +
    '<textarea id="eT" rows="8">' + esc(json) + "</textarea>" +
    '<p class="hint">Nama berkas: ' + esc(name) + "</p>" +
    '<div class="btnrow"><button class="btn ghost" onclick="closeModal()">Tutup</button></div>');
  el("eC").onclick = function () { copyBox("eT"); };
  el("eD").onclick = function () {
    try {
      var b = new Blob([json], { type: "application/json" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(b); a.download = name;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
      toast("Berkas " + name + " diunduh.");
    } catch (e) { toast("Download tidak didukung di browser ini. Pakai Copy."); }
  };
}
function applyImport(txt) {
  try {
    var o = JSON.parse(txt);
    if (!o || o.v !== 1) throw 0;
    S = o; if (!S.m) S.m = {}; if (!S.badges) S.badges = [];
    save(); closeModal(); paintRail(); go(S.cur || MISSIONS[0].id); toast("Jawaban dimuat.");
  } catch (e) { toast("Teks tidak dikenali. Pastikan seluruh isi berkas .json tersalin."); }
}
function importDialog() {
  modal("<h2>Import jawaban</h2><p>Pilih berkas .json, atau tempel isinya ke kotak di bawah.</p>" +
    '<input type="file" id="iF" accept="application/json,text/plain,.json" style="margin-bottom:12px">' +
    '<textarea id="iT" rows="6" placeholder="Tempel isi berkas .json di sini."></textarea>' +
    '<div class="btnrow"><button class="btn go" id="iG">Muat</button><button class="btn ghost" onclick="closeModal()">Batal</button></div>');
  el("iF").onchange = function () {
    if (!this.files || !this.files[0]) return;
    var r = new FileReader();
    r.onload = function () { applyImport(r.result); };
    r.onerror = function () { toast("Berkas tidak bisa dibaca. Pakai cara tempel teks."); };
    r.readAsText(this.files[0]);
  };
  el("iG").onclick = function () {
    var v = el("iT").value.trim();
    if (!v) { toast("Kotaknya masih kosong."); return; }
    applyImport(v);
  };
}

/* ---------------- pembuka ---------------- */
function pembuka() {
  cur = null; paintRail();
  el("stage").innerHTML =
    '<div class="tag">Sebelum mulai</div><h1>Sepuluh keputusan membangun usaha</h1>' +
    '<p class="goal" style="font-size:1.12rem">Satu semester Manajemen dan Kewirausahaan, dikerjakan sebagai rangkaian keputusan: memisahkan mitos dari kenyataan, membaca masalah jadi peluang, menguji asumsi dengan usaha terbatas, menghitung titik pulang pokok, menyelaraskan strategi pemasaran, dan menyusun model bisnis. Kasusnya memakai usaha berbasis komputer, bukan contoh dagang umum.</p>' +
    '<div class="card"><h3>Isi identitas dulu</h3><p class="hint">Dipakai di rapor dan berkas yang kamu kumpulkan.</p>' +
    '<label class="fl" for="pn">Nama</label><input type="text" id="pn" value="' + esc(S.nama) + '">' +
    '<label class="fl" for="pp">NPM</label><input type="text" id="pp" value="' + esc(S.npm) + '"></div>' +
    '<div class="note"><b>Satu hal yang perlu disepakati dulu.</b> Beberapa misi tidak punya satu jawaban paling benar \u2014 Misi 9 misalnya punya beberapa strategi yang sama-sama selaras. Yang dinilai adalah apakah keputusanmu saling mendukung dan bisa kamu pertahankan alasannya, bukan apakah sama dengan kunci. Nilai di sini juga bukan nilai mata kuliah.</div>' +
    '<div class="btnrow"><button class="btn go" id="bGo">Mulai Misi 1</button>' +
    (Object.keys(S.m).length ? '<button class="btn ghost" id="bLanjut">Lanjutkan yang terakhir</button>' : "") + "</div>";
  el("bGo").onclick = function () {
    S.nama = el("pn").value; S.npm = el("pp").value; save(); go(MISSIONS[0].id);
  };
  if (el("bLanjut")) el("bLanjut").onclick = function () {
    S.nama = el("pn").value; S.npm = el("pp").value; save(); go(S.cur || MISSIONS[0].id);
  };
}

/* ---------------- init ---------------- */
load();
el("modal").addEventListener("click", function (e) { if (e.target === el("modal")) closeModal(); });
document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeModal(); });
document.addEventListener("click", function (e) {
  var b = e.target.closest("button[data-go]");
  if (b && !b.disabled) { go(b.getAttribute("data-go")); el("stage").focus(); }
});
el("btnRubrik").onclick = rubrik;
el("btnPanduan").onclick = panduan;
el("btnRapor").onclick = rapor;
el("btnExport").onclick = exportDialog;
el("btnImport").onclick = importDialog;
el("btnReset").onclick = function () {
  modal("<h2>Kosongkan semua?</h2><p>Seluruh jawaban, nilai, dan badge di browser ini akan dihapus dan tidak bisa dikembalikan. Export dulu kalau masih dibutuhkan.</p>" +
    '<div class="btnrow"><button class="btn" id="rz">Ya, kosongkan</button><button class="btn ghost" onclick="closeModal()">Batal</button></div>');
  el("rz").onclick = function () { S = fresh(); save(); closeModal(); pembuka(); };
};
if (S.nama || Object.keys(S.m).length) { paintRail(); go(S.cur || MISSIONS[0].id); } else pembuka();

</script>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio Kode — Perancangan Web Lanjutan</title>
<style>
/* =========================================================
   STUDIO KODE — Perancangan Web lanjutan (D3 Administrasi Bisnis)
   Sekeluarga dengan lab lain: kertas & tinta sama, aksen teal
   karena ini ruang kerja teknis: ketik, jalankan, uji.
   ========================================================= */
:root{
  --paper:#F1F2EC; --card:#FBFBF7; --ink:#17202B; --ink-soft:#4A5563; --rule:#CDD1C2;
  --teal:#0F6070; --good:#2E6B45; --bad:#A32020; --warn:#B4700E; --info:#2547C8;
  --sans:"Arial Narrow","Helvetica Neue Condensed","Liberation Sans Narrow",system-ui,sans-serif;
  --serif:Georgia,"Iowan Old Style","Palatino Linotype",serif;
  --mono:ui-monospace,"SFMono-Regular","Consolas","Liberation Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper); color:var(--ink); font-family:var(--serif); font-size:17px; line-height:1.6; -webkit-text-size-adjust:100%}
h1,h2,h3,h4,.u-sans{font-family:var(--sans); letter-spacing:-.01em; font-weight:700; line-height:1.1}
h1{font-size:2.2rem;margin:0}
h2{font-size:1.7rem;margin:0 0 6px}
h3{font-size:1.12rem;margin:20px 0 6px}
p{margin:0 0 .85em; max-width:68ch}
code{font-family:var(--mono); font-size:.88em; background:#E6E9DC; padding:1px 4px; border-radius:2px}
button:focus{outline:2px solid var(--teal); outline-offset:2px}
:focus-visible{outline:3px solid var(--teal); outline-offset:2px}

.wrap{display:grid; grid-template-columns:250px minmax(0,1fr); min-height:100vh}
.rail{background:var(--ink); color:#E7EAE2; padding:18px 15px 40px; position:sticky; top:0; align-self:start; height:100vh; overflow:auto; -webkit-overflow-scrolling:touch}
.stage{padding:28px 30px 80px; max-width:1100px; min-width:0}

.wm{font-family:var(--sans); font-size:1.3rem; line-height:1}
.wm span{display:block; font-family:var(--mono); font-size:.66rem; color:#9AA69B; margin-top:5px; letter-spacing:.02em}
.who{margin:14px 0; padding:9px 11px; background:#22303F; border-radius:3px; font-family:var(--sans); font-size:.86rem}
.who b{display:block; font-size:1rem}
.who em{display:block; color:#9AA69B; font-style:normal; font-family:var(--mono); font-size:.7rem; margin-top:3px}
.xp{height:6px; background:#0E151D; border-radius:99px; margin-top:8px; overflow:hidden}
.xp i{display:block; height:100%; background:#4FA8B8; width:0; transition:width .6s ease}
.blok{margin:15px 0 5px; font-family:var(--sans); font-size:.78rem; color:#8E9A8F}
.mlist{list-style:none; margin:0; padding:0}
.mlist button{width:100%; text-align:left; background:none; border:0; color:#D8DDD3; cursor:pointer; font-family:var(--sans); font-size:.92rem; padding:6px 8px 6px 25px; border-radius:3px; position:relative; line-height:1.25}
.mlist button:hover{background:#22303F}
.mlist button[aria-current="true"]{background:#2C3C4E; color:#fff}
.mlist button:before{content:attr(data-n); position:absolute; left:6px; top:6px; font-family:var(--mono); font-size:.68rem; color:#7E8A80}
.mlist button.done:before{content:"\2713"; color:#4FA8B8}
.mlist button.locked{opacity:.4; cursor:not-allowed}
.mlist .w{font-family:var(--mono); font-size:.66rem; opacity:.65}
.tools{margin-top:18px; border-top:1px solid #2C3C4E; padding-top:12px; display:grid; gap:5px}
.tools button{background:none; border:1px solid #3A4C60; color:#C9D0C6; font-family:var(--sans); font-size:.84rem; padding:5px 9px; border-radius:3px; cursor:pointer; text-align:left}
.tools button:hover{background:#22303F; color:#fff}
.badges{display:flex; gap:5px; flex-wrap:wrap; margin-top:8px}
.badge{font-family:var(--sans); font-size:.74rem; border:1px solid #3A4C60; color:#9AA69B; padding:2px 7px; border-radius:99px}
.badge.on{background:#4FA8B8; color:#0E262C; border-color:#4FA8B8}

.tag{font-family:var(--sans); font-size:.88rem; color:var(--teal); display:flex; align-items:center; gap:8px; margin-bottom:8px}
.tag:before{content:""; width:28px; height:4px; background:var(--teal)}
.mt{display:flex; gap:10px; align-items:baseline; margin-bottom:5px}
.mt .no{font-family:var(--mono); font-size:.92rem; color:var(--ink-soft)}
.goal{font-family:var(--sans); font-size:1.02rem; color:var(--ink-soft); max-width:64ch; margin-bottom:16px}
.brief{border-left:4px solid var(--rule); padding-left:17px; margin-bottom:18px}
.note{background:#E6E9DC; border-radius:3px; padding:11px 15px; font-size:.92rem; margin-bottom:18px; max-width:72ch}
.note b{font-family:var(--sans)}

/* ---------- studio: editor + pratinjau ---------- */
.studio{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:14px; margin-bottom:14px}
.pane{border:1px solid var(--rule); border-radius:4px; background:var(--card); display:flex; flex-direction:column; min-width:0}
.pane>header{background:var(--ink); color:#E7EAE2; font-family:var(--sans); font-size:.86rem; padding:6px 11px; display:flex; justify-content:space-between; align-items:center; gap:8px}
.pane>header .tabs{display:flex; gap:3px}
.pane>header .tabs button{background:none; border:0; color:#9AA69B; font-family:var(--mono); font-size:.72rem; padding:2px 7px; border-radius:3px; cursor:pointer}
.pane>header .tabs button[aria-pressed="true"]{background:#3A4C60; color:#fff}
textarea.code{
  width:100%; border:0; border-radius:0 0 4px 4px; resize:vertical; padding:10px 12px;
  font-family:var(--mono); font-size:.78rem; line-height:1.55; color:var(--ink); background:#fff;
  min-height:300px; tab-size:2; white-space:pre; overflow-wrap:normal; overflow-x:auto;
}
.frameBox{background:#fff; border-radius:0 0 4px 4px; overflow:auto; padding:8px; display:flex; justify-content:center}
iframe.prev{border:1px solid var(--rule); background:#fff; width:100%; height:330px; display:block}
iframe.prev.w360{width:360px; flex:none}
iframe.prev.w768{width:768px; flex:none}

.checks{border:1px solid var(--rule); border-radius:4px; background:var(--card); margin-bottom:16px; overflow:hidden}
.checks>header{background:var(--teal); color:#fff; font-family:var(--sans); font-size:.9rem; padding:7px 13px; display:flex; justify-content:space-between}
.checks ul{list-style:none; margin:0; padding:9px 13px}
.checks li{position:relative; padding:5px 0 5px 27px; font-size:.93rem; max-width:74ch}
.checks li:before{position:absolute; left:2px; top:5px; font-family:var(--mono); font-size:.86rem}
.checks li.ok:before{content:"\2713"; color:var(--good)}
.checks li.no:before{content:"\00D7"; color:var(--bad)}
.checks li.skip:before{content:"?"; color:var(--warn)}
.checks li em{color:var(--ink-soft); font-style:italic}
.checks li .w{font-family:var(--mono); font-size:.72rem; color:var(--ink-soft)}

.checks li .cara{font-size:.88rem; color:var(--ink-soft); margin:4px 0 2px; padding:6px 10px; background:#EEF1E7; border-left:3px solid var(--teal); border-radius:2px; max-width:70ch}
.checks li .cara b{font-family:var(--sans); color:var(--ink)}
.checks li.no .cara{background:#F7EDEC; border-left-color:var(--bad)}
.bar{display:flex; gap:9px; flex-wrap:wrap; align-items:center; margin-bottom:16px}
.btn{font-family:var(--sans); font-size:.98rem; background:var(--ink); color:#fff; border:0; padding:9px 18px; border-radius:3px; cursor:pointer}
.btn:hover{background:#0E151D}
.btn.go{background:var(--teal)} .btn.go:hover{background:#0A4652}
.btn.ghost{background:none; color:var(--ink); border:1px solid var(--ink)}
.btn.ghost:hover{background:#E6E9DC}
.btn:disabled{opacity:.45; cursor:not-allowed}
.meterline{font-family:var(--mono); font-size:.76rem; color:var(--ink-soft)}
.meterline b{font-family:var(--sans); font-size:1rem; color:var(--ink)}

.score{border:1px solid var(--ink); border-radius:4px; overflow:hidden; margin-bottom:18px}
.score>header{background:var(--ink); color:#E7EAE2; font-family:var(--sans); font-size:.92rem; padding:7px 13px; display:flex; justify-content:space-between}
.score .body{background:var(--card); padding:14px}
.score .v{font-family:var(--sans); font-size:2.3rem; line-height:1}
.score .track{height:8px; background:#E2E5DA; border-radius:99px; overflow:hidden; margin:7px 0 10px}
.score .track i{display:block; height:100%; width:0; background:var(--teal); transition:width .6s ease}

.files{display:flex; gap:4px; flex-wrap:wrap; margin-bottom:8px}
.files button{font-family:var(--mono); font-size:.76rem; background:#fff; border:1px solid var(--rule); padding:5px 10px; border-radius:3px; cursor:pointer}
.files button[aria-pressed="true"]{background:var(--teal); color:#fff; border-color:var(--teal)}
.files button.err{border-color:var(--bad); color:var(--bad)}

label.fl{display:block; font-family:var(--sans); font-size:.9rem; margin-bottom:3px}
input[type=text],textarea:not(.code){width:100%; font-family:var(--serif); font-size:1rem; color:var(--ink); background:#fff; border:1px solid var(--rule); border-radius:3px; padding:8px 10px; margin-bottom:12px}
.card{background:var(--card); border:1px solid var(--rule); border-radius:4px; padding:15px 17px; margin-bottom:15px}
.hint{font-family:var(--mono); font-size:.73rem; color:var(--ink-soft); margin:-6px 0 12px}
table.t{width:100%; border-collapse:collapse; font-size:.9rem; margin:10px 0 14px}
table.t th,table.t td{border-bottom:1px solid var(--rule); padding:6px 7px; text-align:left}
table.t th{font-family:var(--sans); font-size:.86rem}
table.t td.n{font-family:var(--mono); text-align:right}
.modal{position:fixed; top:0; right:0; bottom:0; left:0; background:rgba(23,32,43,.72); display:grid; place-items:center; padding:16px; z-index:60}
.modal[hidden]{display:none}
.sheet{background:var(--paper); border-radius:5px; padding:22px; max-width:760px; width:100%; max-height:88vh; overflow:auto}
.toast{position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:var(--ink); color:#fff; font-family:var(--sans); padding:10px 17px; border-radius:3px; z-index:70; max-width:88vw}
.toast[hidden]{display:none}
.rep{font-family:var(--mono); font-size:.76rem; line-height:1.5; white-space:pre; min-height:220px}

@media (max-width:980px){
  .studio{grid-template-columns:1fr}
  iframe.prev{height:280px}
}
@media (max-width:820px){
  .wrap{grid-template-columns:1fr}
  .rail{position:static; height:auto; padding-bottom:14px}
  .stage{padding:20px 14px 70px}
  h1{font-size:1.7rem} h2{font-size:1.35rem}
  textarea.code{min-height:220px; font-size:.74rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{.rail,.bar,.tools,.modal{display:none!important} body{background:#fff} .stage{max-width:none;padding:0}}
</style>
</head>
<body>
<div class="wrap">
  <nav class="rail" aria-label="Daftar tantangan">
    <div class="wm">STUDIO KODE<span>perancangan web lanjutan &middot; d3 adm. bisnis</span></div>
    <div class="who" id="who"></div>
    <div id="nav"></div>
    <div class="tools">
      <button id="btnRef">Buku acuan</button>
      <button id="btnRapor">Rapor saya</button>
      <button id="btnTerbit">Cara menerbitkan situs</button>
      <button id="btnExport">Export jawaban</button>
      <button id="btnImport">Import jawaban</button>
      <button id="btnReset">Kosongkan</button>
    </div>
  </nav>
  <main class="stage" id="stage" tabindex="-1"></main>
</div>
<div class="modal" id="modal" hidden><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast" hidden></div>
<script>
/* =======================================================================
   STUDIO KODE \u2014 Perancangan Web lanjutan
   Mahasiswa menulis HTML dan CSS sendiri. Pratinjau tampil langsung,
   lalu penguji memeriksa halaman yang SUDAH JADI di dalam iframe:
   struktur, atribut, gaya terhitung, dan ukuran sebenarnya.
   Tidak ada kunci jawaban yang bisa ditebak \u2014 yang dinilai hasil kerjanya.
   ======================================================================= */
"use strict";

var KEY = "studiokode.v1";
var BLOK = { 1: "Dasar \u2014 struktur dan isi", 2: "Menengah \u2014 tampilan dan tata letak", 3: "Lanjutan \u2014 situs utuh" };
var LEVELS = [
  { at: 0, t: "Anak Ketik" }, { at: 160, t: "Perakit Halaman" },
  { at: 330, t: "Penata Tampilan" }, { at: 500, t: "Perancang Situs" },
  { at: 680, t: "Tukang Web" }
];
var BADGES = [
  { id: "kerangka", t: "Kerangka Benar" }, { id: "semantik", t: "Tag Bermakna" },
  { id: "gambar", t: "Gambar Tertib" }, { id: "kartu", t: "Komponen Rapi" },
  { id: "warna", t: "Kontras Lolos" }, { id: "tataletak", t: "Tata Letak Lentur" },
  { id: "navigasi", t: "Navigasi Jelas" }, { id: "formulir", t: "Formulir Terbaca" },
  { id: "boss", t: "Pemburu Bug" }, { id: "proyek", t: "Situs Terbit" },
  { id: "bersih", t: "Lolos Sekali Jalan" }
];

/* ---------------- state ---------------- */
var S = null;
function fresh() { return { v: 1, nama: "", npm: "", xp: 0, badges: [], m: {}, cur: null }; }
function load() {
  try { var r = localStorage.getItem(KEY); S = r ? JSON.parse(r) : fresh(); }
  catch (e) { S = fresh(); }
  if (!S || S.v !== 1) S = fresh();
  if (!S.m) S.m = {}; if (!S.badges) S.badges = [];
}
var gagalSimpan = false;
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) {
    if (!gagalSimpan) { gagalSimpan = true; toast("Browser menolak menyimpan. Tab ini mungkin mode Private \u2014 pakai Export jawaban sebelum menutup."); }
  }
}
function award(id) {
  if (S.badges.indexOf(id) < 0) {
    S.badges.push(id);
    for (var i = 0; i < BADGES.length; i++) if (BADGES[i].id === id) { toast("Badge baru: " + BADGES[i].t); return; }
  }
}
function levelOf(xp) {
  var o = LEVELS[0];
  for (var i = 0; i < LEVELS.length; i++) if (xp >= LEVELS[i].at) o = LEVELS[i];
  return o;
}
function finish(id, score, data) {
  var prev = S.m[id] ? S.m[id].score : 0;
  var old = S.m[id] || {};
  S.m[id] = {
    score: Math.max(prev, Math.round(score)),
    runs: old.runs || 0, hint: old.hint || 0,
    data: data || old.data || {}, at: Date.now()
  };
  S.xp = 0;
  for (var k in S.m) S.xp += S.m[k].score;
  save(); paintRail();
}

/* ---------------- helper ---------------- */
function el(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]; }); }
var tt = null;
function toast(m) { var t = el("toast"); t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(function () { t.hidden = true; }, 4200); }
function modal(h) { el("sheet").innerHTML = h; el("modal").hidden = false; }
function closeModal() { el("modal").hidden = true; }
function inArr(a, v) { return a && a.indexOf(v) >= 0; }

/* ---------------- warna dan kontras ----------------
   Rasio kontras dihitung dari gaya yang benar-benar dipakai browser,
   bukan dari kode yang ditulis \u2014 jadi warna warisan pun terhitung. */
function toRgb(str) {
  var m = String(str || "").match(/rgba?\(([^)]+)\)/);
  if (!m) return null;
  var p = m[1].split(",");
  var a = p.length > 3 ? parseFloat(p[3]) : 1;
  return { r: parseFloat(p[0]), g: parseFloat(p[1]), b: parseFloat(p[2]), a: a };
}
function lum(c) {
  function f(v) { v = v / 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }
  return 0.2126 * f(c.r) + 0.7152 * f(c.g) + 0.0722 * f(c.b);
}
function bgOf(win, node) {
  var e = node;
  while (e && e.nodeType === 1) {
    var c = toRgb(win.getComputedStyle(e).backgroundColor);
    if (c && c.a > 0.1) return c;
    e = e.parentNode;
  }
  return { r: 255, g: 255, b: 255, a: 1 };
}
function contrastOf(win, node) {
  var fg = toRgb(win.getComputedStyle(node).color);
  if (!fg) return null;
  var bg = bgOf(win, node);
  var a = lum(fg), b = lum(bg);
  var hi = Math.max(a, b), lo = Math.min(a, b);
  return (hi + 0.05) / (lo + 0.05);
}

/* ---------------- alat bantu untuk penguji ---------------- */
function ctxOf(fr) {
  var doc = fr.contentDocument, win = fr.contentWindow;
  var layoutOK = false;
  try { layoutOK = doc.body && doc.body.getBoundingClientRect().height > 0; } catch (e) {}
  return {
    doc: doc, win: win, layoutOK: layoutOK,
    q: function (s) { try { return doc.querySelector(s); } catch (e) { return null; } },
    all: function (s) { try { return [].slice.call(doc.querySelectorAll(s)); } catch (e) { return []; } },
    st: function (n) { return n ? win.getComputedStyle(n) : null; },
    px: function (v) { return parseFloat(v) || 0; },
    h: function (n) { try { return n.getBoundingClientRect().height; } catch (e) { return 0; } },
    w: function (n) { try { return n.getBoundingClientRect().width; } catch (e) { return 0; } },
    kontras: function (n) { return contrastOf(win, n); },
    src: "",            /* kode HTML mentah, diisi runner */
    css: "",            /* kode CSS mentah */
    lebar: 0,           /* lebar iframe saat pengujian */
    /* halaman menggulir ke samping? tanda tata letak bocor */
    bocor: function () {
      try { return doc.documentElement.scrollWidth > doc.documentElement.clientWidth + 2; } catch (e) { return false; }
    },
    teks: function (n) { return n ? String(n.textContent || "").replace(/\s+/g, " ").trim() : ""; }
  };
}

/* jalankan kode di iframe pada satu lebar, lalu panggil cb(ctx)
   Memakai document.write, bukan srcdoc: sinkron, didukung semua peramban,
   dan tidak bergantung pada onload yang bisa terlambat. */
function gabung(html, css) {
  if (!css) return html;
  if (/<\/head>/i.test(html)) return html.replace(/<\/head>/i, "<style>\n" + css + "\n</style></head>");
  if (/<body[^>]*>/i.test(html)) return html.replace(/<body([^>]*)>/i, "<body$1><style>\n" + css + "\n</style>");
  return "<style>\n" + css + "\n</style>\n" + html;
}
function tulisKe(fr, isi) {
  try {
    var d = fr.contentDocument || (fr.contentWindow && fr.contentWindow.document);
    if (!d) return false;
    d.open(); d.write(isi); d.close();
    return true;
  } catch (e) { return false; }
}
function jalankan(fr, html, css, lebar, cb) {
  fr.style.width = (lebar || 1280) + "px";
  tulisKe(fr, gabung(html, css));
  setTimeout(function () {
    var c = ctxOf(fr);
    c.src = html; c.css = css; c.lebar = lebar;
    cb(c);
  }, 40);
}

/* uji satu tantangan: dua lintasan lebar (360 dan 1280) */
function uji(fr, html, css, checks, cb) {
  var hasil = [], perlu360 = false;
  for (var i = 0; i < checks.length; i++) if (checks[i].w === 360) perlu360 = true;
  function lintasan(lebar, next) {
    jalankan(fr, html, css, lebar, function (c) {
      for (var j = 0; j < checks.length; j++) {
        var ch = checks[j], lb = ch.w || 1280;
        if (lb !== lebar) continue;
        var r;
        try { r = ch.fn(c); } catch (e) { r = false; }
        if (r === "skip" || (ch.layout && !c.layoutOK)) r = "skip";
        hasil[j] = r;
      }
      next();
    });
  }
  lintasan(1280, function () {
    if (!perlu360) { fr.className = "prev"; cb(hasil); return; }
    lintasan(360, function () { cb(hasil); });
  });
}

function nilaiDari(checks, hasil, runs, hint) {
  var dapat = 0, maks = 0, skip = 0;
  for (var i = 0; i < checks.length; i++) {
    var w = checks[i].w2 || 1;
    if (hasil[i] === "skip") { skip++; continue; }
    maks += w;
    if (hasil[i]) dapat += w;
  }
  var dasar = maks ? dapat / maks * 100 : 0;
  var denda = Math.min(18, Math.max(0, (runs - 3) * 3)) + (hint ? 10 : 0);
  return { nilai: Math.max(0, Math.round(dasar - denda)), dasar: Math.round(dasar), denda: denda, skip: skip };
}
/* =======================================================================
   DAFTAR TANTANGAN
   Setiap penguji menerima ctx: q/all (querySelector), st (gaya terhitung),
   h/w (ukuran sebenarnya), kontras, bocor, teks, src, css, layoutOK.
   w: 360 berarti diuji pada lebar 360 piksel.
   layout: true berarti butuh tata letak nyata (dilewati kalau tak tersedia).
   w2 adalah bobot butir; kosong berarti 1.
   ======================================================================= */

function hd(c) { /* urutan heading pada halaman */
  return c.all("h1,h2,h3,h4,h5,h6").map(function (n) { return +n.tagName.charAt(1); });
}
function lompat(a) {
  for (var i = 1; i < a.length; i++) if (a[i] - a[i - 1] > 1) return true;
  return false;
}
var TEKS_MALAS = ["klik di sini", "di sini", "selengkapnya", "baca", "link", "tautan", "lihat"];

var TANTANGAN = [
{

  note: "<b>Yang diuji adalah gaya terhitung,</b> jadi warna yang diwarisi dari elemen induk pun terbaca penguji. Kalau kontrasnya gagal, coba gelapkan teks atau terangkan latar \u2014 angka rasionya ditampilkan di hasil uji.",

  html: '<!DOCTYPE html>\n<html lang="id">\n<head>\n  <meta charset="UTF-8">\n  <meta name="viewport" content="width=device-width, initial-scale=1">\n  <title>Tentang \u2014 Kopi Kemuning</title>\n</head>\n<body>\n  <main>\n    <h1>Tentang Kopi Kemuning</h1>\n    <p>Kami menyangrai robusta dari kebun sendiri di lereng Kemuning sejak 2019, dan mengirim ke empat belas kota.</p>\n    <p>Baca <a href="produk.html">daftar kopi yang tersedia</a> untuk melihat pilihan sangrai.</p>\n  </main>\n</body>\n</html>\n',
  css: "/* Atur warna, ukuran huruf, dan tinggi baris. */\nbody {\n\n}\n",
  langkah: [
    "Buka tab CSS dan mulai dari body: color, background, font-size, line-height.",
    "Jalankan uji \u2014 rasio kontras yang terukur ditampilkan di hasilnya.",
    "Kalau kontras gagal, gelapkan warna teks atau terangkan latarnya.",
    "Beri tautan text-decoration: underline.",
    "Batasi lebar kolom teks dengan main { max-width: 700px; margin: 0 auto; }"
  ],
  contoh: [
    { nm: "Dasar keterbacaan", kode: "body {\n  color: #1b2430;\n  background: #fbfbf7;\n  font-size: 17px;\n  line-height: 1.6;\n}", ket: "Empat baris ini memenuhi ambang kontras, ukuran huruf, dan tinggi baris sekaligus." },
    { nm: "Tautan yang terlihat", kode: "a {\n  color: #0b5d6b;\n  text-decoration: underline;\n}", ket: "Garis bawah membuat tautan tetap terlihat bagi yang buta warna." },
    { nm: "Lebar kolom nyaman", kode: "main {\n  max-width: 700px;\n  margin: 0 auto;\n  padding: 0 16px;\n}", ket: "Baris teks yang terlalu panjang membuat mata kehilangan barisnya." }
  ],
  checks: [
    { b: "Di CSS tulis body { font-size: 17px; }", t: "Ukuran huruf badan minimal 16px", w2: 2, fn: function (c) { var b = c.q("body"); return !!b && c.px(c.st(b).fontSize) >= 16; } },
    { b: "Di CSS tulis body { line-height: 1.6; }", t: "Tinggi baris minimal 1,4", w2: 2, fn: function (c) {
        var b = c.q("p") || c.q("body"); if (!b) return false;
        var lh = c.st(b).lineHeight, fs = c.px(c.st(b).fontSize);
        if (lh && lh !== "normal") {
          var v = c.px(lh);
          if (v > 4) return v / (fs || 16) >= 1.38;   /* nilai piksel */
          if (v > 0) return v >= 1.38;                /* nilai kelipatan */
        }
        var m = (c.css || "").match(/line-height\s*:\s*([0-9.]+)(px|em|rem)?/i);
        if (!m) return false;
        var n = parseFloat(m[1]);
        return m[2] === "px" ? n / (fs || 16) >= 1.38 : n >= 1.38; } },
    { b: "Gelapkan teks atau terangkan latar, misalnya body { color: #1b2430; background: #fbfbf7; }. Rasio terukur muncul di hasil uji.", t: "Kontras teks paragraf minimal 4,5:1", w2: 3, fn: function (c) {
        var p = c.q("p"); if (!p) return false;
        var r = c.kontras(p); c.catatan = r ? "rasio terukur " + r.toFixed(2) + ":1" : "";
        return r != null && r >= 4.5; } },
    { b: "Beri h1 warna gelap yang sama dengan teks badan, misalnya h1 { color: #1b2430; }", t: "Kontras judul minimal 4,5:1", w2: 2, fn: function (c) {
        var h = c.q("h1"); if (!h) return false;
        var r = c.kontras(h); return r != null && r >= 4.5; } },
    { b: "Tulis background pada body, misalnya body { background: #fbfbf7; }", t: "Latar halaman diatur sendiri, tidak dibiarkan bawaan", w2: 2, fn: function (c) {
        return /background(-color)?\s*:/i.test(c.css); } },
    { b: "Tulis a { color: #0b5d6b; text-decoration: underline; }", t: "Tautan diberi garis bawah, bukan hanya dibedakan warna", w2: 3, fn: function (c) {
        var a = c.q("a"); if (!a) return false;
        var td = c.st(a).textDecorationLine || c.st(a).textDecoration || "";
        return /underline/.test(td) || c.px(c.st(a).borderBottomWidth) > 0; } },
    { b: "Tulis main { max-width: 700px; margin: 0 auto; }", t: "Lebar kolom teks dibatasi agar nyaman dibaca", w2: 2, layout: true, fn: function (c) {
        var m = c.q("main") || c.q("body"); if (!m) return false;
        var mw = c.st(m).maxWidth;

{
  id: "k6", blok: 2, no: 6, title: "Tata letak yang lentur",
  goal: "Tiga kartu berdampingan di laptop, menumpuk sendiri di ponsel, tanpa satu pun angka lebar tetap.",
  brief:
    "<p>Inilah tantangan yang membedakan orang yang paham CSS dari orang yang menempel potongan kode. Tugasnya sederhana diucapkan: <b>tiga kartu berdampingan di layar lebar, menumpuk di layar sempit</b>.</p>" +
    "<p>Cara lamanya memakai lebar persen dan berharap. Cara sekarang memakai <code>flex-wrap</code> atau <code>grid</code>, lalu membiarkan browser yang memutuskan kapan harus menumpuk.</p>" +
    "<p>Penguji akan memuat halamanmu dua kali: pada <b>1280 piksel</b> ketiga kartu harus sejajar, dan pada <b>360 piksel</b> harus tersusun ke bawah. Tidak ada yang bisa memalsukan ini kecuali tata letaknya memang benar.</p>",
  note: "<b>Cara membacanya di hasil uji:</b> \u201csejajar\u201d berarti ketiga kartu punya posisi atas yang sama; \u201cmenumpuk\u201d berarti posisi atasnya berbeda. Itu yang diukur penguji, bukan kode yang kamu tulis \u2014 jadi jalan mana pun boleh, selama hasilnya benar.",
  hint: "Salah satu cara: .daftar { display: flex; flex-wrap: wrap; gap: 16px; } lalu .kartu { flex: 1 1 260px; } \u2014 angka 260px itu lebar minimum sebelum menumpuk, bukan lebar tetap.",
  html: '<!DOCTYPE html>\n<html lang="id">\n<head>\n  <meta charset="UTF-8">\n  <meta name="viewport" content="width=device-width, initial-scale=1">\n  <title>Daftar kopi \u2014 Kopi Kemuning</title>\n</head>\n<body>\n  <main>\n    <h1>Daftar kopi</h1>\n    <div class="daftar">\n      <article class="kartu"><h2>Robusta Kemuning</h2><p><strong>Rp32.000</strong></p></article>\n      <article class="kartu"><h2>Robusta Sangrai Gelap</h2><p><strong>Rp35.000</strong></p></article>\n      <article class="kartu"><h2>Robusta Bubuk Halus</h2><p><strong>Rp30.000</strong></p></article>\n    </div>\n  </main>\n</body>\n</html>\n',
  css: "/* Buat ketiga kartu sejajar di layar lebar dan menumpuk di layar sempit. */\n.daftar {\n\n}\n.kartu {\n\n}\n",
  langkah: [
    "HTML-nya sudah disiapkan; kerjakan hanya di tab CSS.",
    "Beri .daftar display: flex dan gap.",
    "Tambahkan flex-wrap: wrap supaya kartu boleh turun baris.",
    "Beri .kartu flex: 1 1 260px \u2014 angka itu batas sebelum menumpuk, bukan lebar tetap.",
    "Uji di pratinjau 360 dan penuh: menumpuk di sempit, sejajar di lebar."
  ],
  contoh: [
    { nm: "Kartu sejajar lalu menumpuk", kode: ".daftar {\n  display: flex;\n  flex-wrap: wrap;\n  gap: 16px;\n}\n.kartu {\n  flex: 1 1 260px;\n}", ket: "flex-wrap memberi izin turun baris; 260px menentukan kapan itu terjadi." },
    { nm: "Cara grid", kode: ".daftar {\n  display: grid;\n  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));\n  gap: 16px;\n}", ket: "Hasilnya serupa tanpa perlu mengatur .kartu. Pilih salah satu, jangan keduanya." }
  ],
  checks: [
    { b: "Tulis .daftar { display: flex; }", t: "Wadah memakai flex atau grid", w2: 2, fn: function (c) {
        var d = c.q(".daftar"); if (!d) return false;
        return /flex|grid/.test(c.st(d).display); } },
    { b: "Tambahkan gap: 16px; di dalam .daftar.", t: "Ada jarak antar kartu (gap atau margin)", w2: 2, fn: function (c) {
        var d = c.q(".daftar"), k = c.q(".kartu"); if (!d) return false;
        return c.px(c.st(d).gap) > 0 || c.px(c.st(d).columnGap) > 0 || (k && c.px(c.st(k).marginRight) > 0); } },
    { b: "Setelah display: flex, beri .kartu { flex: 1 1 260px; } supaya ketiganya berbagi baris.", t: "Tiga kartu sejajar pada lebar 1280", w2: 3, layout: true, fn: function (c) {
        var k = c.all(".kartu"); if (k.length < 3) return false;
        var t0 = k[0].getBoundingClientRect().top;
        return Math.abs(k[1].getBoundingClientRect().top - t0) < 6 && Math.abs(k[2].getBoundingClientRect().top - t0) < 6; } },
    { b: "Tambahkan flex-wrap: wrap; pada .daftar. Angka 260px di flex menentukan kapan mulai menumpuk.", t: "Kartu menumpuk ke bawah pada lebar 360", w2: 3, w: 360, layout: true, fn: function (c) {
        var k = c.all(".kartu"); if (k.length < 3) return false;
        return k[1].getBoundingClientRect().top - k[0].getBoundingClientRect().top > 20; } },
    { b: "Cari angka lebar tetap di CSS dan ganti width menjadi max-width. Tambahkan juga img { max-width: 100%; }", t: "Tidak bisa digulir ke samping pada lebar 360", w2: 3, w: 360, layout: true, fn: function (c) { return !c.bocor(); } },
    { b: "Hapus width: \u2026px dari .kartu; cukup flex: 1 1 260px.", t: "Tidak ada lebar tetap dalam piksel pada kartu", w2: 2, fn: function (c) {
        return !/\.kartu[^}]*[^-]width\s*:\s*\d+px/i.test(c.css); } },
    { b: "Tulis main { max-width: 1000px; margin: 0 auto; }", t: "Isi halaman dibatasi lebar maksimum dan dipusatkan", w2: 2, fn: function (c) {
        var m = c.q("main"); if (!m) return false;
        var s = c.st(m);
        return s.maxWidth !== "none" && (s.marginLeft === "auto" || c.px(s.marginLeft) > 8); } }
  ],
  badge: "tataletak"
},
{
  id: "k7", blok: 2, no: 7, title: "Navigasi antar halaman",
  goal: "Bangun navigasi yang bekerja untuk situs beberapa halaman, dan menandai halaman yang sedang dibuka.",
  brief:
    "<p>Sampai di sini kamu selalu mengerjakan satu halaman. Situs sebenarnya punya beberapa, dan navigasi adalah satu-satunya hal yang muncul <b>sama</b> di semuanya.</p>" +
    "<p>Bentuk bakunya: <code>&lt;nav&gt;</code> berisi <code>&lt;ul&gt;</code> berisi <code>&lt;li&gt;</code> berisi <code>&lt;a&gt;</code>. Terlihat bertele-tele, tetapi pembaca layar memakai struktur itu untuk memberitahu penggunanya \u201cdaftar navigasi, tiga tautan\u201d.</p>" +
    "<p><b>Tautan relatif</b> seperti <code>href=\"produk.html\"</code> menunjuk berkas di folder yang sama. Ini yang dipakai situs statis, dan yang nanti bekerja begitu berkasmu diunggah ke GitHub Pages.</p>" +
    "<p><b>Halaman yang sedang dibuka</b> ditandai <code>aria-current=\"page\"</code>, supaya pengguna tahu posisinya.</p>",
  note: "<b>Kenapa tidak href=\"#\":</b> tanda pagar kosong membuat tautan yang tidak menuju ke mana pun. Di tugas ini setiap tautan harus menunjuk berkas nyata yang akan kamu buat di tantangan terakhir.",
  hint: "&lt;nav aria-label=\"Menu utama\"&gt;&lt;ul&gt;&lt;li&gt;&lt;a href=\"index.html\" aria-current=\"page\"&gt;Beranda&lt;/a&gt;&lt;/li&gt;&lt;li&gt;&lt;a href=\"produk.html\"&gt;Produk&lt;/a&gt;&lt;/li&gt;&lt;li&gt;&lt;a href=\"kontak.html\"&gt;Kontak&lt;/a&gt;&lt;/li&gt;&lt;/ul&gt;&lt;/nav&gt;",
  html: '<!DOCTYPE html>\n<html lang="id">\n<head>\n  <meta charset="UTF-8">\n  <meta name="viewport" content="width=device-width, initial-scale=1">\n  <title>Beranda \u2014 Kopi Kemuning</title>\n</head>\n<body>\n  <header>\n    <!-- Bangun navigasi di sini -->\n  </header>\n  <main>\n    <h1>Kopi Kemuning</h1>\n  </main>\n  <footer>\n    <!-- Tambahkan keterangan pemilik dan tahun -->\n  </footer>\n</body>\n</html>\n',
  css: "/* Buat menu berjajar dan hilangkan titik daftarnya. */\n",
  langkah: [
    "Di dalam <header> tulis <nav aria-label=\"Menu utama\">.",
    "Di dalamnya <ul> dengan tiga <li>, masing-masing berisi <a href> ke berkas .html.",
    "Tambahkan aria-current=\"page\" pada tautan Beranda saja.",
    "Di CSS: nav ul { list-style: none; display: flex; gap: 14px; padding: 0; }",
    "Isi <footer> dengan nama kedai dan tahun."
  ],
  contoh: [
    { nm: "Navigasi", kode: "<nav aria-label=\"Menu utama\">\n  <ul>\n    <li><a href=\"index.html\" aria-current=\"page\">Beranda</a></li>\n    <li><a href=\"produk.html\">Produk</a></li>\n    <li><a href=\"kontak.html\">Kontak</a></li>\n  </ul>\n</nav>", ket: "aria-current menandai halaman yang sedang dibuka \u2014 pindahkan sesuai halamannya." },
    { nm: "CSS menu", kode: "nav ul {\n  list-style: none;\n  display: flex;\n  gap: 14px;\n  padding: 0;\n}", ket: "list-style menghilangkan titik, flex membuatnya berjajar." }
  ],
  checks: [
    { b: "Susun: <nav><ul><li><a href=\"index.html\">Beranda</a></li> \u2026 </ul></nav> dengan tiga butir.", t: "Ada <nav> berisi <ul> dengan minimal tiga <li>", w2: 3, fn: function (c) {
        var n = c.q("nav"); return !!n && n.querySelectorAll("ul li").length >= 3; } },
    { b: "Setiap href menunjuk berkas: index.html, produk.html, kontak.html.", t: "Setiap butir menu berupa <a> dengan href ke berkas .html", w2: 3, fn: function (c) {
        var a = c.all("nav a[href]"); if (a.length < 3) return false;
        for (var i = 0; i < a.length; i++) if (!/\.html$/i.test(a[i].getAttribute("href") || "")) return false;
        return true; } },
    { b: "Ganti href=\"#\" dengan nama berkas yang sebenarnya.", t: "Tidak ada tautan href=\"#\" di navigasi", w2: 2, fn: function (c) {
        return c.all("nav a").filter(function (a) { return (a.getAttribute("href") || "") === "#"; }).length === 0; } },
    { b: "Pada tautan halaman yang sedang dibuka tambahkan aria-current=\"page\" \u2014 tepat satu tautan saja.", t: "Halaman aktif ditandai aria-current=\"page\"", w2: 3, fn: function (c) {
        return c.all('nav a[aria-current="page"]').length === 1; } },
    { b: "Tulis <nav aria-label=\"Menu utama\">.", t: "<nav> diberi aria-label atau judul", w2: 2, fn: function (c) {
        var n = c.q("nav"); return !!n && ((n.getAttribute("aria-label") || "").length > 2 || !!n.querySelector("h2")); } },
    { b: "Tulis nav ul { list-style: none; padding: 0; }", t: "Titik daftar dihilangkan lewat CSS", w2: 2, fn: function (c) {
        var u = c.q("nav ul"); if (!u) return false;
        if (c.st(u).listStyleType === "none") return true;
        return /list-style(-type)?\s*:\s*none/i.test(c.css || ""); } },
    { b: "Tambahkan display: flex; gap: 14px; pada nav ul.", t: "Menu berjajar menyamping pada lebar 1280", w2: 2, layout: true, fn: function (c) {
        var li = c.all("nav li"); if (li.length < 2) return false;
        return Math.abs(li[1].getBoundingClientRect().top - li[0].getBoundingClientRect().top) < 6; } },
    { b: "Isi footer dengan nama dan tahun, misalnya Kopi Kemuning \u00b7 Palembang \u00b7 2026.", t: "Footer memuat nama pemilik dan tahun", w2: 2, fn: function (c) {
        var f = c.q("footer"); return !!f && /20\d\d/.test(c.teks(f)) && c.teks(f).length > 12; } }
  ],
  badge: "navigasi"
},
{
  id: "k8", blok: 2, no: 8, title: "Formulir pesanan",
  goal: "Buat formulir yang bisa diisi orang dengan satu tangan, dan terbaca pembaca layar.",
  brief:
    "<p>Formulir adalah tempat uang berpindah, dan tempat paling banyak pelanggan menyerah di tengah jalan. Hampir semua sebabnya teknis, bukan desain.</p>" +
    "<p><b>Setiap kolom wajib punya <code>&lt;label&gt;</code></b> yang terhubung lewat <code>for</code> dan <code>id</code>. Placeholder bukan pengganti label: teksnya hilang begitu orang mulai mengetik, dan pembaca layar sering melewatkannya.</p>" +
    "<p><b>Tipe input yang tepat</b> mengubah papan ketik di ponsel: <code>type=\"email\"</code> memunculkan tanda @, <code>type=\"tel\"</code> memunculkan angka. Ini perbedaan yang langsung terasa.</p>" +
    "<p>Formulir pesanan Kopi Kemuning butuh: nama, email, nomor telepon, pilihan sangrai, jumlah, catatan, dan tombol kirim.</p>",
  note: "<b>Uji satu tangan:</b> buka formulirmu di ponsel dan coba isi sambil berdiri, satu tangan. Kolom yang terlalu pendek, papan ketik yang salah, dan tombol yang terlalu kecil akan langsung terasa \u2014 jauh sebelum ada pelanggan yang mengeluh.",
  hint: "Setiap kolom: &lt;label for=\"nama\"&gt;Nama&lt;/label&gt;&lt;input id=\"nama\" name=\"nama\" type=\"text\" required&gt;. Untuk pilihan sangrai pakai &lt;select&gt; atau &lt;fieldset&gt; dengan &lt;legend&gt; berisi radio. Beri input padding agar tingginya cukup.",
  html: '<!DOCTYPE html>\n<html lang="id">\n<head>\n  <meta charset="UTF-8">\n  <meta name="viewport" content="width=device-width, initial-scale=1">\n  <title>Pesan \u2014 Kopi Kemuning</title>\n</head>\n<body>\n  <main>\n    <h1>Formulir pesanan</h1>\n    <form>\n      <!-- Bangun kolom-kolomnya di sini -->\n    </form>\n  </main>\n</body>\n</html>\n',
  css: "/* Beri kolom lebar penuh dan tinggi yang nyaman disentuh. */\n",
  langkah: [
    "Untuk setiap kolom tulis pasangannya: <label for=\"x\"> lalu <input id=\"x\">.",
    "Pakai type yang tepat: text, email, tel.",
    "Tambahkan required pada kolom yang wajib.",
    "Tambahkan <select> untuk sangrai dan <textarea> untuk catatan, keduanya berlabel.",
    "Tutup dengan <button type=\"submit\">.",
    "Di CSS beri input padding supaya nyaman disentuh."
  ],
  contoh: [
    { nm: "Satu kolom lengkap", kode: "<label for=\"nama\">Nama</label>\n<input id=\"nama\" name=\"nama\" type=\"text\" required>", ket: "Nilai for dan id harus sama. Itu yang menghubungkan label dengan kolomnya." },
    { nm: "Kolom email dan telepon", kode: "<label for=\"surel\">Email</label>\n<input id=\"surel\" name=\"email\" type=\"email\" required>\n\n<label for=\"tel\">Telepon</label>\n<input id=\"tel\" name=\"tel\" type=\"tel\">", ket: "type yang tepat mengubah papan ketik di ponsel." },
    { nm: "Pilihan dan catatan", kode: "<label for=\"sangrai\">Sangrai</label>\n<select id=\"sangrai\" name=\"sangrai\">\n  <option>Medium</option>\n  <option>Gelap</option>\n</select>\n\n<label for=\"catatan\">Catatan</label>\n<textarea id=\"catatan\" name=\"catatan\"></textarea>\n\n<button type=\"submit\">Kirim pesanan</button>", ket: "Semua kolom, termasuk select dan textarea, butuh label." },
    { nm: "CSS kolom", kode: "input, select, textarea {\n  width: 100%;\n  padding: 12px;\n  font-size: 16px;\n}", ket: "Padding membuat tinggi kolom cukup untuk disentuh." }
  ],
  checks: [
    { b: "Buat <form> berisi minimal empat kolom: input nama, email, telepon, dan satu lagi.", t: "Ada <form> dengan minimal empat kolom isian", w2: 2, fn: function (c) {
        return !!c.q("form") && c.all("form input, form select, form textarea").length >= 4; } },
    { b: "Pasangkan: <label for=\"nama\">Nama</label><input id=\"nama\" type=\"text\">. Nilai for dan id harus sama.", t: "Setiap kolom punya <label> yang terhubung lewat for dan id", w2: 3, fn: function (c) {
        var f = c.all("form input, form select, form textarea").filter(function (n) { return n.type !== "submit" && n.type !== "hidden"; });
        if (!f.length) return false;
        for (var i = 0; i < f.length; i++) {
          var id = f[i].id;
          if (f[i].type === "radio" || f[i].type === "checkbox") {
            if (!id || !c.q('label[for="' + id + '"]')) return false;
            continue;
          }
          if (!id || !c.q('label[for="' + id + '"]')) return false;
        }
        return true; } },
    { b: "Ubah kolom email menjadi type=\"email\" dan telepon menjadi type=\"tel\".", t: "Memakai type=\"email\" dan type=\"tel\"", w2: 3, fn: function (c) {
        return !!c.q('input[type="email"]') && !!c.q('input[type="tel"]'); } },
    { b: "Tambahkan kata required di dalam tag input, minimal pada dua kolom.", t: "Kolom wajib ditandai atribut required", w2: 2, fn: function (c) { return c.all("form [required]").length >= 2; } },
    { b: "Pakai <select id=\"sangrai\"><option>Medium</option><option>Gelap</option></select> beserta labelnya.", t: "Ada pilihan sangrai berupa select atau radio ber-fieldset", w2: 2, fn: function (c) {
        return !!c.q("form select") || (!!c.q("form fieldset legend") && c.all('form input[type="radio"]').length >= 2); } },
    { b: "Tambahkan <label for=\"catatan\">Catatan</label><textarea id=\"catatan\"></textarea>.", t: "Ada <textarea> untuk catatan", fn: function (c) { return !!c.q("form textarea"); } },
    { b: "Tulis <button type=\"submit\">Kirim pesanan</button>.", t: "Tombol kirim memakai <button type=\"submit\">", w2: 2, fn: function (c) {

function acakPecah(n) {
  var kunci = RUSAK.map(function (r) { return r.k; });
  for (var i = kunci.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1)), t = kunci[i];
    kunci[i] = kunci[j]; kunci[j] = t;
  }
  return kunci.slice(0, n);
}

function daftarUji(t, hasil) {
  var urut = [];
  for (var i = 0; i < t.checks.length; i++) urut.push(i);
  if (hasil) {
    urut.sort(function (a, b) {
      function rank(x) { return hasil[x] === false ? 0 : (hasil[x] === "skip" ? 1 : 2); }
      return rank(a) - rank(b) || a - b;
    });
  }
  var li = urut.map(function (i) {
    var c = t.checks[i], r = hasil ? hasil[i] : null;
    var cls = r === "skip" ? "skip" : (r === true ? "ok" : (r === false ? "no" : ""));
    var ket = "";
    if (r === "skip") ket = ' <em>tidak bisa diuji di peramban ini</em>';
    else if (r === false && c.b) ket = '<div class="cara"><b>Cara memperbaiki:</b> ' + esc(c.b) + "</div>";
    else if (r === null && c.b) ket = '<div class="cara"><b>Yang perlu ada:</b> ' + esc(c.b) + "</div>";
    return '<li class="' + cls + '">' + esc(c.t) + ' <span class="w">' + (c.w2 || 1) + " poin" +
      (c.w === 360 ? " \u00b7 diuji di 360px" : "") + "</span>" + ket + "</li>";
  }).join("");
  var lolos = 0, gagal = 0;
  if (hasil) for (var j = 0; j < t.checks.length; j++) { if (hasil[j] === true) lolos++; else if (hasil[j] === false) gagal++; }
  return '<section class="checks"><header><span>Daftar uji</span><span>' +
    (hasil ? lolos + " lolos \u00b7 " + gagal + " belum \u00b7 yang belum ditaruh di atas" : "belum dijalankan \u2014 setiap butir sudah memuat petunjuknya") +
    "</span></header><ul>" + li + "</ul></section>";
}

function go(id) {
  if (jamBoss) { clearInterval(jamBoss); jamBoss = null; }
  clearTimeout(debounce);
  cur = id; S.cur = id; save();
  var t = tById(id); if (!t) return;
  if (t.kind === "proyek") vProyek(t);
  else if (t.kind === "boss") vBoss(t);
  else vKode(t);
  paintRail(); window.scrollTo(0, 0);
}

/* ---------- perpustakaan contoh potongan kode ----------
   Bukan kunci jawaban: potongan umum yang boleh dibaca dan disisipkan,
   seperti membaca dokumentasi. Tidak ada pengurangan nilai. */
function sisip(idEditor, kode) {
  var ta = el(idEditor);
  if (!ta) return;
  var a = ta.selectionStart, b = ta.selectionEnd;
  if (a == null) { ta.value += "\n" + kode; }
  else { ta.value = ta.value.slice(0, a) + kode + ta.value.slice(b); ta.selectionStart = ta.selectionEnd = a + kode.length; }
  ta.focus();
  ta.dispatchEvent(new Event("input", { bubbles: true }));
}
function panelContoh(t, idHtml, idCss) {

    t.contoh.map(function (x, i) {

    }).join("") +

/* ---------- pemeriksaan cepat: kesalahan tulis yang sering bikin bingung ---------- */
function periksaCepat(html, css) {
  var p = [];
  var pasangan = ["html", "head", "body", "main", "header", "footer", "section", "article", "nav", "ul", "ol", "li", "p", "h1", "h2", "h3", "figure", "figcaption", "form", "label", "select", "textarea", "button", "table", "tr", "td", "th", "div", "a", "strong", "em"];
  for (var i = 0; i < pasangan.length; i++) {
    var tg = pasangan[i];
    var buka = (html.match(new RegExp("<" + tg + "(\\s[^>]*)?>", "gi")) || []).length;
    var tutup = (html.match(new RegExp("</" + tg + "\\s*>", "gi")) || []).length;
    if (buka > tutup) p.push("Tag &lt;" + tg + "&gt; dibuka " + buka + " kali tetapi ditutup " + tutup + " kali.");
    else if (tutup > buka) p.push("Ada &lt;/" + tg + "&gt; tanpa pembuka.");
  }
  var bk = (css.match(/\{/g) || []).length, bt = (css.match(/\}/g) || []).length;
  if (bk !== bt) p.push("Kurung kurawal di CSS tidak seimbang: " + bk + " buka, " + bt + " tutup.");
  if (/[a-z-]+\s*:\s*[^;{}\n]+\n\s*[a-z-]+\s*:/i.test(css)) p.push("Sepertinya ada baris CSS yang lupa diakhiri tanda titik koma.");
  if ((html.match(/"/g) || []).length % 2 !== 0) p.push("Jumlah tanda kutip di HTML ganjil \u2014 mungkin ada atribut yang belum ditutup.");
  return p.slice(0, 4);
}

      var data = { html: html, css: css };

/* uji proyek: butir src dibaca dari kode, butir file dijalankan per halaman */
function ujiProyek(F, checks, cb) {
  var hasil = [], sisa = [];
  for (var i = 0; i < checks.length; i++) {
    var c = checks[i];
    if (c.src) { try { hasil[i] = !!c.fn(F); } catch (e) { hasil[i] = false; } }
    else sisa.push(i);
  }
  var tugas = [];
  for (var j = 0; j < sisa.length; j++) {
    var idx = sisa[j], ch = checks[idx];
    tugas.push({ i: idx, file: ch.file || "index", w: ch.w || 1280, ch: ch });
  }
  var p = 0;
  function lanjut() {
    if (p >= tugas.length) { cb(hasil); return; }
    var g = tugas[p], html = F[g.file] || "";
    jalankan(frameUji(), html, F.css || "", g.w, function (c) {
      var r;
      try { r = g.ch.fn(c); } catch (e) { r = false; }
      if (g.ch.layout && !c.layoutOK) r = "skip";
      hasil[g.i] = r; p++; lanjut();
    });
  }
  lanjut();
}

/* =======================================================================
   BUKU ACUAN, PENERBITAN, RAPOR, EKSPOR, PEMBUKA
   ======================================================================= */
function salin(id) {
  var ta = el(id);
  ta.focus(); ta.select();
  try { ta.setSelectionRange(0, ta.value.length); } catch (e) {}
  var ok = false;
  try { ok = document.execCommand("copy"); } catch (e2) { ok = false; }
  if (!ok && navigator.clipboard) {
    navigator.clipboard.writeText(ta.value).then(function () { toast("Tersalin."); },
      function () { toast("Tekan lama di kotak teks, lalu Select All \u2192 Copy."); });
    return;
  }
  toast(ok ? "Tersalin." : "Tekan lama di kotak teks, lalu Select All \u2192 Copy.");
}

function laporan() {
  var L = [];

  L.push("Nama : " + (S.nama || "-"));
  L.push("NPM  : " + (S.npm || "-"));
  L.push("");
  function pad(s, n) { s = String(s); while (s.length < n) s += " "; return s; }
  L.push(pad("Tantangan", 40) + pad("Nilai", 8) + pad("Uji", 6) + "Petunjuk");
  L.push(new Array(66).join("-"));
  var tot = 0, n = 0;
  for (var i = 0; i < TANTANGAN.length; i++) {
    var t = TANTANGAN[i], r = S.m[t.id];
    var j = t.no + ". " + t.title;
    if (j.length > 38) j = j.slice(0, 37) + "\u2026";
    L.push(pad(j, 40) + pad(r ? r.score : "-", 8) + pad(r ? (r.runs || 0) : "-", 6) + (r && r.hint ? "ya" : "-"));
    if (r) { tot += r.score; n++; }
  }
  L.push(new Array(66).join("-"));
  L.push(pad("Rata-rata dari " + n + " tantangan selesai", 40) + (n ? Math.round(tot / n) : 0));
  L.push("");
  var got = [];
  for (var b = 0; b < BADGES.length; b++) if (inArr(S.badges, BADGES[b].id)) got.push(BADGES[b].t);
  L.push("Badge: " + (got.length ? got.join(", ") : "belum ada"));

  L.push("sungguh dirender: struktur, gaya terhitung, dan ukuran sebenarnya.");
  L.push("Bukan dari kecocokan dengan kunci jawaban.");
  return L.join("\n");
}

    '<label class="fl" for="pn">Nama</label><input type="text" id="pn" value="' + esc(S.nama) + '">' +
    '<label class="fl" for="pp">NPM</label><input type="text" id="pp" value="' + esc(S.npm) + '"></div>' +
    '<div class="note"><b>Cara penilaiannya berbeda dari lab sebelumnya.</b> Tidak ada pilihan ganda dan tidak ada kunci jawaban. Penguji memuat halaman yang kamu tulis, lalu memeriksa hasilnya: strukturnya, gaya yang benar-benar dipakai browser, dan ukuran sebenarnya di layar 360 dan 1280 piksel. Jalan mana pun boleh, asal hasilnya benar.</div>' +
    '<div class="note"><b>Tiga uji pertama tiap tantangan gratis;</b> setelah itu tiap uji mengurangi 3 poin sampai batas 18, dan petunjuk mengurangi 10. Bukan untuk menghukum, tetapi supaya kamu membaca pratinjau dan berpikir dulu \u2014 kebiasaan yang membedakan orang yang belajar dari orang yang menebak. Tantangan 9 dan 10 tidak dibatasi.</div>' +
    '<div class="bar"><button class="btn go" id="bGo">Mulai tantangan 1</button>' +
    (Object.keys(S.m).length ? '<button class="btn ghost" id="bLanjut">Lanjutkan yang terakhir</button>' : "") + "</div>";
  el("bGo").onclick = function () {
    S.nama = el("pn").value; S.npm = el("pp").value; save(); go(TANTANGAN[0].id);
  };
  if (el("bLanjut")) el("bLanjut").onclick = function () {
    S.nama = el("pn").value; S.npm = el("pp").value; save(); go(S.cur || TANTANGAN[0].id);
  };
}

/* ---------------- init ---------------- */
load();
el("modal").addEventListener("click", function (e) { if (e.target === el("modal")) closeModal(); });
document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeModal(); });
document.addEventListener("click", function (e) {
  var b = e.target.closest("button[data-go]");
  if (b && !b.disabled) { go(b.getAttribute("data-go")); el("stage").focus(); }
});
el("btnRef").onclick = acuan;
el("btnTerbit").onclick = terbitkan;
el("btnRapor").onclick = rapor;
el("btnExport").onclick = exportDialog;
el("btnImport").onclick = importDialog;
el("btnReset").onclick = function () {
  modal("<h2>Kosongkan semua?</h2><p>Seluruh kode, nilai, dan badge di peramban ini akan dihapus dan tidak bisa dikembalikan. Export dulu kalau masih dibutuhkan.</p>" +
    '<div class="bar"><button class="btn" id="rz">Ya, kosongkan</button><button class="btn ghost" onclick="closeModal()">Batal</button></div>');
  el("rz").onclick = function () { S = fresh(); save(); closeModal(); pembuka(); };
};
if (S.nama || Object.keys(S.m).length) { paintRail(); go(S.cur || TANTANGAN[0].id); } else pembuka();

</script>
</body>
</html>

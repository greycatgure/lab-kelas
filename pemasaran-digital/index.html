<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio UMKM — Simulasi Pemasaran Digital 16 Minggu</title>
<style>
:root{
  --tinta:#131A33; --panel:#1B2447; --panel2:#222C55; --garis:#33406F;
  --emas:#E3B23C; --emas-l:#F3D488; --coral:#D8455F; --hijau:#46B58A;
  --teks:#EDEAE0; --redup:#A7ADC9;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--tinta);
  color:var(--teks);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  font-size:16px; line-height:1.55;
  -webkit-text-size-adjust:100%;
}
h1,h2,h3,.angka{font-family:Georgia,"Iowan Old Style","Times New Roman",serif;font-weight:600}
h1{font-size:1.55rem;line-height:1.2;margin:0}
h2{font-size:1.25rem;margin:0 0 .35rem}
h3{font-size:1.02rem;margin:0 0 .3rem}
p{margin:0 0 .7rem;max-width:66ch}
small{color:var(--redup)}
a{color:var(--emas-l)}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--emas);outline-offset:2px}

.songket{height:8px;background:
  repeating-linear-gradient(135deg,var(--emas) 0 6px,transparent 6px 12px),
  repeating-linear-gradient(45deg,rgba(227,178,60,.45) 0 6px,transparent 6px 12px);
  opacity:.85}
header.bar{display:flex;gap:.8rem;align-items:center;justify-content:space-between;
  padding:.7rem 1rem;background:var(--panel);border-bottom:1px solid var(--garis);flex-wrap:wrap}
.mitra-chip{display:flex;align-items:center;gap:.5rem;font-size:.9rem;color:var(--redup)}
.mitra-chip b{color:var(--teks)}
.bar-aksi{display:flex;gap:.4rem;flex-wrap:wrap}
.btn{background:var(--panel2);color:var(--teks);border:1px solid var(--garis);
  border-radius:var(--r);padding:.5rem .85rem}
.btn:hover{border-color:var(--emas)}
.btn-utama{background:var(--emas);color:#20160A;border-color:var(--emas);font-weight:700}
.btn-utama:hover{background:var(--emas-l)}
.btn-kecil{padding:.3rem .55rem;font-size:.85rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}

.wrap{max-width:1080px;margin:0 auto;padding:1rem}
.layout{display:grid;grid-template-columns:220px 1fr;gap:1rem;align-items:start}
@media (max-width:820px){.layout{grid-template-columns:1fr}}

/* timeline */
.jadwal{background:var(--panel);border:1px solid var(--garis);border-radius:var(--r);padding:.6rem}
.jadwal ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.25rem}
@media (max-width:820px){
  .jadwal ol{flex-direction:row;overflow-x:auto;padding-bottom:.3rem}
  .jadwal li{flex:0 0 auto}
}
.jadwal button{display:flex;gap:.5rem;align-items:center;width:100%;text-align:left;
  background:transparent;border:1px solid transparent;border-radius:8px;color:var(--redup);padding:.35rem .45rem;font-size:.87rem}
.jadwal .no{font-family:Georgia,serif;font-size:.78rem;background:var(--panel2);border:1px solid var(--garis);
  border-radius:6px;min-width:2.1rem;text-align:center;padding:.05rem .2rem;color:var(--teks)}
.jadwal button.kini{background:var(--panel2);border-color:var(--emas);color:var(--teks)}
.jadwal button.usai{color:var(--teks)}
.jadwal button.usai .no{background:rgba(70,181,138,.18);border-color:var(--hijau);color:#BDF0DB}
.jadwal button:disabled{opacity:.5;cursor:not-allowed}

/* metric strip */
.metrik{display:grid;grid-template-columns:repeat(5,1fr);gap:.5rem;margin-bottom:1rem}
@media (max-width:700px){.metrik{grid-template-columns:repeat(2,1fr)}}
.m{background:var(--panel);border:1px solid var(--garis);border-radius:var(--r);padding:.5rem .6rem}
.m .angka{font-size:1.3rem;display:block;line-height:1.15}
.m span.lbl{font-size:.72rem;color:var(--redup);display:block}
.m .delta{font-size:.72rem;color:var(--hijau)}
.m .delta.turun{color:var(--coral)}

.kartu{background:var(--panel);border:1px solid var(--garis);border-radius:var(--r);padding:1rem;margin-bottom:1rem}
.kartu.terang{background:var(--panel2)}
.pill{display:inline-block;font-size:.73rem;border:1px solid var(--garis);border-radius:999px;
  padding:.1rem .55rem;color:var(--redup);background:var(--tinta)}
.pill.emas{border-color:var(--emas);color:var(--emas-l)}

/* WA brief */
.wa{background:#0E1530;border:1px solid var(--garis);border-radius:var(--r);padding:.7rem;max-width:44ch}
.wa .bubble{background:#20305C;border-radius:12px 12px 12px 3px;padding:.45rem .6rem;margin-bottom:.35rem;font-size:.92rem}
.wa .nama{font-size:.78rem;color:var(--emas-l);margin-bottom:.3rem}

/* choices */
.opsi{display:flex;flex-direction:column;gap:.45rem;margin:.6rem 0}
.opsi label{display:flex;gap:.6rem;align-items:flex-start;background:var(--panel2);
  border:1px solid var(--garis);border-radius:var(--r);padding:.6rem .7rem;cursor:pointer}
.opsi label:hover{border-color:var(--emas)}
.opsi input{margin-top:.28rem;accent-color:var(--emas);flex:0 0 auto}
.opsi label.benar{border-color:var(--hijau);background:rgba(70,181,138,.12)}
.opsi label.salah{border-color:var(--coral);background:rgba(216,69,95,.1)}

.urut{display:flex;flex-direction:column;gap:.4rem;margin:.6rem 0}
.urut .row{display:flex;gap:.5rem;align-items:center;background:var(--panel2);border:1px solid var(--garis);
  border-radius:var(--r);padding:.45rem .6rem}
.urut .row span.t{flex:1;font-size:.93rem}
.pasangan{display:flex;flex-direction:column;gap:.5rem;margin:.6rem 0}
.pasangan .row{background:var(--panel2);border:1px solid var(--garis);border-radius:var(--r);padding:.55rem .65rem}
.pasangan .row .q{font-size:.92rem;margin-bottom:.3rem}
select,input[type=text],input[type=number]{background:var(--tinta);color:var(--teks);
  border:1px solid var(--garis);border-radius:8px;padding:.4rem .5rem;font:inherit;max-width:100%}
.slider{margin:.5rem 0}
.slider .head{display:flex;justify-content:space-between;font-size:.9rem}
input[type=range]{width:100%;accent-color:var(--emas)}
.total-alok{font-family:Georgia,serif;font-size:1.05rem}

.umpan{border-left:3px solid var(--emas);background:var(--panel2);border-radius:0 var(--r) var(--r) 0;
  padding:.7rem .85rem;margin:.8rem 0}
.umpan.baik{border-left-color:var(--hijau)}
.umpan.kurang{border-left-color:var(--coral)}
.umpan ul{margin:.4rem 0 0;padding-left:1.1rem}
.umpan li{font-size:.92rem;margin-bottom:.25rem}
.skor{font-family:Georgia,serif;font-size:1.05rem;color:var(--emas-l)}

.bar-cpmk{display:flex;flex-direction:column;gap:.4rem}
.bar-cpmk .row{font-size:.87rem}
.bar-cpmk .trek{height:9px;background:var(--tinta);border:1px solid var(--garis);border-radius:99px;overflow:hidden}
.bar-cpmk .isi{height:100%;background:linear-gradient(90deg,var(--emas),var(--emas-l))}
.bar-cpmk .lbl{display:flex;justify-content:space-between;margin-bottom:.15rem}

.grafik{display:flex;align-items:flex-end;gap:3px;height:90px;margin:.6rem 0}
.grafik div{flex:1;background:linear-gradient(180deg,var(--emas),#8A6A1C);border-radius:3px 3px 0 0;position:relative}
.grafik-lbl{display:flex;gap:3px;font-size:.62rem;color:var(--redup)}
.grafik-lbl div{flex:1;text-align:center}

.feed{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;max-width:300px}
.feed .sel{aspect-ratio:1;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:1.4rem;
  background:var(--panel2);border:1px solid var(--garis)}

table.tbl{width:100%;border-collapse:collapse;font-size:.88rem;margin:.5rem 0}
table.tbl th,table.tbl td{border:1px solid var(--garis);padding:.35rem .45rem;text-align:left}
table.tbl th{background:var(--panel2);font-weight:600}

.pilih-mitra{display:grid;grid-template-columns:repeat(3,1fr);gap:.7rem}
@media (max-width:760px){.pilih-mitra{grid-template-columns:1fr}}
.mitra{background:var(--panel);border:1px solid var(--garis);border-radius:var(--r);padding:.8rem;text-align:left;color:var(--teks)}
.mitra:hover,.mitra.aktif{border-color:var(--emas)}
.mitra .ikon{font-size:1.8rem}
.mitra h3{margin:.3rem 0 .1rem}
.mitra p{font-size:.87rem;color:var(--redup);margin:0}

.lencana{display:flex;flex-wrap:wrap;gap:.35rem}
.lencana span{font-size:.78rem;border:1px solid var(--emas);color:var(--emas-l);border-radius:999px;padding:.1rem .5rem}
.langkah-info{font-size:.8rem;color:var(--redup);margin-bottom:.2rem}
.sr{position:absolute;left:-9999px}
.dosen{display:none}
.dosen.buka{display:block}
@media print{body{background:#fff;color:#000}.bar,.jadwal,.bar-aksi{display:none}.kartu{border-color:#999}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

/* ---------- keadaan permainan ---------- */
let S = null;
function keadaanBaru(mitra, nama, kelas){
  const skor = {}; Object.keys(BOBOT).forEach(k=>skor[k]={p:0,m:0});
  return {
    versi:1, nama, kelas, mitraId:mitra.id, misiKe:0, langkahKe:0,
    skor, riwayat:[], lencana:[], feed:[], petunjukDipakai:0, selesai:false,
    metrik:{pengikut:mitra.id==="pempek"?210:(mitra.id==="songket"?640:430), er:1.2, jangkauan:900, pesanan:4, konsistensi:35},
    risetDibuka:false
  };
}
const mitra = ()=>MITRA.find(m=>m.id===S.mitraId);
const app = document.getElementById("app");
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

/* ---------- layar mulai ---------- */
function layarMulai(){
  document.getElementById("chipMitra").innerHTML = "";
  app.innerHTML = `
  <div class="kartu">
    <span class="pill emas">Latihan sebelum menyentuh akun sungguhan</span>
    <h2 style="margin-top:.5rem">Satu mitra UMKM, 16 minggu, semua keputusan ada di tangan Anda</h2>
    <p>Anda akan bekerja untuk satu usaha mitra sepanjang semester. Setiap minggu, mitra menunggu keputusan:
    siapa yang disasar, apa yang diunggah, kapan diunggah, dan apa yang diperbaiki setelah angkanya keluar.
    Keputusan yang keliru tidak dihukum — dijelaskan sebabnya, lalu Anda coba lagi.</p>
    <p>Isi nama dulu supaya laporan akhir bisa Anda unduh dan kumpulkan sebagai bukti tugas.</p>
    <div style="display:flex;gap:.6rem;flex-wrap:wrap;margin:.6rem 0 1rem">
      <label>Nama <br><input type="text" id="inNama" placeholder="Nama lengkap"></label>
      <label>Kelas <br><input type="text" id="inKelas" placeholder="misal 3NA"></label>
    </div>
    <h3>Pilih mitra usaha</h3>
    <div class="pilih-mitra">
      ${MITRA.map(m=>`<button class="mitra" data-id="${m.id}">
        <div class="ikon">${m.ikon}</div>
        <h3>${esc(m.nama)}</h3>
        <p>${esc(m.kategori)} · ${esc(m.ikut)}<br>Anggaran konten ${esc(m.modal)}</p>
      </button>`).join("")}
    </div>
    <div id="briefMitra" style="margin-top:1rem"></div>
  </div>`;
  app.querySelectorAll(".mitra").forEach(b=>b.onclick=()=>{
    app.querySelectorAll(".mitra").forEach(x=>x.classList.remove("aktif"));
    b.classList.add("aktif");
    const m = MITRA.find(x=>x.id===b.dataset.id);
    document.getElementById("briefMitra").innerHTML = `
      <div class="wa">
        <div class="nama">${esc(m.nama)} · pesan masuk</div>
        ${m.wa.map(t=>`<div class="bubble">${esc(t)}</div>`).join("")}
      </div>
      <button class="btn btn-utama" id="btnMulai" style="margin-top:.8rem">Terima pekerjaan ini</button>`;
    document.getElementById("btnMulai").onclick = ()=>{
      const nama = (document.getElementById("inNama").value||"Mahasiswa").trim();
      const kelas = (document.getElementById("inKelas").value||"-").trim();
      S = keadaanBaru(m, nama, kelas);
      simpanOtomatis(); render();
    };
  });
}

/* ---------- kerangka utama ---------- */
function render(){
  if(!S){ layarMulai(); return; }
  const m = mitra();
  document.getElementById("chipMitra").innerHTML =
    `<span>${m.ikon}</span><div><b>${esc(m.nama)}</b><br><small>${esc(S.nama)} · ${esc(S.kelas)}</small></div>`;
  if(S.selesai){ layarLaporan(); return; }
  app.innerHTML = `
    <div class="layout">
      <nav class="jadwal" aria-label="Peta 16 minggu">${htmlJadwal()}</nav>
      <main>${htmlMetrik()}<div id="panggung"></div></main>
    </div>`;
  pasangJadwal();
  gambarLangkah();
}

function htmlJadwal(){
  return `<ol>${MISI.map((mi,i)=>{
    const st = i<S.misiKe?"usai":(i===S.misiKe?"kini":"");
    return `<li><button data-i="${i}" class="${st}" ${i>S.misiKe?"disabled":""}>
      <span class="no">${mi.minggu}</span><span>${esc(mi.judul)}</span></button></li>`;}).join("")}</ol>`;
}
function pasangJadwal(){
  app.querySelectorAll(".jadwal button").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i;
    if(i<=S.misiKe){
      if(i<S.misiKe || S.langkahKe>0) bersihkanMinggu(MISI[i].minggu);
      S.misiKe=i; S.langkahKe=0; delete S._urut; render();
    }
  });
}

function bersihkanMinggu(minggu){
  S.riwayat.filter(x=>x.minggu===minggu).forEach(x=>{
    if(S.skor[x.sub]){ S.skor[x.sub].p=Math.max(0,S.skor[x.sub].p-x.dapat); S.skor[x.sub].m=Math.max(0,S.skor[x.sub].m-x.maks); }
  });
  S.riwayat = S.riwayat.filter(x=>x.minggu!==minggu);
}

function htmlMetrik(){
  const k=S.metrik;
  const sel=[["Pengikut",k.pengikut.toLocaleString("id-ID")],["Engagement rate",k.er.toFixed(1)+"%"],
    ["Jangkauan/minggu",k.jangkauan.toLocaleString("id-ID")],["Pesanan/minggu",k.pesanan],
    ["Konsistensi merek",k.konsistensi+"/100"]];
  return `<div class="metrik">${sel.map(([l,v])=>
    `<div class="m"><span class="lbl">${l}</span><span class="angka">${v}</span></div>`).join("")}</div>`;
}

/* ---------- render langkah ---------- */
function langkahAktif(){
  const mi = MISI[S.misiKe];
  const l = JSON.parse(JSON.stringify(mi.langkah[S.langkahKe]));
  if(l.key && mitra()[l.key]){                     // data khusus mitra
    if(l.tipe==="single") l.opsi = mitra()[l.key];
    if(l.tipe==="multi")  l.opsi = mitra()[l.key];
    if(l.tipe==="alokasi") l.rentang = mitra()[l.key];
  }
  return l;
}

function gambarLangkah(){
  const mi = MISI[S.misiKe], l = langkahAktif(), p = document.getElementById("panggung");
  const total = mi.langkah.length;
  let badan = "";

  if(l.tipe==="single"||l.tipe==="multi"){
    badan = `<div class="opsi" id="opsi">${l.opsi.map((o,i)=>
      `<label data-i="${i}"><input type="${l.tipe==="single"?"radio":"checkbox"}" name="o" value="${i}"><span>${esc(o.t)}</span></label>`).join("")}</div>`;
    if(l.tipe==="multi") badan += `<small>Pilih ${l.jml} jawaban.</small>`;
  }
  if(l.tipe==="urut"){
    if(!S._urut){ S._urut = acak(l.urutan.map((t,i)=>({t,i}))); }
    badan = `<div class="urut" id="urut">${S._urut.map((it,idx)=>
      `<div class="row" data-idx="${idx}"><span class="no" style="font-family:Georgia,serif">${idx+1}</span>
        <span class="t">${esc(it.t)}</span>
        <button class="btn btn-kecil" data-naik="${idx}" aria-label="Naikkan">↑</button>
        <button class="btn btn-kecil" data-turun="${idx}" aria-label="Turunkan">↓</button></div>`).join("")}</div>`;
  }
  if(l.tipe==="pasangan"){
    badan = `<div class="pasangan">${l.baris.map((b,i)=>{
      const ops = acak(b.opsi.map((t,j)=>({t,j})));
      return `<div class="row"><div class="q">${esc(b.q)}</div>
        <select data-i="${i}"><option value="-1">— pilih —</option>
        ${ops.map(o=>`<option value="${o.j}">${esc(o.t)}</option>`).join("")}</select></div>`;}).join("")}</div>`;
  }
  if(l.tipe==="alokasi"){
    const k=l.kunci;
    badan = `<div id="alok">${k.map(x=>`<div class="slider">
      <div class="head"><span>${esc(l.label[x])}</span><span><b id="v-${x}">20</b>%</span></div>
      <input type="range" min="0" max="60" step="5" value="20" data-k="${x}"></div>`).join("")}
      <p class="total-alok">Total: <b id="totAlok">100</b>%</p></div>`;

  }
  if(l.tipe==="gabung"){

      <div class="opsi" data-g="${gi}">${g.opsi.map((o,i)=>
      `<label><input type="radio" name="g${gi}" value="${i}"><span>${esc(o.t)}</span></label>`).join("")}</div>`).join("");
  }

  let tambahan = "";
  if(l.grafik) tambahan += htmlGrafikJam();
  if(l.tabel) tambahan += htmlTabel(l.tabel);
  if(S.risetDibuka && S.misiKe===2) tambahan += kartuRiset();

  p.innerHTML = `
    <div class="kartu">
      <div class="langkah-info">Minggu ${mi.minggu} · ${mi.sub==="UTS"||mi.sub==="UAS"?mi.sub:"Sub-CPMK "+mi.sub} · langkah ${S.langkahKe+1} dari ${total}</div>
      <h2>${esc(mi.judul)}</h2>
      <small>${esc(mi.tugas)}</small>
      <p style="margin-top:.7rem"><b>${esc(l.tanya)}</b></p>
      ${tambahan}
      ${badan}
      <div style="display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.8rem">
        <button class="btn btn-utama" id="btnPeriksa">Kirim jawaban</button>
        ${(!mi.ujian && l.petunjuk)?`<button class="btn" id="btnPetunjuk">Buka petunjuk (poin −25%)</button>`:""}
      </div>
      <div id="umpan"></div>
    </div>`;

  if(l.tipe==="urut") pasangUrut();
  if(l.tipe==="alokasi") pasangAlokasi();
  const bp=document.getElementById("btnPetunjuk");
  if(bp) bp.onclick=()=>{ S._petunjuk=true; S.petunjukDipakai++; bp.disabled=true;
    document.getElementById("umpan").innerHTML=`<div class="umpan"><b>Petunjuk</b><p style="margin:.3rem 0 0">${esc(l.petunjuk)}</p></div>`; };
  document.getElementById("btnPeriksa").onclick=()=>periksa(l);
}

function acak(a){ const b=a.slice(); for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];} return b; }

function pasangUrut(){
  const box=document.getElementById("urut");
  box.querySelectorAll("[data-naik]").forEach(b=>b.onclick=()=>{const i=+b.dataset.naik; if(i>0){[S._urut[i-1],S._urut[i]]=[S._urut[i],S._urut[i-1]]; gambarLangkah();}});
  box.querySelectorAll("[data-turun]").forEach(b=>b.onclick=()=>{const i=+b.dataset.turun; if(i<S._urut.length-1){[S._urut[i+1],S._urut[i]]=[S._urut[i],S._urut[i+1]]; gambarLangkah();}});

function pasangAlokasi(){
  const box=document.getElementById("alok");

  };
  box.querySelectorAll("input[type=range]").forEach(r=>r.oninput=hitung); hitung();
}

function htmlTabel(t){

    <tbody>${t.isi.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;

function kartuRiset(){

/* ---------- penilaian ---------- */
function periksa(l){
  const mi=MISI[S.misiKe];
  let dapat=0, maks=0, rincian=[];

  if(l.tipe==="single"){
    const pil=document.querySelector("input[name=o]:checked");
    if(!pil){ pesanKosong("Pilih satu jawaban dulu."); return; }
    const o=l.opsi[+pil.value];
    maks=Math.max(...l.opsi.map(x=>x.pts)); dapat=o.pts;
    rincian.push((o.pts===maks?"✔ ":"✘ ")+o.fb);
    if(o.pts!==maks){ const b=l.opsi.find(x=>x.pts===maks); rincian.push("Jawaban terkuat: "+b.t); }
    tandai(pil.closest("label"), o.pts===maks);
  }
  else if(l.tipe==="multi"){
    const pil=[...document.querySelectorAll("input[name=o]:checked")].map(x=>+x.value);
    if(pil.length!==l.jml){ pesanKosong("Pilih tepat "+l.jml+" jawaban."); return; }
    const benar=l.opsi.map((o,i)=>o.ok?i:-1).filter(i=>i>=0);
    maks = l.tipe==="multi" ? (l.jml*3) : 0;
    let cocok=0;
    pil.forEach(i=>{ const o=l.opsi[i]; if(o.ok){cocok++; dapat+=3; rincian.push("✔ "+o.fb);} else {dapat-=1; rincian.push("✘ "+o.t+" — "+o.fb);}
      tandai(document.querySelector('.opsi label[data-i="'+i+'"]'), !!o.ok); });
    if(cocok<l.jml){ rincian.push("Yang seharusnya masuk: "+benar.map(i=>l.opsi[i].t).slice(0,l.jml+1).join("; ")); }
    dapat=Math.max(0,dapat);
  }
  else if(l.tipe==="urut"){
    maks=l.urutan.length*2;
    let tepat=0;
    S._urut.forEach((it,idx)=>{ if(l.urutan[idx]===it.t) tepat++; });
    dapat=tepat*2;
    rincian.push((tepat===l.urutan.length?"✔ Urutan tepat seluruhnya. ":"Urutan tepat pada "+tepat+" dari "+l.urutan.length+" posisi. ")+l.fb);
    rincian.push("Urutan acuan: "+l.urutan.map((t,i)=>(i+1)+". "+t).join("  "));
    delete S._urut;
  }
  else if(l.tipe==="pasangan"){
    const sel=[...document.querySelectorAll(".pasangan select")];
    if(sel.some(s=>s.value==="-1")){ pesanKosong("Lengkapi semua baris dulu."); return; }
    maks=l.baris.length*3;
    sel.forEach(s=>{ const b=l.baris[+s.dataset.i]; const ok=(+s.value===b.benar);
      if(ok){dapat+=3; rincian.push("✔ "+b.q+" — "+b.fb);} else {rincian.push("✘ "+b.q+" → seharusnya: "+b.opsi[b.benar]+". "+b.fb);} });
  }
  else if(l.tipe==="alokasi"){
    const nil={}; let tot=0;
    document.querySelectorAll("#alok input[type=range]").forEach(r=>{nil[r.dataset.k]=+r.value; tot+=+r.value;});
    if(tot!==100){ pesanKosong("Total harus tepat 100%. Sekarang "+tot+"%."); return; }
    maks=l.kunci.length*3;
    l.kunci.forEach(k=>{ const [a,b]=l.rentang[k], v=nil[k];
      if(v>=a&&v<=b){dapat+=3; rincian.push("✔ "+l.label[k]+" "+v+"% berada di rentang sehat "+a+"–"+b+"%.");}
      else if(v>=a-5&&v<=b+5){dapat+=1.5; rincian.push("~ "+l.label[k]+" "+v+"% hampir tepat; rentang yang disarankan "+a+"–"+b+"%.");}
      else{rincian.push("✘ "+l.label[k]+" "+v+"% jauh dari rentang "+a+"–"+b+"%.");} });
    rincian.push("Rentang ini berasal dari perilaku audiens mitra, bukan aturan universal. Untuk mitra lain, porsinya bisa berbeda.");
  }
  else if(l.tipe==="angka"){
    const v=parseFloat(document.getElementById("inAngka").value);
    if(isNaN(v)){ pesanKosong("Masukkan angka hasil hitungan."); return; }
    maks=l.maks||8; dapat = Math.abs(v-l.jawab)<=l.tol ? maks : 0;
    rincian.push((dapat?"✔ ":"✘ Jawaban Anda "+v+". ")+l.fb);
  }
  else if(l.tipe==="gabung"){
    const pilih=[];
    for(let gi=0;gi<l.grup.length;gi++){
      const r=document.querySelector('input[name=g'+gi+']:checked');
      if(!r){ pesanKosong("Lengkapi semua bagian caption."); return; }
      pilih.push(+r.value);
    }
    l.grup.forEach((g,gi)=>{ const o=g.opsi[pilih[gi]], top=Math.max(...g.opsi.map(x=>x.pts));
      maks+=top; dapat+=o.pts; rincian.push((o.pts===top?"✔ ":"✘ ")+g.label+": "+o.fb); });
  }

  if(S._petunjuk){ dapat=dapat*0.75; rincian.push("Poin dipotong 25% karena petunjuk dibuka. Menggunakan petunjuk tetap lebih baik daripada menebak."); }
  delete S._petunjuk;

  const sub = l.sub || mi.sub;
  if(S.skor[sub]){ S.skor[sub].p += dapat; S.skor[sub].m += maks; }
  S.riwayat.push({minggu:mi.minggu, sub, dapat:+dapat.toFixed(1), maks});

  const rasio = maks? dapat/maks : 0;
  const u=document.getElementById("umpan");
  u.innerHTML = `<div class="umpan ${rasio>=.8?"baik":(rasio<.5?"kurang":"")}">
      <div class="skor">${dapat.toFixed(1)} dari ${maks} poin</div>
      <ul>${rincian.map(r=>`<li>${esc(r)}</li>`).join("")}</ul>
    </div>
    <button class="btn btn-utama" id="btnLanjut">Lanjut</button>`;
  document.querySelectorAll("#opsi input,.pasangan select,#alok input,#inAngka").forEach(x=>x.disabled=true);
  document.getElementById("btnPeriksa").disabled=true;
  if(l.sesudah==="riset") S.risetDibuka=true;
  document.getElementById("btnLanjut").onclick=lanjut;
  document.getElementById("btnLanjut").scrollIntoView({block:"nearest"});
}
function tandai(el,ok){ if(el) el.classList.add(ok?"benar":"salah"); }
function pesanKosong(t){ document.getElementById("umpan").innerHTML=`<div class="umpan kurang">${esc(t)}</div>`; }

function lanjut(){
  const mi=MISI[S.misiKe];
  if(S.langkahKe < mi.langkah.length-1){ S.langkahKe++; simpanOtomatis(); render(); return; }
  layarHasilMinggu();
}

/* ---------- hasil mingguan ---------- */
function layarHasilMinggu(){
  const mi=MISI[S.misiKe], m=mitra();
  const r=S.riwayat.filter(x=>x.minggu===mi.minggu);
  const dapat=r.reduce((a,b)=>a+b.dapat,0), maks=r.reduce((a,b)=>a+b.maks,0);
  const rasio=maks?dapat/maks:0;
  const lama={...S.metrik};

  const basis=[40,70,90,110,30,160,200,120,90,40][S.misiKe];
  S.metrik.pengikut += Math.round(basis*(0.3+1.5*rasio));
  S.metrik.er = Math.max(0.4, Math.min(9, +(S.metrik.er + (rasio-0.55)*0.9).toFixed(2)));
  S.metrik.jangkauan = Math.round(S.metrik.pengikut*(2.2+5.5*rasio));
  S.metrik.pesanan = Math.max(0, Math.round(S.metrik.pesanan + (rasio-0.4)*9));
  S.metrik.konsistensi = Math.max(0, Math.min(100, Math.round(S.metrik.konsistensi + (rasio-0.5)*28)));

  if(rasio>=0.8){ const nm="Lencana "+mi.judul; if(!S.lencana.includes(nm)) S.lencana.push(nm); }
  if(!mi.ujian) S.feed.push(m.emoji[S.feed.length % m.emoji.length]);

  const delta=(a,b,f)=>{const d=b-a; return `<span class="delta ${d<0?"turun":""}">${d>=0?"+":""}${f?f(d):d}</span>`;};
  const komentar = rasio>=0.8
    ? "Mitra puas. Keputusan Anda punya alasan, dan alasan itu bisa diulang minggu depan."
    : rasio>=0.5 ? "Arahnya benar, eksekusinya masih bocor di beberapa titik. Baca ulang umpan balik sebelum lanjut."
    : "Minggu ini banyak keputusan yang tidak berdasar data. Buka kembali langkahnya lewat peta minggu di kiri dan kerjakan sekali lagi.";

  app.innerHTML = `<div class="layout">
    <nav class="jadwal">${htmlJadwal()}</nav>
    <main>
      ${htmlMetrik()}
      <div class="kartu">
        <span class="pill emas">Minggu ${mi.minggu} selesai</span>
        <h2 style="margin-top:.5rem">Laporan ke mitra</h2>
        <p class="skor">${dapat.toFixed(1)} dari ${maks} poin (${Math.round(rasio*100)}%)</p>
        <p>${komentar}</p>
        <table class="tbl">
          <tr><th>Pengikut</th><td>${lama.pengikut.toLocaleString("id-ID")} → ${S.metrik.pengikut.toLocaleString("id-ID")} ${delta(lama.pengikut,S.metrik.pengikut)}</td></tr>
          <tr><th>Engagement rate</th><td>${lama.er.toFixed(1)}% → ${S.metrik.er.toFixed(1)}% ${delta(lama.er,S.metrik.er,d=>d.toFixed(1)+"%")}</td></tr>
          <tr><th>Pesanan per minggu</th><td>${lama.pesanan} → ${S.metrik.pesanan} ${delta(lama.pesanan,S.metrik.pesanan)}</td></tr>
          <tr><th>Konsistensi merek</th><td>${lama.konsistensi} → ${S.metrik.konsistensi} ${delta(lama.konsistensi,S.metrik.konsistensi)}</td></tr>
        </table>
        ${S.feed.length?`<h3 style="margin-top:.9rem">Feed mitra sejauh ini</h3>
          <div class="feed">${S.feed.map(e=>`<div class="sel">${e}</div>`).join("")}</div>`:""}
        ${S.lencana.length?`<h3 style="margin-top:.9rem">Lencana</h3><div class="lencana">${S.lencana.map(x=>`<span>${esc(x)}</span>`).join("")}</div>`:""}
        <div style="display:flex;gap:.5rem;flex-wrap:wrap;margin-top:1rem">
          <button class="btn btn-utama" id="btnMingguBerikut">${S.misiKe<MISI.length-1?"Lanjut ke minggu berikutnya":"Lihat laporan akhir semester"}</button>
          <button class="btn" id="btnUlang">Ulangi minggu ini</button>
        </div>
      </div>
    </main></div>`;
  pasangJadwal();
  document.getElementById("btnUlang").onclick=()=>{
    S.riwayat=S.riwayat.filter(x=>x.minggu!==mi.minggu);
    r.forEach(x=>{ if(S.skor[x.sub]){S.skor[x.sub].p-=x.dapat; S.skor[x.sub].m-=x.maks;} });
    S.metrik=lama; S.langkahKe=0; if(!mi.ujian) S.feed.pop(); render();
  };
  document.getElementById("btnMingguBerikut").onclick=()=>{
    if(S.misiKe<MISI.length-1){ S.misiKe++; S.langkahKe=0; simpanOtomatis(); render(); }
    else { S.selesai=true; simpanOtomatis(); render(); }
  };
}

/* ---------- laporan akhir ---------- */
function nilaiAkhir(){
  let total=0, per={};
  Object.keys(BOBOT).forEach(k=>{
    const s=S.skor[k]; const pct = s.m? (s.p/s.m*100) : 0;
    per[k]=+pct.toFixed(1); total += pct*BOBOT[k]/100;
  });
  return {per, total:+total.toFixed(1)};
}
function huruf(n){ return n>=86?"A":n>=76?"B+":n>=71?"B":n>=66?"C+":n>=56?"C":n>=41?"D":"E"; }

      ``,`Capaian per Sub-CPMK (bobot RPS):`,
      ...Object.keys(BOBOT).map(k=>`  Sub-CPMK ${k} (${BOBOT[k]}%): ${per[k].toFixed(1)}%`),
      ``,`Akun mitra: pengikut ${S.metrik.pengikut}, ER ${S.metrik.er.toFixed(1)}%, jangkauan ${S.metrik.jangkauan}, pesanan ${S.metrik.pesanan}/minggu, konsistensi ${S.metrik.konsistensi}/100`,
      `Petunjuk dibuka: ${S.petunjukDipakai} kali`,
      ``,`Rincian per langkah:`,
      ...S.riwayat.map(x=>`  Minggu ${x.minggu} · ${x.sub}: ${x.dapat}/${x.maks}`),
      ``,`Prioritas latihan: ${lemah.map(k=>"Sub-CPMK "+k).join(", ")}`
    ].join("\n");
    unduh(t, `laporan-simulasi-${S.nama.replace(/\s+/g,"-").toLowerCase()}.txt`, "text/plain");
  };
}
function unduh(isi,nama,tipe){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([isi],{type:tipe}));
  a.download=nama; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}

/* ---------- simpan / muat ---------- */
const KUNCI = "studioumkm.v1";
let cadangan=null, gagalSimpan=false;
function simpanOtomatis(){
  cadangan = JSON.stringify(S);
  try { localStorage.setItem(KUNCI, cadangan); }
  catch(e){
    if(!gagalSimpan){
      gagalSimpan = true;
      alert("Browser menolak menyimpan kemajuan. Biasanya karena tab ini mode Private atau Incognito.\n\nBuka di tab biasa, atau tekan \u201cSimpan progres\u201d sebelum menutup tab.");
    }
  }
}
function sahProgres(d){ return d && d.mitraId && d.skor && MITRA.some(m=>m.id===d.mitraId); }
function muatTersimpan(){
  try {
    const t = localStorage.getItem(KUNCI);
    if(!t) return null;
    const d = JSON.parse(t);
    return sahProgres(d) ? d : null;
  } catch(e){ return null; }
}
function hapusTersimpan(){ try { localStorage.removeItem(KUNCI); } catch(e){} }

/* kotak teks untuk menyalin dan menempel — di iPhone tombol unduh
   tidak berfungsi, jadi menyalin teks adalah satu-satunya cara aman */
function kotakTeks(judul, keterangan, isi, muat){
  const bg = document.createElement("div");
  bg.setAttribute("style","position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(20,22,26,.72);z-index:999;display:flex;align-items:center;justify-content:center;padding:16px");
  bg.innerHTML = `<div style="background:#fff;border-radius:10px;padding:20px;max-width:640px;width:100%;max-height:88vh;overflow:auto;font-family:inherit">
    <h3 style="margin:0 0 .4rem">${esc(judul)}</h3>
    <p style="margin:0 0 .7rem;font-size:.92rem;line-height:1.5">${keterangan}</p>
    <textarea id="ktTa" rows="9" style="width:100%;font-family:ui-monospace,Consolas,monospace;font-size:.75rem;padding:8px;border:1px solid #ccc;border-radius:6px">${esc(isi||"")}</textarea>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:.8rem">
      ${muat ? '<button class="btn btn-utama" id="ktMuat">Muat progres ini</button>'
             : '<button class="btn btn-utama" id="ktCopy">Copy semua teks</button><button class="btn" id="ktUnduh">Download berkas</button>'}
      <button class="btn" id="ktTutup">Tutup</button>
    </div></div>`;
  document.body.appendChild(bg);
  const tutup = ()=>document.body.removeChild(bg);
  bg.querySelector("#ktTutup").onclick = tutup;
  bg.onclick = e => { if(e.target===bg) tutup(); };
  if(muat){
    bg.querySelector("#ktMuat").onclick = ()=>{
      let d=null;
      try { d = JSON.parse(bg.querySelector("#ktTa").value.trim()); } catch(e){}
      if(!sahProgres(d)){ alert("Teks itu tidak dikenali sebagai progres Studio UMKM. Pastikan seluruh isi berkas tersalin, termasuk tanda kurung kurawal."); return; }
      S=d; simpanOtomatis(); tutup(); render();
    };
  } else {
    bg.querySelector("#ktCopy").onclick = ()=>{
      const ta=bg.querySelector("#ktTa");
      ta.focus(); ta.select();
      let ok=false;
      try { ok=document.execCommand("copy"); } catch(e){}
      if(!ok && navigator.clipboard){ navigator.clipboard.writeText(ta.value); ok=true; }
      alert(ok ? "Tersalin. Tempel ke WhatsApp, email, atau kolom tugas di LMS."
               : "Tekan lama di kotak teks, lalu pilih Select All dan Copy.");
    };
    bg.querySelector("#ktUnduh").onclick = ()=>{
      try { unduh(isi, `progres-studio-umkm-${(S.nama||"mahasiswa").replace(/\s+/g,"-").toLowerCase()}.json`, "application/json"); }
      catch(e){ alert("Browser ini tidak mendukung unduh. Pakai tombol Copy."); }
    };
  }
}
document.getElementById("btnSimpan").onclick=()=>{
  if(!S){ alert("Mulai permainan dulu."); return; }
  kotakTeks("Simpan progres",
    "Kemajuanmu sudah tersimpan otomatis di browser ini. Kotak di bawah dipakai kalau kamu ingin <b>mengumpulkan tugas</b> atau <b>pindah perangkat</b>. Di iPhone dan iPad tombol download biasanya tidak berfungsi \u2014 pakai Copy.",
    JSON.stringify(S,null,2), false);
};
document.getElementById("btnMuat").onclick=()=>{
  kotakTeks("Muat progres",
    "Pilih berkas .json, atau tempel isinya ke kotak di bawah lalu tekan Muat.",
    "", true);
  document.getElementById("fileMuat").click();
};
document.getElementById("fileMuat").onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const fr=new FileReader();
  fr.onload=()=>{ try{ const d=JSON.parse(fr.result);
      if(!d.mitraId||!d.skor) throw new Error("bukan berkas progres");
      S=d; simpanOtomatis(); render(); }
    catch(err){ alert("Berkas tidak bisa dibaca sebagai progres Studio UMKM. Pilih berkas .json hasil tombol Simpan progres."); } };
  fr.readAsText(f);
};

/* ---------- panel dosen ---------- */
document.getElementById("btnDosen").onclick=()=>{
  const p=document.getElementById("panelDosen");
  p.classList.toggle("buka");
  if(p.classList.contains("buka")) p.innerHTML=htmlPanelDosen();
};
function htmlPanelDosen(){
  return `<h2>Panel dosen</h2>
  <p>Simulasi ini memetakan satu berbanding satu dengan RPS Pemasaran Digital. Setiap misi memakai bobot penilaian
  Sub-CPMK yang sama seperti di RPS, sehingga laporan akhir mahasiswa bisa dipakai sebagai bukti latihan sebelum tugas sesungguhnya.</p>
  <table class="tbl">
    <thead><tr><th>Minggu</th><th>Sub-CPMK</th><th>Misi dalam permainan</th><th>Tugas RPS</th><th>Bobot</th></tr></thead>
    <tbody>${MISI.map(mi=>`<tr><td>${mi.minggu}</td><td>${mi.sub}</td><td>${esc(mi.judul)}</td><td>${esc(mi.tugas)}</td>
      <td>${BOBOT[mi.sub]?BOBOT[mi.sub]+"%":"50%"}</td></tr>`).join("")}</tbody>
  </table>
  <h3>Cara memakai di kelas</h3>
  <ul>
    <li><b>Pemanasan praktikum (15 menit).</b> Mahasiswa mengerjakan misi minggu berjalan sebelum menyentuh akun mitra, lalu satu kelompok memaparkan alasan pilihannya.</li>
    <li><b>Kalibrasi kelompok.</b> Tiga kelompok memilih tiga mitra berbeda, lalu membandingkan mengapa porsi content pillar dan jam unggah mereka tidak boleh sama.</li>
    <li><b>Latihan sebelum UTS dan UAS.</b> Misi minggu 8 dan 16 berformat studi kasus, sejalan dengan bentuk soal di RPS.</li>
    <li><b>Bukti asesmen.</b> Tombol “Unduh laporan” menghasilkan rekap poin per Sub-CPMK; minta mahasiswa melampirkannya bersama refleksi tiga pertanyaan di akhir.</li>
    <li><b>Catatan integritas.</b> Nilai di permainan bukan nilai mata kuliah. Bobotnya dipakai agar mahasiswa mengenali struktur penilaian, bukan untuk menggantikan rubrik.</li>
  </ul>
  <h3>Mengubah isi</h3>
  <p>Seluruh materi ada di dalam satu berkas ini. Data mitra berada pada konstanta <code>MITRA</code>, dan seluruh soal pada konstanta <code>MISI</code>.
  Setiap langkah memakai satu dari tujuh tipe: <code>single</code>, <code>multi</code>, <code>urut</code>, <code>pasangan</code>, <code>alokasi</code>, <code>angka</code>, <code>gabung</code>.
  Menambah soal berarti menambah satu objek langkah, tanpa mengubah mesin permainannya.</p>`;
}

/* ---------- pembuka: lanjutkan kalau ada kemajuan tersimpan ---------- */
(function(){
  const d = muatTersimpan();
  if(!d){ layarMulai(); return; }
  const m = MITRA.find(x=>x.id===d.mitraId);
  const mi = MISI[d.misiKe] || MISI[MISI.length-1];
  const bg = document.createElement("div");
  bg.setAttribute("style","position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(20,22,26,.72);z-index:999;display:flex;align-items:center;justify-content:center;padding:16px");
  bg.innerHTML = `<div style="background:#fff;border-radius:10px;padding:22px;max-width:520px;width:100%;font-family:inherit">
    <h3 style="margin:0 0 .5rem">Lanjutkan pekerjaan sebelumnya?</h3>
    <p style="margin:0 0 1rem;font-size:.95rem;line-height:1.55">Tersimpan di perangkat ini:<br>
      <b>${esc(d.nama||"Mahasiswa")}</b> ${d.kelas?"\u00b7 "+esc(d.kelas):""}<br>
      mitra <b>${esc(m?m.nama:d.mitraId)}</b> \u00b7 ${d.selesai?"sudah selesai":"minggu "+esc(mi.minggu)+", misi "+(d.misiKe+1)+" dari "+MISI.length}</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-utama" id="lsLanjut">Lanjutkan</button>
      <button class="btn" id="lsBaru">Mulai baru</button>
    </div></div>`;
  document.body.appendChild(bg);
  bg.querySelector("#lsLanjut").onclick = ()=>{ document.body.removeChild(bg); S=d; render(); };
  bg.querySelector("#lsBaru").onclick = ()=>{
    if(!confirm("Mulai baru akan menghapus kemajuan yang tersimpan di browser ini. Lanjutkan?")) return;
    document.body.removeChild(bg); hapusTersimpan(); layarMulai();
  };
  layarMulai();
})();
</script>

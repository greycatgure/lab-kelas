<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lab Tiga Engine — Copywriting &amp; SEO / AEO / GEO</title>
<style>
/* =========================================================
   LAB TIGA ENGINE — design tokens
   paper  #F1F2EC   kertas kerja (oat dingin)
   ink    #17202B   slate navy
   crawl  #2547C8   era SEO (biru tautan 2004)
   answer #B4700E   era AEO (kotak jawaban)
   synth  #7B2D7A   era GEO (sintesis)
   ========================================================= */
:root{
  --paper:#F1F2EC; --card:#FBFBF7; --ink:#17202B; --ink-soft:#4A5563;
  --rule:#CDD1C2; --crawl:#2547C8; --answer:#B4700E; --synth:#7B2D7A;
  --good:#2E6B45; --bad:#A32020;
  --sans:"Arial Narrow","Helvetica Neue Condensed","Liberation Sans Narrow",system-ui,sans-serif;
  --serif:Georgia,"Iowan Old Style","Palatino Linotype",serif;
  --mono:ui-monospace,"SFMono-Regular","Consolas","Liberation Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink); font-family:var(--serif);
  font-size:17px; line-height:1.62; -webkit-text-size-adjust:100%;
}
h1,h2,h3,h4,.u-sans{font-family:var(--sans); letter-spacing:-.01em; font-weight:700; line-height:1.08}
h1{font-size:2.6rem;margin:0}
h2{font-size:1.9rem;margin:0 0 .4rem}
h3{font-size:1.25rem;margin:1.6rem 0 .3rem}
p{margin:0 0 .9em; max-width:68ch}
a{color:var(--crawl)}
button:focus{outline:2px solid var(--synth); outline-offset:2px}
:focus-visible{outline:3px solid var(--synth); outline-offset:2px}

/* ---------- layout ---------- */
.wrap{display:grid; grid-template-columns:266px minmax(0,1fr); min-height:100vh}
.rail{
  background:var(--ink); color:#E7EAE2; padding:20px 18px 40px;
  position:sticky; top:0; align-self:start; height:100vh; overflow:auto;
  -webkit-overflow-scrolling:touch;
}
.stage{padding:34px 40px 90px; max-width:960px}

/* ---------- rail ---------- */
.brandmark{font-family:var(--sans); font-size:1.45rem; line-height:1; margin-bottom:2px}
.brandmark span{display:block; font-size:.72rem; font-family:var(--mono); color:#9AA69B; letter-spacing:.02em; margin-top:6px}
.whoami{margin:16px 0; padding:10px 12px; background:#22303F; border-radius:3px; font-size:.86rem; font-family:var(--sans)}
.whoami b{display:block; font-size:1.05rem}
.whoami em{color:#9AA69B; font-style:normal; font-family:var(--mono); font-size:.74rem}
.xpbar{height:7px; background:#0E151D; border-radius:99px; margin-top:9px; overflow:hidden}
.xpbar i{display:block; height:100%; background:#9ED37A; width:0; transition:width .6s ease}
.eraband{margin:18px 0 6px; font-family:var(--sans); font-size:.82rem; color:#8E9A8F; display:flex; gap:7px; align-items:center}
.eraband:before{content:""; width:11px; height:11px; border-radius:2px; background:var(--era)}
.mlist{list-style:none; margin:0; padding:0}
.mlist button{
  width:100%; text-align:left; background:none; border:0; color:#D8DDD3; cursor:pointer;
  font-family:var(--sans); font-size:.95rem; padding:6px 8px 6px 26px; border-radius:3px;
  position:relative; line-height:1.25;
}
.mlist button:hover{background:#22303F}
.mlist button[aria-current="true"]{background:#2C3C4E; color:#fff}
.mlist button:before{
  content:attr(data-n); position:absolute; left:6px; top:6px; font-family:var(--mono); font-size:.72rem; color:#7E8A80;
}
.mlist button.done:before{content:"\2713"; color:#9ED37A}
.mlist button.locked{opacity:.42; cursor:not-allowed}
.railtools{margin-top:22px; border-top:1px solid #2C3C4E; padding-top:14px; display:grid; gap:6px}
.railtools button{
  background:none;border:1px solid #3A4C60;color:#C9D0C6;font-family:var(--sans);font-size:.88rem;
  padding:6px 9px;border-radius:3px;cursor:pointer;text-align:left
}
.railtools button:hover{background:#22303F;color:#fff}

/* ---------- era spine on stage ---------- */
.eratag{font-family:var(--sans); font-size:.95rem; color:var(--era); display:flex; align-items:center; gap:8px; margin-bottom:10px}
.eratag:before{content:""; width:34px; height:4px; background:var(--era)}
.mtitle{display:flex; gap:12px; align-items:baseline; margin-bottom:6px}
.mtitle .no{font-family:var(--mono); font-size:1rem; color:var(--ink-soft)}
.goal{font-family:var(--sans); font-size:1.06rem; color:var(--ink-soft); max-width:62ch; margin-bottom:22px}

/* ---------- content blocks ---------- */
.brief{border-left:4px solid var(--rule); padding-left:20px; margin:0 0 26px}
ol.steps{counter-reset:s; list-style:none; padding:0; margin:0 0 24px; max-width:68ch}
ol.steps li{counter-increment:s; position:relative; padding-left:40px; margin-bottom:12px}
ol.steps li:before{
  content:counter(s); position:absolute; left:0; top:2px; width:26px; height:26px;
  background:var(--era); color:#fff; font-family:var(--mono); font-size:.82rem;
  display:grid; place-items:center; border-radius:50%;
}
.tip{background:#E6E9DC; border-radius:3px; padding:12px 16px; font-size:.94rem; margin:0 0 22px; max-width:68ch}
.tip b{font-family:var(--sans)}

/* ---------- writing surface ---------- */
.surface{background:var(--card); border:1px solid var(--rule); border-radius:4px; padding:18px; margin-bottom:18px}
label.fl{display:block; font-family:var(--sans); font-size:.95rem; margin-bottom:4px}
label.fl small{color:var(--ink-soft); font-family:var(--mono); font-size:.74rem; margin-left:6px}
textarea,input[type=text],select{
  width:100%; font-family:var(--serif); font-size:1rem; line-height:1.55; color:var(--ink);
  background:#fff; border:1px solid var(--rule); border-radius:3px; padding:10px 12px; margin-bottom:14px;
}
textarea{min-height:150px; resize:vertical}
select{font-family:var(--sans)}
.counter{font-family:var(--mono); font-size:.76rem; color:var(--ink-soft); margin:-10px 0 14px}
.counter.over{color:var(--bad)}

.btn{
  font-family:var(--sans); font-size:1rem; background:var(--ink); color:#fff; border:0;
  padding:10px 20px; border-radius:3px; cursor:pointer;
}
.btn:hover{background:#0E151D}
.btn.ghost{background:none; color:var(--ink); border:1px solid var(--ink)}
.btn.ghost:hover{background:#E6E9DC}
.btn:disabled{opacity:.45; cursor:not-allowed}
.btnrow{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:26px}

/* ---------- SERP preview ---------- */
.serp{background:#fff; border:1px solid var(--rule); border-radius:4px; padding:16px 18px; margin-bottom:18px; font-family:Arial,Helvetica,sans-serif}
.serp .url{font-size:.78rem; color:#1a6b2b}
.serp .t{font-size:1.22rem; color:#1a0dab; line-height:1.3; margin:2px 0 3px}
.serp .d{font-size:.86rem; color:#4d5156; line-height:1.45}

/* ---------- AI answer preview ---------- */
.aibox{border:1px solid var(--synth); border-radius:4px; padding:16px 18px; margin-bottom:18px; background:#FBF6FB}
.aibox h4{font-family:var(--sans); color:var(--synth); margin:0 0 8px; font-size:1rem}
.aibox .cite{background:#EBD9EB; border-radius:2px; padding:0 3px}
.aibox .src{font-family:var(--mono); font-size:.76rem; color:var(--synth); margin-top:10px}

/* ---------- engine console ---------- */
.console{border:1px solid var(--ink); border-radius:4px; overflow:hidden; margin-bottom:22px}
.console>header{background:var(--ink); color:#E7EAE2; font-family:var(--sans); font-size:.95rem; padding:8px 14px; display:flex; justify-content:space-between}
.meters{display:grid; grid-template-columns:repeat(3,1fr); gap:0; background:var(--card)}
.meter{padding:14px; border-right:1px solid var(--rule)}
.meter:last-child{border-right:0}
.meter .en{font-family:var(--sans); font-size:.92rem; color:var(--m)}
.meter .yr{font-family:var(--mono); font-size:.7rem; color:var(--ink-soft); display:block}
.meter .sc{font-family:var(--sans); font-size:2.35rem; line-height:1; margin:6px 0 4px}
.meter .track{height:8px; background:#E2E5DA; border-radius:99px; overflow:hidden}
.meter .track i{display:block; height:100%; width:0; background:var(--m); transition:width .7s cubic-bezier(.2,.7,.3,1)}
.meter .vd{font-family:var(--mono); font-size:.72rem; color:var(--ink-soft); margin-top:6px}
.checks{background:var(--card); border-top:1px solid var(--rule); padding:12px 14px}
.checks h5{font-family:var(--sans); font-size:.92rem; margin:8px 0 4px; color:var(--m)}
.checks ul{list-style:none; margin:0; padding:0}
.checks li{font-size:.9rem; padding:3px 0 3px 24px; position:relative; max-width:74ch}
.checks li:before{position:absolute; left:2px; font-family:var(--mono); font-size:.84rem}
.checks li.ok:before{content:"\2713"; color:var(--good)}
.checks li.part:before{content:"~"; color:var(--answer)}
.checks li.no:before{content:"\00D7"; color:var(--bad)}
.checks li i{color:var(--ink-soft); font-style:italic}

/* ---------- quiz / decide ---------- */
.q{border-bottom:1px solid var(--rule); padding:14px 0}
.q:last-child{border-bottom:0}
.q p.stem{font-size:1.05rem; margin-bottom:8px}
.q p.stem b{font-family:var(--mono); font-size:.95rem; background:#E6E9DC; padding:1px 5px; border-radius:2px}
.opts{display:flex; gap:8px; flex-wrap:wrap}
.opts button{
  font-family:var(--sans); font-size:.94rem; background:#fff; border:1px solid var(--rule);
  padding:7px 13px; border-radius:99px; cursor:pointer
}
.opts button[aria-pressed="true"]{background:var(--ink); color:#fff; border-color:var(--ink)}
.opts button.right{background:#DCEBE0; border-color:var(--good); color:var(--good)}
.opts button.wrong{background:#F4DCDC; border-color:var(--bad); color:var(--bad)}
.why{font-size:.9rem; color:var(--ink-soft); margin-top:8px}

/* ---------- allocation ---------- */
.alloc{display:grid; gap:12px; margin-bottom:8px}
.arow{display:grid; grid-template-columns:190px 1fr 52px; gap:12px; align-items:center}
.arow .nm{font-family:var(--sans); font-size:.95rem}
.arow .nm small{display:block; color:var(--ink-soft); font-family:var(--serif); font-size:.8rem; line-height:1.3}
.arow output{font-family:var(--mono); font-size:.9rem; text-align:right}
input[type=range]{width:100%; accent-color:var(--synth)}
.budget{font-family:var(--sans); font-size:1.05rem; margin:10px 0 18px}
.budget b{font-family:var(--mono)}
.sov{display:grid; gap:5px; margin:14px 0 4px}
.sovrow{display:grid; grid-template-columns:150px 1fr; gap:10px; align-items:center; font-size:.9rem}
.sovrow .bar{height:16px; background:#E2E5DA; border-radius:2px; overflow:hidden}
.sovrow .bar i{display:block; height:100%; background:var(--synth); width:0; transition:width .5s ease}

/* ---------- badges, report, modal ---------- */
.badges{display:flex; gap:8px; flex-wrap:wrap; margin:6px 0 0}
.badge{font-family:var(--sans); font-size:.8rem; border:1px solid #3A4C60; color:#9AA69B; padding:3px 8px; border-radius:99px}
.badge.on{background:#9ED37A; color:#17202B; border-color:#9ED37A}
.modal{position:fixed; top:0; right:0; bottom:0; left:0; background:rgba(23,32,43,.72); display:grid; place-items:center; padding:20px; z-index:50}
.modal[hidden]{display:none}
.sheet{background:var(--paper); border-radius:5px; padding:28px; max-width:720px; width:100%; max-height:88vh; overflow:auto}
table.rc{width:100%; border-collapse:collapse; font-size:.92rem; margin:14px 0}
table.rc th,table.rc td{border-bottom:1px solid var(--rule); padding:6px 8px; text-align:left}
table.rc th{font-family:var(--sans)}
table.rc td.n{font-family:var(--mono); text-align:right}
.toast{
  position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--ink); color:#fff;
  font-family:var(--sans); padding:10px 18px; border-radius:3px; z-index:60
}
.toast[hidden]{display:none}

/* ---------- onboarding ---------- */
.hero{display:grid; gap:26px; max-width:780px}
.picks{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px}
.pick{background:var(--card); border:1px solid var(--rule); border-radius:4px; padding:14px; text-align:left; cursor:pointer; font:inherit}
.pick:hover{border-color:var(--ink)}
.pick[aria-pressed="true"]{border-color:var(--synth); box-shadow:inset 0 0 0 2px var(--synth)}
.pick b{font-family:var(--sans); font-size:1.1rem; display:block}
.pick small{color:var(--ink-soft); font-family:var(--mono); font-size:.74rem}

@media (max-width:820px){
  .wrap{grid-template-columns:1fr}
  .rail{position:static; height:auto; padding-bottom:18px}
  .stage{padding:22px 18px 70px}
  h1{font-size:2rem} h2{font-size:1.5rem}
  .meters{grid-template-columns:1fr}
  .meter{border-right:0; border-bottom:1px solid var(--rule)}
  .arow{grid-template-columns:1fr 60px; }
  .arow input[type=range]{grid-column:1/-1}
  .sovrow{grid-template-columns:110px 1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  .rail,.btnrow,.railtools,.modal{display:none!important}
  body{background:#fff} .stage{max-width:none;padding:0}
}
</style>
</head>
<body>
<div class="wrap">
  <nav class="rail" aria-label="Peta misi">
    <div class="brandmark">LAB TIGA ENGINE<span>copywriting &middot; seo &middot; aeo &middot; geo</span></div>
    <div class="whoami" id="whoami"></div>
    <div id="mapnav"></div>
    <div class="railtools">
      <button id="btnSandbox">Sandbox</button>
      <button id="btnReport">Rapor saya</button>
      <button id="btnExport">Export jawaban (.json)</button>
      <button id="btnImport">Import jawaban</button>
      <button id="btnTeacher">Catatan pengajar</button>
      <button id="btnReset">Reset progres</button>
    </div>
  </nav>
  <main class="stage" id="stage" tabindex="-1"></main>
</div>
<div class="modal" id="modal" hidden><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast" hidden></div>
<script>
/* =======================================================================
   LAB TIGA MESIN — mesin simulasi
   Semua data tersimpan di localStorage browser siswa. Tanpa internet.
   ======================================================================= */
"use strict";

var KEY = "labtigaengine.v1";
var ERAS = {
  1: { name: "Era 1 \u2014 SEO: crawling & ranking (1998\u20132015)", color: "var(--crawl)" },
  2: { name: "Era 2 \u2014 AEO: answer engine (2016\u20132022)", color: "var(--answer)" },
  3: { name: "Era 3 \u2014 GEO: generative engine (2023\u2192)", color: "var(--synth)" }
};
var LEVELS = [
  { at: 0, t: "Anak Magang" }, { at: 150, t: "Copywriter Junior" },
  { at: 350, t: "SEO Specialist" }, { at: 550, t: "AEO Strategist" },
  { at: 750, t: "GEO Architect" }, { at: 900, t: "Kepala Lab" }
];
var BADGES = [
  { id: "intent", t: "Baca Intent" }, { id: "serp", t: "Tukang SERP" },
  { id: "framework", t: "Framework Rapi" }, { id: "bluf", t: "Jawaban Duluan" },
  { id: "snippet", t: "Ahli Snippet" }, { id: "voice", t: "Suara Manusia" },
  { id: "citation", t: "Magnet Citation" }, { id: "entity", t: "Arsitek Entity" },
  { id: "triple", t: "Lolos Tiga Engine" }, { id: "honest", t: "Pemasar Jujur" }
];

var PRESETS = [
  { brand: "Pempek Ny. Lina", cat: "toko pempek", city: "Palembang", kw: "pempek kulit asli palembang",
    fact: "direbus 2 kali, tanpa pengawet, kirim ke 14 kota" },
  { brand: "LensaKu Rental", cat: "rental kamera", city: "Palembang", kw: "rental kamera palembang",
    fact: "48 unit kamera, sewa mulai 12 jam, gratis antar dalam kota" },
  { brand: "Kilap Sepatu", cat: "jasa cuci sepatu", city: "Palembang", kw: "jasa cuci sepatu palembang",
    fact: "selesai 24 jam, 6.400 pasang tertangani sejak 2021" }
];

/* ---------------- state ---------------- */
var S = null;
function freshState() {
  return { v: 1, brand: null, xp: 0, badges: [], m: {}, art: {}, log: [], started: Date.now() };
}
function load() {
  try { var r = localStorage.getItem(KEY); S = r ? JSON.parse(r) : freshState(); }
  catch (e) { S = freshState(); }
  if (!S || S.v !== 1) S = freshState();
  if (!S.m) S.m = {}; if (!S.art) S.art = {}; if (!S.badges) S.badges = [];
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { toast("Browser menolak menyimpan. Pakai tombol Export jawaban."); }
}
function award(id) {
  if (S.badges.indexOf(id) < 0) {
    S.badges.push(id);
    var b = BADGES.filter(function (x) { return x.id === id; })[0];
    if (b) toast("Badge baru: " + b.t);
  }
}
function levelOf(xp) {
  var out = LEVELS[0];
  for (var i = 0; i < LEVELS.length; i++) if (xp >= LEVELS[i].at) out = LEVELS[i];
  return out;
}
function finish(id, score, data) {
  var prev = S.m[id] ? S.m[id].score : 0;
  var xp = Math.round(score);
  S.m[id] = { score: Math.max(prev, xp), attempts: ((S.m[id] && S.m[id].attempts) || 0) + 1, data: data || {}, at: Date.now() };
  S.xp = 0;
  for (var k in S.m) S.xp += S.m[k].score;
  S.log.push({ id: id, score: xp, at: Date.now() });
  save(); paintRail();
}

/* ---------------- dom helpers ---------------- */
function el(id) { return document.getElementById(id); }
function h(html) { var d = document.createElement("div"); d.innerHTML = html; return d; }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]; }); }
var toastTimer = null;
function toast(msg) {
  var t = el("toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.hidden = true; }, 3200);
}
function modal(html) { el("sheet").innerHTML = html; el("modal").hidden = false; }
function closeModal() { el("modal").hidden = true; }

/* ---------------- analisis teks ---------------- */
var FLUFF = ["terbaik", "sangat", "luar biasa", "revolusioner", "nomor satu", "no.1", "terdepan",
  "berkualitas tinggi", "harga bersaing", "profesional dan", "amanah", "amazing", "terpercaya di hati",
  "solusi terpadu", "world class", "kekinian banget", "dijamin puas", "paling murah"];
var HEDGE = ["mungkin", "kurang lebih", "sekitar-sekitar", "agak", "bisa jadi"];

function words(t) { return (t || "").trim().split(/\s+/).filter(Boolean); }
function wc(t) { return words(t).length; }
function sentences(t) {
  var chunk = (t || "").replace(/([.!?])(\s|$)/g, "$1\u0001").split(/\u0001|\n+/);
  return chunk.map(function (s) { return s.trim(); }).filter(function (s) { return s.length > 1; });
}
function low(t) { return (t || "").toLowerCase(); }
function has(t, sub) { return low(t).indexOf(low(sub)) >= 0; }
function countOf(t, sub) {
  if (!sub) return 0;
  var n = 0, i = 0, a = low(t), b = low(sub);
  while ((i = a.indexOf(b, i)) >= 0) { n++; i += b.length; }
  return n;
}
function kwTokens(kw) { return words(low(kw)).filter(function (w) { return w.length > 3; }); }
function reEsc(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }
/* cocokkan frasa kunci walau diselipi kata kecil: "cuci sepatu di Palembang" */
function countLoose(t, kw) {
  var ts = words(low(kw)).map(reEsc);
  if (!ts.length) return 0;
  try {
    var re = new RegExp(ts.join("(?:\\s+\\S+){0,2}\\s+"), "gi");
    return ((t || "").match(re) || []).length;
  } catch (e) { return countOf(t, kw); }
}
function tokenHits(t, kw) {
  var ts = kwTokens(kw), a = low(t), n = 0;
  for (var i = 0; i < ts.length; i++) if (a.indexOf(ts[i]) >= 0) n++;
  return ts.length ? n / ts.length : 0;
}
function avgSentLen(t) {
  var ss = sentences(t); if (!ss.length) return 0;
  var tot = 0; for (var i = 0; i < ss.length; i++) tot += wc(ss[i]);
  return tot / ss.length;
}
function fluffFound(t) {
  var a = low(t), out = [];
  for (var i = 0; i < FLUFF.length; i++) if (a.indexOf(FLUFF[i]) >= 0) out.push(FLUFF[i]);
  return out;
}
function hasNumber(t) { return /\d/.test(t || ""); }
function hasQuantClaim(t) {
  return /\d+([.,]\d+)?\s*(%|persen|jam|menit|hari|bulan|tahun|km|kg|gram|ml|porsi|pasang|unit|orang|pelanggan|kota|ribu|juta|rb|k\b)/i.test(t || "")
    || /(rp|idr)\s?\d/i.test(t || "");
}
function hasYear(t) { return /\b(19|20)\d{2}\b/.test(t || ""); }
function hasSource(t) {
  return /(menurut|berdasarkan|data|survei|riset|studi|laporan|catatan internal|sumber:)/i.test(t || "");
}
function questionLines(t) {
  return (t || "").split(/\n+/).filter(function (l) {
    return /\?\s*$/.test(l.trim()) || /^(apa|apakah|bagaimana|berapa|mengapa|kenapa|kapan|di mana|dimana|bisakah|amankah)\b/i.test(l.trim());
  });
}
function hasList(t) {
  var lines = (t || "").split(/\n+/), n = 0;
  for (var i = 0; i < lines.length; i++) if (/^\s*([-*\u2022]|\d+[.)])\s+/.test(lines[i])) n++;
  return n >= 2;
}
function hasSubhead(t) {
  var lines = (t || "").split(/\n+/), n = 0;
  for (var i = 0; i < lines.length; i++) {
    var l = lines[i].trim();
    if (l && wc(l) <= 9 && !/[.!]$/.test(l)) n++;
  }
  return n >= 1 && (t || "").split(/\n/).length > 2;
}
function properNouns(t) {
  var ws = words(t || ""), n = 0;
  for (var i = 1; i < ws.length; i++) if (/^[A-Z][a-zA-Z]{2,}/.test(ws[i])) n++;
  return n;
}
function firstSentence(t) { var s = sentences(t); return s.length ? s[0] : ""; }
function brandSpellingConsistent(t, brand) {
  if (!brand) return true;
  var c = countOf(t, brand);
  var loose = countOf(low(t), low(brand).split(" ")[0]);
  return c > 0 && loose <= c + 1;
}
/* kalimat paling "bisa dikutip": pendek, ada merek, ada angka */
function bestQuotable(t, brand) {
  var ss = sentences(t), best = null, bs = -1;
  for (var i = 0; i < ss.length; i++) {
    var s = ss[i], n = wc(s), sc = 0;
    if (n >= 8 && n <= 28) sc += 3; else if (n <= 34) sc += 1;
    if (brand && has(s, brand)) sc += 3;
    if (hasQuantClaim(s)) sc += 4;
    if (hasYear(s)) sc += 1;
    if (fluffFound(s).length) sc -= 3;
    if (sc > bs) { bs = sc; best = s; }
  }
  return { s: best || "", score: bs };
}
/* =======================================================================
   TIGA ENGINE PENILAI
   Teks yang SAMA dibaca tiga engine dengan kriteria berbeda.
   Itu inti pelajarannya: tulisannya tidak berubah, pembacanya berubah.
   Tiap check: {w:bobot, got:0..1, t:label, why:penjelasan}
   ======================================================================= */

function mk(w, got, t, why) { return { w: w, got: Math.max(0, Math.min(1, got)), t: t, why: why || "" }; }
function total(cs) {
  var sum = 0, max = 0;
  for (var i = 0; i < cs.length; i++) { sum += cs[i].w * cs[i].got; max += cs[i].w; }
  return max ? Math.round(sum / max * 100) : 0;
}

/* ---------- ENGINE 1: CrawlBot (SEO klasik) ---------- */
function engSEO(t, ctx) {
  var kw = (ctx && ctx.kw) || "", n = wc(t), cs = [];
  var head = words(t).slice(0, 18).join(" ");
  var exact = countOf(t, kw), loose = Math.max(exact, countLoose(t, kw));
  var dens = n ? loose / n * 100 : 0;

  cs.push(mk(20, has(head, kw) ? 1 : (countLoose(head, kw) ? .85 : (tokenHits(head, kw) >= .6 ? .5 : 0)),
    "Keyword ada di 18 kata pertama",
    has(head, kw) ? "" : "Crawler membaca dari atas. Pindahkan keyword ke kalimat pertama."));

  cs.push(mk(20, loose === 0 ? 0 : (loose === 1 ? .55 : (loose <= 8 ? 1 : .75)),
    "Keyword muncul " + loose + "\u00d7 (density " + dens.toFixed(1) + "%)",
    loose === 0 ? "Keyword-nya belum ada di teks." :
      loose > 5 ? "Sesering ini masih dinaikkan search engine 2004 \u2014 dan itu justru masalahnya. Bandingkan dengan nilai dua engine lain." :
        "Wajar: 2\u20135 kali."));

  cs.push(mk(15, tokenHits(t, kw),
    "Variasi keyword terpakai " + Math.round(tokenHits(t, kw) * 100) + "%",
    "Pakai sinonim dan potongan keyword, jangan frasa yang sama terus."));

  cs.push(mk(15, n >= 110 ? 1 : (n >= 60 ? .65 : (n >= 30 ? .3 : 0)),
    "Panjang teks " + n + " kata",
    n < 60 ? "Era ini menganggap teks panjang lebih layak. Target minimal 110 kata." : ""));

  cs.push(mk(10, hasSubhead(t) ? 1 : 0, "Ada heading atau subjudul",
    hasSubhead(t) ? "" : "Tulis subjudul pendek di baris sendiri, tanpa titik."));

  cs.push(mk(10, hasList(t) ? 1 : 0, "Ada bullet list",
    hasList(t) ? "" : "Awali minimal 2 baris dengan \u201c- \u201d."));

  cs.push(mk(10, (ctx && ctx.brand && has(t, ctx.brand)) ? 1 : 0, "Nama brand disebut",
    "Brand yang tidak pernah disebut tidak bisa dikenali."));

  return { key: "seo", name: "CrawlBot", year: "search engine 2004", color: "var(--crawl)", checks: cs, score: total(cs) };
}

/* ---------- ENGINE 2: SnippetBot (AEO) ---------- */
function engAEO(t, ctx) {
  var kw = (ctx && ctx.kw) || "", q = (ctx && ctx.q) || "", cs = [];
  var f = firstSentence(t), fn = wc(f), asl = avgSentLen(t);
  var direct = fn > 0 && fn <= 30 && (tokenHits(f, kw) >= .5) &&
    /(adalah|merupakan|yaitu|bisa|dapat|butuh|perlu|memakan|berkisar|mulai dari|sekitar|\d)/i.test(f);
  var first60 = words(t).slice(0, 60).join(" ");

  cs.push(mk(25, direct ? 1 : (fn <= 30 && tokenHits(f, kw) >= .5 ? .5 : 0),
    "Kalimat pertama langsung menjawab (" + fn + " kata)",
    direct ? "" : "Pola: [subjek] + adalah/butuh/mulai dari + [angka]. Maksimal 30 kata, tanpa basa-basi."));

  cs.push(mk(15, hasQuantClaim(first60) ? 1 : (hasNumber(first60) ? .5 : 0),
    "Ada angka di 60 kata pertama",
    "Featured snippet lebih sering mengambil jawaban yang terukur: 24 jam, Rp35.000, 3 langkah."));

  cs.push(mk(15, questionLines(t).length >= 1 ? 1 : 0,
    "Ada heading berbentuk pertanyaan (" + questionLines(t).length + ")",
    q ? "Samakan dengan pertanyaan aslinya: \u201c" + q + "\u201d" : "Tulis heading persis seperti orang bertanya."));

  cs.push(mk(15, hasList(t) ? 1 : (hasSubhead(t) ? .4 : 0),
    "Struktur siap snippet: list, langkah, atau tabel",
    "Snippet tipe list dan tabel diambil langsung dari struktur halaman."));

  cs.push(mk(10, asl === 0 ? 0 : (asl <= 18 ? 1 : (asl <= 24 ? .6 : .2)),
    "Kalimat rata-rata " + asl.toFixed(0) + " kata",
    asl > 24 ? "Terlalu panjang untuk diambil utuh. Pecah jadi 18\u201320 kata." : ""));

  var fl = fluffFound(t);
  cs.push(mk(10, fl.length === 0 ? 1 : (fl.length <= 2 ? .4 : 0),
    "Bebas kata fluff" + (fl.length ? " (ada: " + fl.join(", ") + ")" : ""),
    fl.length ? "\u201cTerbaik\u201d dan \u201cterpercaya\u201d tidak bisa diverifikasi, jadi tidak diambil." : ""));

  cs.push(mk(10, (tokenHits(t, kw) >= .8 ? 1 : tokenHits(t, kw)),
    "Sesuai search intent",
    "Jawab pertanyaan yang dicari orang, bukan pertanyaan yang ingin kamu jawab."));

  return { key: "aeo", name: "SnippetBot", year: "answer engine 2019", color: "var(--answer)", checks: cs, score: total(cs) };
}

/* ---------- ENGINE KHUSUS: VoiceBot (dipakai Misi 6) ----------
   Jawaban voice search dinilai dengan kriteria sendiri. Memakai engine AEO
   biasa tidak adil: satu kalimat tidak mungkin punya heading dan list. */
function engVoice(t, ctx) {
  var brand = (ctx && ctx.brand) || "", city = (ctx && ctx.city) || "", cs = [];
  var n = wc(t), ss = sentences(t).length, fl = fluffFound(t);
  var hardToSay = /\d{1,3}\.\d{3}|[\/()&%*]|\b(dll|dsb|min|maks|pcs|hrs|tsb)\b/i.test(t);
  var contact = /(hubungi|whatsapp|wa|kunjungi|antar|jemput|konsultasi|reservasi|pesan|booking|gerai|alamat|datang)/i.test(t);

  cs.push(mk(25, n === 0 ? 0 : (n <= 30 ? 1 : (n <= 36 ? .5 : 0)),
    "Panjang " + n + " kata",
    n > 30 ? "Asisten suara memotong jawaban panjang. Maksimal 30 kata." : ""));

  cs.push(mk(15, ss === 1 ? 1 : (ss === 2 ? .5 : 0),
    "Jumlah kalimat: " + ss,
    ss > 1 ? "Satu kalimat saja. Yang dibacakan hanya satu." : ""));

  cs.push(mk(15, brand && has(t, brand) ? 1 : 0, "Nama brand disebut",
    "Suara tidak bisa menampilkan logo. Nama harus terucap."));

  cs.push(mk(10, city && has(t, city) ? 1 : 0, "Kota disebut",
    "Voice search hampir selalu lokal."));

  cs.push(mk(15, hasQuantClaim(t) ? 1 : (hasNumber(t) ? .5 : 0), "Ada angka konkret",
    "Harga, durasi, atau jumlah \u2014 sesuatu yang bisa diingat sambil menyetir."));

  cs.push(mk(10, hardToSay ? 0 : 1, "Mudah diucapkan",
    hardToSay ? "Ada format yang aneh kalau dibacakan: Rp35.000, tanda kurung, atau singkatan seperti dll." : ""));

  cs.push(mk(10, contact ? 1 : 0, "Ada alasan untuk tetap menghubungi",
    "Zero-click hanya rugi kalau tidak ada langkah berikutnya."));

  cs.push(mk(10, fl.length === 0 ? 1 : 0, "Bebas kata fluff" + (fl.length ? " (" + fl.join(", ") + ")" : ""),
    fl.length ? "Terdengar seperti iklan kalau dibacakan." : ""));

  return { key: "voice", name: "VoiceBot", year: "voice assistant", color: "var(--answer)", checks: cs, score: total(cs) };
}

/* ---------- ENGINE 3: SynthEngine (GEO) ---------- */
function engGEO(t, ctx) {
  var brand = (ctx && ctx.brand) || "", cat = (ctx && ctx.cat) || "", city = (ctx && ctx.city) || "", cs = [];
  var ent = (brand && has(t, brand) ? 1 : 0) + (cat && has(t, cat) ? 1 : 0) + (city && has(t, city) ? 1 : 0);
  var quot = bestQuotable(t, brand);
  var fl = fluffFound(t);
  var offsite = (ctx && typeof ctx.offsite === "number") ? ctx.offsite : (S.art.offsite || 0);

  cs.push(mk(20, ent / 3,
    "Entity jelas: brand + kategori + kota (" + ent + "/3)",
    ent < 3 ? "AI menyusun jawaban dari entity. Sebut \u201c" + (brand || "brand") + ", " + (cat || "kategori") + " di " + (city || "kota") + "\u201d secara eksplisit." : ""));

  cs.push(mk(20, hasQuantClaim(t) ? 1 : (hasNumber(t) ? .4 : 0),
    "Ada data atau angka yang bisa dikutip",
    hasQuantClaim(t) ? "" : "Kalimat tanpa angka hampir tidak pernah dikutip \u2014 tidak ada isi yang bisa diambil."));

  cs.push(mk(15, (hasSource(t) ? .6 : 0) + (hasYear(t) ? .4 : 0),
    "Ada sumber data dan tahun",
    "Sebut asal datanya dan tahunnya."));

  cs.push(mk(15, quot.score >= 8 ? 1 : (quot.score >= 5 ? .6 : (quot.score >= 2 ? .3 : 0)),
    "Ada kalimat yang tetap utuh kalau dikutip sendiri",
    quot.s ? "Kandidat terkuat: \u201c" + quot.s.slice(0, 110) + "\u201d" : "Tulis satu kalimat yang tetap masuk akal kalau dipotong dari paragrafnya."));

  cs.push(mk(15, Math.min(1, offsite / 55),
    "Off-page signal (" + offsite + "/100 dari Misi 8)",
    offsite ? "" : "Selesaikan Misi 8 dulu. AI juga membaca review, forum, dan media \u2014 bukan hanya website-mu."));

  cs.push(mk(10, fl.length === 0 ? 1 : 0,
    "Tanpa klaim superlatif tanpa bukti" + (fl.length ? " (" + fl.join(", ") + ")" : ""),
    fl.length ? "Kata seperti ini dibuang saat AI menyusun jawaban." : ""));

  var rep = Math.max(countOf(t, ctx && ctx.kw), countLoose(t, (ctx && ctx.kw) || ""));
  cs.push(mk(10, rep <= 4 ? 1 : (rep <= 6 ? .5 : 0),
    "Keyword tidak diulang berlebihan (" + rep + "\u00d7)",
    rep > 4 ? "Teks yang mengulang frasa yang sama dianggap tidak menambah informasi baru." : ""));

  cs.push(mk(5, brandSpellingConsistent(t, brand) ? 1 : 0,
    "Penulisan brand konsisten",
    "Pakai satu ejaan. \u201cKilap Sepatu\u201d dan \u201cKilapSepatu\u201d dibaca sebagai dua entity berbeda."));

  return { key: "geo", name: "SynthEngine", year: "generative engine 2026", color: "var(--synth)", checks: cs, score: total(cs) };
}

function runAll(t, ctx) { return [engSEO(t, ctx), engAEO(t, ctx), engGEO(t, ctx)]; }
function ctxNow(extra) {
  var b = S.brand || {};
  var c = { brand: b.brand, cat: b.cat, city: b.city, kw: b.kw, q: b.q };
  if (extra) for (var k in extra) c[k] = extra[k];
  return c;
}

/* ---------- tampilan hasil ---------- */
function metersHTML(res) {
  return '<div class="meters">' + res.map(function (r) {
    return '<div class="meter" style="--m:' + r.color + '">' +
      '<div class="en">' + r.name + '<span class="yr">' + r.year + '</span></div>' +
      '<div class="sc">' + r.score + '<span style="font-size:.9rem;color:var(--ink-soft)">/100</span></div>' +
      '<div class="track"><i style="width:' + r.score + '%"></i></div>' +
      '<div class="vd">' + verdict(r.score) + '</div></div>';
  }).join("") + '</div>';
}
function consoleHTML(res, caption) {
  var checks = res.map(function (r) {
    return '<div style="--m:' + r.color + '"><h5>Penilaian ' + r.name + ":</h5><ul>" +
      r.checks.map(function (c) {
        var cls = c.got >= .99 ? "ok" : (c.got > 0 ? "part" : "no");
        return '<li class="' + cls + '">' + esc(c.t) + (c.why && c.got < .99 ? " <i>" + esc(c.why) + "</i>" : "") + "</li>";
      }).join("") + "</ul></div>";
  }).join("");
  return '<section class="console"><header><span>Hasil tiga engine</span><span>' + (caption || "teks sama, tiga pembaca") + "</span></header>" +
    metersHTML(res) + '<div class="checks">' + checks + "</div></section>";
}
function verdict(s) {
  if (s >= 85) return "tampil di atas";
  if (s >= 70) return "layak tampil";
  if (s >= 50) return "terindeks, tenggelam";
  if (s >= 25) return "hampir tidak terlihat";
  return "dilewati";
}

function paintRail() {
  var lv = levelOf(S.xp), nxt = null;
  for (var i = 0; i < LEVELS.length; i++) if (LEVELS[i].at > S.xp) { nxt = LEVELS[i]; break; }
  var pct = nxt ? Math.round((S.xp - lv.at) / (nxt.at - lv.at) * 100) : 100;
  var b = S.brand;
  el("whoami").innerHTML =
    "<b>" + esc(lv.t) + "</b><em>" + S.xp + " XP" + (nxt ? " \u00b7 " + (nxt.at - S.xp) + " lagi ke " + nxt.t : " \u00b7 maksimal") + "</em>" +
    '<div class="xpbar"><i style="width:' + pct + '%"></i></div>' +
    (b ? '<em style="margin-top:8px;display:block">' + esc(b.brand) + " \u00b7 " + esc(b.city) + "</em>" : "") +
    '<div class="badges">' + BADGES.map(function (x) {
      return '<span class="badge' + (S.badges.indexOf(x.id) >= 0 ? " on" : "") + '">' + esc(x.t) + "</span>";
    }).join("") + "</div>";

  var html = "", era = 0;
  for (var j = 0; j < MISSIONS.length; j++) {
    var m = MISSIONS[j];
    if (m.era !== era) {
      era = m.era;
      html += '<div class="eraband" style="--era:' + ERAS[era].color + '">' + esc(ERAS[era].name) + "</div><ul class=\"mlist\">";
    }
    var done = !!S.m[m.id], open = unlocked(j);
    html += '<li><button data-go="' + m.id + '" data-n="' + m.no + '" class="' + (done ? "done" : "") + (open ? "" : " locked") +
      '" ' + (open ? "" : "disabled") + (cur === m.id ? ' aria-current="true"' : "") + ">" + esc(m.title) +
      (done ? ' <span style="font-family:var(--mono);font-size:.72rem;opacity:.7">' + S.m[m.id].score + "</span>" : "") + "</button></li>";
    var nx = MISSIONS[j + 1];
    if (!nx || nx.era !== era) html += "</ul>";
  }
  el("mapnav").innerHTML = html;
}

function wireQuiz(m) {
  var pick = (S.m[m.id] && S.m[m.id].data && S.m[m.id].data.pick) ? S.m[m.id].data.pick.slice() : [];

      } else {
        v = c.cap * Math.min(1, p / c.sat);
        if (p > c.sat) notes.push(c.nm + ": sudah penuh di " + c.sat + " poin, " + (p - c.sat) + " poin terbuang.");
        if (c.spamAt && p > c.spamAt) { v -= 15; notes.push(c.nm + ": di atas " + c.spamAt + " poin terbaca spam, nilainya dipotong."); }
      }

    el("bud").innerHTML = "Terpakai <b>" + used + "</b> dari 100 poin. " +

    }).join("") + '<p class="budget">Kekuatan off-page signal: <b>' + (used > 100 ? 0 : r.score) + "</b>/100</p>" +

    el("btnAlloc").disabled = used !== 100;
  }

  paint();
  el("btnAlloc").onclick = function () {
    var o = vals(), r = calc(o), spread = 0;
    m.channels.forEach(function (c) { if (o[c.k] >= 10) spread++; });
    S.art.offsite = r.score;
    var waste = r.notes.length ? "<br><br><b>Poin yang tidak bekerja:</b><br>" + r.notes.map(esc).join("<br>") : "";
    var note = !o.own ?
      "Isi dulu website sendiri. Itu sumber yang dipakai AI untuk memastikan entity-mu memang ada, walau bobotnya paling rendah." :
      spread <= 2 ?
      "Kamu menumpuk di satu atau dua channel. Tiap channel punya titik jenuh, jadi poin berlebih di tempat yang sama hampir tidak menambah apa pun." :
      spread >= 5 ? "Sebarannya luas. Ini yang paling mirip cara AI bekerja: banyak sumber berbeda menyebut hal yang sama." :
        "Sebarannya cukup. Baca catatan di bawah, lalu coba satu kombinasi lain dan bandingkan angkanya.";
    el("out").innerHTML = '<div class="tip"><b>Off-page signal: ' + r.score + "/100.</b> " + note + waste +
      "<br><br>Angka ini jadi salah satu komponen nilai SynthEngine di Misi 9. Halaman bagus dengan off-page nol tidak akan pernah dapat nilai penuh.</div>";
    var data = { }; m.channels.forEach(function (c) { data[c.k] = o[c.k]; });
    finish(m.id, r.score, data);
    if (r.score >= 70) award("entity");
    save(); el("afterA").hidden = false; wireNext(m);
  };
  wireNext(m);
}

/* ---------- sandbox ---------- */
function sandbox() {
  cur = null; paintRail();
  el("stage").innerHTML = '<div style="--era:var(--ink)"><div class="eratag" style="--era:var(--ink)">Sandbox</div>' +
    "<h2>Uji teks apa pun di tiga engine</h2>" +
    '<p class="goal">Tempel teks apa pun \u2014 punyamu, punya kompetitor, atau contoh dari buku \u2014 lalu lihat ketiga engine menilainya sekaligus. Nilainya tidak masuk rapor.</p>' +
    '<section class="surface">' +
    '<label class="fl" for="sbk">Keyword atau pertanyaan target</label><input type="text" id="sbk" value="' + esc(S.brand ? S.brand.kw : "") + '">' +
    '<label class="fl" for="sbt">Teks</label><textarea id="sbt" rows="12" placeholder="Tempel di sini."></textarea><div class="counter" id="sbc"></div></section>' +
    '<div class="btnrow"><button class="btn" id="sbrun">Jalankan tiga engine</button></div><div id="out"></div></div>';
  el("sbt").oninput = function () { el("sbc").textContent = wc(el("sbt").value) + " kata \u00b7 " + sentences(el("sbt").value).length + " kalimat"; };
  el("sbrun").onclick = function () {
    var t = el("sbt").value;
    if (wc(t) < 10) { toast("Minimal 10 kata."); return; }
    el("out").innerHTML = consoleHTML(runAll(t, ctxNow({ kw: el("sbk").value })), "sandbox");
  };
}

/* ---------- rapor ---------- */
function report() {
  var lv = levelOf(S.xp), b = S.brand || {};
  var rows = MISSIONS.map(function (m) {
    var r = S.m[m.id];
    return "<tr><td>" + m.no + "</td><td>" + esc(m.title) + "</td><td>" + esc(ERAS[m.era].name.split("\u2014")[0].trim()) +
      '</td><td class="n">' + (r ? r.score : "\u2014") + '</td><td class="n">' + (r ? r.attempts : "\u2014") + "</td></tr>";
  }).join("");
  var got = BADGES.filter(function (x) { return S.badges.indexOf(x.id) >= 0; }).map(function (x) { return x.t; });
  var done = Object.keys(S.m).length;
  modal("<h2>Rapor Lab Tiga Engine</h2>" +
    "<p>" + esc(b.brand || "\u2014") + " \u00b7 " + esc(b.cat || "") + " \u00b7 " + esc(b.city || "") +
    "<br>Keyword: " + esc(b.kw || "\u2014") + "</p>" +
    '<p class="u-sans" style="font-size:1.3rem">' + esc(lv.t) + " \u00b7 " + S.xp + " XP \u00b7 " + done + "/" + MISSIONS.length + " misi selesai</p>" +
    "<table class=\"rc\"><tr><th>#</th><th>Misi</th><th>Era</th><th>Nilai</th><th>Coba</th></tr>" + rows + "</table>" +
    "<p><b>Badge:</b> " + (got.length ? esc(got.join(", ")) : "belum ada") + "</p>" +
    (S.art.final ? "<h3>Halaman final</h3><p style=\"white-space:pre-wrap\">" + esc(S.art.final) + "</p>" : "") +
    '<div class="btnrow" style="margin-top:18px"><button class="btn" onclick="window.print()">Cetak / simpan PDF</button>' +
    '<button class="btn ghost" onclick="closeModal()">Tutup</button></div>');
}

/* ---------- catatan pengajar ---------- */
function teacher() {
  modal("<h2>Catatan pengajar</h2>" +
    "<p>Satu file HTML, jalan tanpa internet, tanpa install. Bagikan lewat flashdisk, WhatsApp, atau folder kelas. Progres tiap siswa tersimpan di browser masing-masing.</p>" +
    "<h3>Usulan pembagian pertemuan</h3>" +
    "<p><b>Pertemuan A \u2014 Era 1 (SEO):</b> Misi 1\u20133. Search intent, title tag, framework copywriting. Tutup dengan satu pertanyaan: kenapa nilai SnippetBot rendah padahal CrawlBot tinggi?<br>" +
    "<b>Pertemuan B \u2014 Era 2 (AEO):</b> Misi 4\u20136. BLUF, FAQ schema, voice search dan zero-click. Pakai perbandingan nilai sebelum\u2013sesudah di Misi 4 sebagai bahan diskusi.<br>" +
    "<b>Pertemuan C \u2014 Era 3 (GEO):</b> Misi 7\u20138. Kalimat yang bisa dikutip dan off-page signal. Minta 3 siswa membaca kalimat kutipannya, kelas menilai mana yang paling mungkin dipakai AI.<br>" +
    "<b>Pertemuan D \u2014 Ujian:</b> Misi 9\u201310 dikerjakan di kelas, lalu kumpulkan file jawabannya.</p>" +
    "<h3>Cara mengumpulkan nilai</h3>" +
    "<p>Siswa klik <b>Export jawaban</b> \u2192 keluar satu file <span style=\"font-family:var(--mono)\">.json</span> berisi semua tulisan, nilai, dan jumlah percobaan. Bisa dibuka dengan text editor, atau dimuat lagi lewat <b>Import jawaban</b> untuk diperiksa langsung di app ini. Rapor juga bisa dicetak jadi PDF.</p>" +
    "<h3>Cara engine menilai</h3>" +
    "<p>Penilaiannya murni rule-based, bukan AI, jadi hasilnya sama di semua komputer dan bisa kamu pertanggungjawabkan. Aturannya ada di bagian <span style=\"font-family:var(--mono)\">TIGA ENGINE PENILAI</span> di file ini. Bobot tiap kriteria adalah angka pertama di <span style=\"font-family:var(--mono)\">mk(...)</span> \u2014 ubah angkanya kalau mau menyesuaikan penekanan materi.</p>" +
    "<h3>Menambah misi sendiri</h3>" +
    "<p>Buka bagian <span style=\"font-family:var(--mono)\">DAFTAR MISI</span>, copy satu objek, ubah <span style=\"font-family:var(--mono)\">id</span> supaya unik, lalu isi <span style=\"font-family:var(--mono)\">brief</span> dan <span style=\"font-family:var(--mono)\">steps</span>. Ada enam jenis tugas: quiz, serp, write, faq, allocate, decide. Menu kiri, XP, badge, dan rapor menyesuaikan sendiri \u2014 tidak ada kode lain yang perlu disentuh.</p>" +
    "<h3>Yang perlu disampaikan ke kelas</h3>" +
    "<p>Nilai di sini adalah alat bantu ajar, bukan tiruan algoritma Google atau model AI mana pun. Nilai tinggi berarti tulisan itu memenuhi prinsip yang kita ajarkan, bukan jaminan ranking. Sampaikan di awal supaya siswa tidak sibuk mengejar angka dan lupa pembacanya.</p>" +
    '<div class="btnrow" style="margin-top:18px"><button class="btn ghost" onclick="closeModal()">Tutup</button></div>');
}

/* ---------- onboarding ---------- */
function onboard() {
  cur = null;
  var picks = PRESETS.map(function (p, i) {
    return '<button class="pick" data-p="' + i + '" aria-pressed="false"><b>' + esc(p.brand) + "</b><small>" + esc(p.cat) + " \u00b7 " + esc(p.city) + "</small><br>" + esc(p.fact) + "</button>";
  }).join("") + '<button class="pick" data-p="-1" aria-pressed="false"><b>Brand saya sendiri</b><small>isi manual</small><br>Pakai usaha keluarga, UMKM tempat magang, atau proyek kelompokmu.</button>';
  el("stage").innerHTML = '<div style="--era:var(--synth)">' +
    '<div class="eratag">Sebelum mulai</div>' +
    "<h1>Satu teks, tiga engine, tiga nilai</h1>" +
    '<p class="goal" style="font-size:1.15rem;max-width:60ch">Dulu search engine hanya mengurutkan link. Lalu ia mulai mengambil satu jawaban dan menaruhnya di atas hasil pencarian. Sekarang AI menulis jawabannya sendiri, dan hanya menyebut sumber yang dipakainya. Teks yang menang di satu era bisa hilang di era berikutnya. Sepuluh misi berikut membawamu melewati ketiganya, dengan satu brand yang kamu pegang dari awal sampai akhir.</p>' +
    '<div class="console" style="margin:26px 0"><header><span>Contoh teks gaya 2008, dinilai tiga engine</span><span>nilainya dihitung langsung, bukan contoh tempelan</span></header>' +
    '<div style="padding:14px 16px;background:var(--card);border-bottom:1px solid var(--rule);font-size:.95rem"><i>' + esc(DEMO_TEXT) + "</i></div>" +
    metersHTML(runAll(DEMO_TEXT, DEMO_CTX)) + "</div>" +
    "<h3>Pilih brand yang kamu pegang</h3><p>Semua misi memakai brand ini, jadi pilih yang kamu paham.</p>" +
    '<div class="picks" id="picks">' + picks + "</div>" +
    '<section class="surface" id="custom" hidden style="margin-top:16px">' +
    '<label class="fl" for="cb">Nama brand</label><input type="text" id="cb">' +
    '<label class="fl" for="cc">Kategori usaha<small>mis. jasa cuci sepatu</small></label><input type="text" id="cc">' +
    '<label class="fl" for="ci">Kota</label><input type="text" id="ci">' +
    '<label class="fl" for="ck">Keyword utama<small>tulis seperti yang diketik orang</small></label><input type="text" id="ck">' +
    "</section>" +
    '<div class="btnrow" style="margin-top:18px"><button class="btn" id="btnStart" disabled>Mulai Misi 1</button></div></div>';
  var sel = null;
  el("picks").addEventListener("click", function (e) {
    var b = e.target.closest(".pick"); if (!b) return;
    var all = el("picks").querySelectorAll(".pick");
    for (var i = 0; i < all.length; i++) all[i].setAttribute("aria-pressed", all[i] === b ? "true" : "false");
    sel = +b.getAttribute("data-p");
    el("custom").hidden = sel !== -1;
    el("btnStart").disabled = false;
  });
  el("btnStart").onclick = function () {
    var p;
    if (sel === -1) {
      p = { brand: el("cb").value.trim(), cat: el("cc").value.trim(), city: el("ci").value.trim(), kw: el("ck").value.trim() };
      if (!p.brand || !p.cat || !p.city || !p.kw) { toast("Isi keempat kolomnya dulu."); return; }
    } else p = JSON.parse(JSON.stringify(PRESETS[sel]));
    p.q = "";
    S.brand = p; save(); paintRail(); go(MISSIONS[0].id);
  };
  paintRail();
}

/* ---------- ekspor / impor / reset ---------- */
function isIOS() {
  return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
    (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
}
function copyBox(id) {
  var ta = el(id);
  ta.focus(); ta.select(); ta.setSelectionRange(0, ta.value.length);
  var ok = false;
  try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
  if (!ok && navigator.clipboard) {
    navigator.clipboard.writeText(ta.value).then(function () { toast("Tersalin."); },
      function () { toast("Tekan lama di kotak teks, lalu pilih Select All \u2192 Copy."); });
    return;
  }
  toast(ok ? "Tersalin. Tempel ke WhatsApp atau email." : "Tekan lama di kotak teks, lalu pilih Select All \u2192 Copy.");
}
function exportFile() {
  var json = JSON.stringify(S, null, 2);
  var name = "lab-tiga-engine-" + low((S.brand && S.brand.brand) || "siswa").replace(/[^a-z0-9]+/g, "-") +
    "-" + new Date().toISOString().slice(0, 10) + ".json";
  modal("<h2>Export jawaban</h2>" +
    "<p>Pilih salah satu. Di iPhone dan iPad, tombol download biasanya tidak berfungsi \u2014 pakai Copy, lalu tempel ke WhatsApp atau email ke dosen.</p>" +
    '<div class="btnrow"><button class="btn" id="exCopy">Copy semua teks</button>' +
    '<button class="btn ghost" id="exDl">Download file .json</button></div>' +
    '<textarea id="exTa" rows="8">' + esc(json) + "</textarea>" +
    '<p class="counter">Nama file: ' + esc(name) + "</p>" +
    '<div class="btnrow"><button class="btn ghost" onclick="closeModal()">Tutup</button></div>');
  el("exCopy").onclick = function () { copyBox("exTa"); };
  el("exDl").onclick = function () {
    try {
      var blob = new Blob([json], { type: "application/json" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = name;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
      toast("File " + name + " diunduh.");
    } catch (e) { toast("Download tidak didukung di browser ini. Pakai tombol Copy."); }
  };
}
function applyImport(text) {
  try {
    var o = JSON.parse(text);
    if (!o || o.v !== 1) throw 0;
    S = o; save(); paintRail(); closeModal();
    if (S.brand) go(firstOpen()); else onboard();
    toast("Jawaban berhasil dimuat.");
  } catch (e) { toast("Teks tidak dikenali. Pastikan seluruh isi file .json tersalin, termasuk tanda kurung kurawal."); }
}
function importDialog() {
  modal("<h2>Import jawaban</h2>" +
    "<p>Pilih file .json, atau tempel isinya ke kotak di bawah. Menu tempel muncul dengan tekan lama di kotak itu.</p>" +
    '<input type="file" id="impFile" accept="application/json,text/plain,.json" style="margin-bottom:14px">' +
    '<textarea id="impTa" rows="6" placeholder="Tempel isi file .json di sini."></textarea>' +
    '<div class="btnrow"><button class="btn" id="impGo">Muat jawaban</button>' +
    '<button class="btn ghost" onclick="closeModal()">Batal</button></div>');
  el("impFile").onchange = function () {
    if (!this.files || !this.files[0]) return;
    var r = new FileReader();
    r.onload = function () { applyImport(r.result); };
    r.onerror = function () { toast("File tidak bisa dibaca. Pakai cara tempel teks."); };
    r.readAsText(this.files[0]);
  };
  el("impGo").onclick = function () {
    var v = el("impTa").value.trim();
    if (!v) { toast("Kotaknya masih kosong."); return; }
    applyImport(v);
  };
}

/* ---------- init ---------- */
load();
el("modal").addEventListener("click", function (e) { if (e.target === el("modal")) closeModal(); });
document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeModal(); });
document.addEventListener("click", function (e) {
  var b = e.target.closest("button[data-go]");
  if (b && !b.disabled) { go(b.getAttribute("data-go")); el("stage").focus(); }
});
el("btnSandbox").onclick = sandbox;
el("btnReport").onclick = report;
el("btnTeacher").onclick = teacher;
el("btnExport").onclick = exportFile;
el("btnImport").onclick = importDialog;
el("btnReset").onclick = function () {
  modal("<h2>Mulai dari nol?</h2><p>Semua tulisan, nilai, dan badge di browser ini akan dihapus dan tidak bisa dikembalikan. Export dulu kalau masih dibutuhkan.</p>" +
    '<div class="btnrow"><button class="btn" id="cfr">Ya, hapus semuanya</button><button class="btn ghost" onclick="closeModal()">Batal</button></div>');
  el("cfr").onclick = function () { S = freshState(); save(); closeModal(); onboard(); };
};
if (S.brand) { paintRail(); go(firstOpen()); } else onboard();

</script>

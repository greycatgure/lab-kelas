<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ruang Rancang — Perancangan Web</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%2317202B'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-size='14' font-weight='700' fill='%234FA3B8' text-anchor='middle'%3ERR%3C/text%3E%3C/svg%3E">
<style>/* =========================================================
   RUANG RANCANG — Perancangan Web (D3 Administrasi Bisnis)
   Sekeluarga dengan Ruang Usaha dan Lab Tiga Engine: kertas
   & tinta sama. Aksennya petrol karena lab ini soal layar,
   bukan meja kerja. Nama variabel --amber sengaja dipertahankan
   supaya blok CSS tetap bisa disalin antarlab.
   ========================================================= */
:root{
  --paper:#F1F2EC; --card:#FBFBF7; --ink:#17202B; --ink-soft:#4A5563; --rule:#CDD1C2;
  --amber:#1E5E73; --good:#2E6B45; --bad:#A32020; --info:#2547C8; --plum:#7B2D7A;
  --sans:"Arial Narrow","Helvetica Neue Condensed","Liberation Sans Narrow",system-ui,sans-serif;
  --serif:Georgia,"Iowan Old Style","Palatino Linotype",serif;
  --mono:ui-monospace,"SFMono-Regular","Consolas","Liberation Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper); color:var(--ink); font-family:var(--serif); font-size:17px; line-height:1.6; -webkit-text-size-adjust:100%}
h1,h2,h3,h4,.u-sans{font-family:var(--sans); letter-spacing:-.01em; font-weight:700; line-height:1.1}
h1{font-size:2.3rem;margin:0}
h2{font-size:1.75rem;margin:0 0 6px}
h3{font-size:1.15rem;margin:22px 0 6px}
p{margin:0 0 .9em; max-width:68ch}
button:focus{outline:2px solid var(--amber); outline-offset:2px}
:focus-visible{outline:3px solid var(--amber); outline-offset:2px}

.wrap{display:grid; grid-template-columns:258px minmax(0,1fr); min-height:100vh}
.rail{background:var(--ink); color:#E7EAE2; padding:20px 16px 40px; position:sticky; top:0; align-self:start; height:100vh; overflow:auto; -webkit-overflow-scrolling:touch}
.stage{padding:32px 36px 90px; max-width:940px; min-width:0}

.wm{font-family:var(--sans); font-size:1.4rem; line-height:1}
.wm span{display:block; font-family:var(--mono); font-size:.68rem; color:#9AA69B; margin-top:6px; letter-spacing:.02em}
.who{margin:16px 0; padding:10px 12px; background:#22303F; border-radius:3px; font-family:var(--sans); font-size:.88rem}
.who b{display:block; font-size:1.05rem}
.who em{display:block; color:#9AA69B; font-style:normal; font-family:var(--mono); font-size:.72rem; margin-top:3px}
.xp{height:7px; background:#0E151D; border-radius:99px; margin-top:8px; overflow:hidden}
.xp i{display:block; height:100%; background:#4FA3B8; width:0; transition:width .6s ease}
.blok{margin:16px 0 5px; font-family:var(--sans); font-size:.8rem; color:#8E9A8F}
.mlist{list-style:none; margin:0; padding:0}
.mlist button{width:100%; text-align:left; background:none; border:0; color:#D8DDD3; cursor:pointer; font-family:var(--sans); font-size:.94rem; padding:6px 8px 6px 26px; border-radius:3px; position:relative; line-height:1.25}
.mlist button:hover{background:#22303F}
.mlist button[aria-current="true"]{background:#2C3C4E; color:#fff}
.mlist button:before{content:attr(data-n); position:absolute; left:6px; top:6px; font-family:var(--mono); font-size:.7rem; color:#7E8A80}
.mlist button.done:before{content:"\2713"; color:#4FA3B8}
.mlist button.locked{opacity:.42; cursor:not-allowed}
.mlist .w{font-family:var(--mono); font-size:.68rem; opacity:.65}
.tools{margin-top:20px; border-top:1px solid #2C3C4E; padding-top:12px; display:grid; gap:5px}
.tools button{background:none; border:1px solid #3A4C60; color:#C9D0C6; font-family:var(--sans); font-size:.86rem; padding:5px 9px; border-radius:3px; cursor:pointer; text-align:left}
.tools button:hover{background:#22303F; color:#fff}
.badges{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px}
.badge{font-family:var(--sans); font-size:.76rem; border:1px solid #3A4C60; color:#9AA69B; padding:2px 7px; border-radius:99px}
.badge.on{background:#4FA3B8; color:#17202B; border-color:#D98C6A}

.tag{font-family:var(--sans); font-size:.9rem; color:var(--amber); display:flex; align-items:center; gap:8px; margin-bottom:8px}
.tag:before{content:""; width:30px; height:4px; background:var(--amber)}
.mt{display:flex; gap:11px; align-items:baseline; margin-bottom:5px}
.mt .no{font-family:var(--mono); font-size:.95rem; color:var(--ink-soft)}
.goal{font-family:var(--sans); font-size:1.04rem; color:var(--ink-soft); max-width:62ch; margin-bottom:20px}
.brief{border-left:4px solid var(--rule); padding-left:18px; margin-bottom:22px}
ol.steps{counter-reset:s; list-style:none; padding:0; margin:0 0 22px; max-width:68ch}
ol.steps li{counter-increment:s; position:relative; padding-left:38px; margin-bottom:10px}
ol.steps li:before{content:counter(s); position:absolute; left:0; top:2px; width:25px; height:25px; background:var(--amber); color:#fff; font-family:var(--mono); font-size:.8rem; display:grid; place-items:center; border-radius:50%}
.note{background:#E6E9DC; border-radius:3px; padding:12px 16px; font-size:.94rem; margin-bottom:20px; max-width:70ch}
.note b{font-family:var(--sans)}

.card{background:var(--card); border:1px solid var(--rule); border-radius:4px; padding:16px 18px; margin-bottom:16px}
.card>h3:first-child{margin-top:0}
label.fl{display:block; font-family:var(--sans); font-size:.92rem; margin-bottom:3px}
label.fl small{color:var(--ink-soft); font-family:var(--mono); font-size:.72rem; margin-left:5px}
input[type=text],input[type=number],select,textarea{width:100%; font-family:var(--serif); font-size:1rem; color:var(--ink); background:#fff; border:1px solid var(--rule); border-radius:3px; padding:8px 10px; margin-bottom:12px}
input[type=number]{font-family:var(--mono)}
select{font-family:var(--sans)}
textarea{min-height:80px; resize:vertical}
.btn{font-family:var(--sans); font-size:1rem; background:var(--ink); color:#fff; border:0; padding:10px 20px; border-radius:3px; cursor:pointer}
.btn:hover{background:#0E151D}
.btn.go{background:var(--amber)} .btn.go:hover{background:#15444F}
.btn.ghost{background:none; color:var(--ink); border:1px solid var(--ink)}
.btn.ghost:hover{background:#E6E9DC}
.btn:disabled{opacity:.45; cursor:not-allowed}
.btnrow{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:4px 0 22px}
.hint{font-family:var(--mono); font-size:.74rem; color:var(--ink-soft); margin:-8px 0 12px}

/* soal & pilihan */
.q{border-bottom:1px solid var(--rule); padding:13px 0}
.q:last-child{border-bottom:0}
.q .stem{font-size:1.02rem; margin-bottom:7px; max-width:70ch}
.q .stem b{font-family:var(--sans)}
.opts{display:flex; gap:7px; flex-wrap:wrap}
.opts button{font-family:var(--sans); font-size:.92rem; background:#fff; border:1px solid var(--rule); padding:6px 12px; border-radius:99px; cursor:pointer}
.opts button[aria-pressed="true"]{background:var(--ink); color:#fff; border-color:var(--ink)}
.opts button.right{background:#DCEBE0; border-color:var(--good); color:var(--good)}
.opts button.part{background:#DCEAEE; border-color:var(--amber); color:var(--amber)}
.opts button.wrong{background:#F4DCDC; border-color:var(--bad); color:var(--bad)}
.why{font-size:.9rem; color:var(--ink-soft); margin-top:7px; max-width:72ch}

/* checklist chip */
.chips{display:flex; gap:7px; flex-wrap:wrap; margin-bottom:6px}
.chip{font-family:var(--sans); font-size:.9rem; background:#fff; border:1px solid var(--rule); padding:6px 12px; border-radius:99px; cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink); color:#fff; border-color:var(--ink)}
.chip.right{background:#DCEBE0; border-color:var(--good); color:var(--good)}
.chip.wrong{background:#F4DCDC; border-color:var(--bad); color:var(--bad)}
.chip.miss{background:#fff; border-color:var(--good); color:var(--good); border-style:dashed}

/* urutan */
.seq{list-style:none; padding:0; margin:0 0 10px}
.seq li{background:#fff; border:1px solid var(--rule); border-radius:3px; padding:8px 12px; margin-bottom:6px; display:flex; gap:10px; align-items:center; font-size:.95rem}
.seq li .n{font-family:var(--mono); font-size:.8rem; width:22px; color:var(--ink-soft)}
.seq li .mv{margin-left:auto; display:flex; gap:4px}
.seq li .mv button{font-family:var(--mono); background:#fff; border:1px solid var(--rule); width:28px; height:26px; border-radius:3px; cursor:pointer}
.seq li.ok{border-color:var(--good); background:#F2F8F3}
.seq li.no{border-color:var(--bad); background:#FBF3F3}

/* tabel kas kecil */
table.t{width:100%; border-collapse:collapse; font-size:.92rem; margin:10px 0 16px}
table.t th,table.t td{border-bottom:1px solid var(--rule); padding:6px 7px; text-align:left; vertical-align:middle}
table.t th{font-family:var(--sans); font-size:.88rem}
table.t td.n,table.t th.n{font-family:var(--mono); text-align:right; white-space:nowrap}
table.t select{margin:0; padding:4px 6px; font-size:.85rem}
table.t tfoot td{font-family:var(--sans); border-top:2px solid var(--ink); border-bottom:0}
.wrapx{overflow-x:auto}

ul.find{list-style:none; padding:0; margin:0 0 16px}
ul.find li{position:relative; padding:8px 0 8px 28px; border-bottom:1px solid var(--rule); max-width:74ch; font-size:.94rem}
ul.find li:before{position:absolute; left:2px; top:8px; font-family:var(--mono); font-size:.88rem}
ul.find li.ok:before{content:"\2713"; color:var(--good)}
ul.find li.part:before{content:"~"; color:var(--amber)}
ul.find li.no:before{content:"\00D7"; color:var(--bad)}
ul.find li.info:before{content:"i"; color:var(--info)}
ul.find li b{font-family:var(--sans)}

.score{border:1px solid var(--ink); border-radius:4px; overflow:hidden; margin-bottom:20px}
.score>header{background:var(--ink); color:#E7EAE2; font-family:var(--sans); font-size:.94rem; padding:8px 14px; display:flex; justify-content:space-between}
.score .body{background:var(--card); padding:15px}
.score .v{font-family:var(--sans); font-size:2.4rem; line-height:1}
.score .track{height:8px; background:#E2E5DA; border-radius:99px; overflow:hidden; margin:8px 0 10px}
.score .track i{display:block; height:100%; width:0; background:var(--amber); transition:width .6s ease}

.modal{position:fixed; top:0; right:0; bottom:0; left:0; background:rgba(23,32,43,.72); display:grid; place-items:center; padding:18px; z-index:40}
.modal[hidden]{display:none}
.sheet{background:var(--paper); border-radius:5px; padding:24px; max-width:720px; width:100%; max-height:88vh; overflow:auto}
.toast{position:fixed; left:50%; bottom:22px; transform:translateX(-50%); background:var(--ink); color:#fff; font-family:var(--sans); padding:10px 18px; border-radius:3px; z-index:50}
.toast[hidden]{display:none}
.rep{font-family:var(--mono); font-size:.78rem; line-height:1.5; white-space:pre; min-height:300px}



/* ---- tambahan lab ini ---- */
/* penggeser nilai (misi 4) — sama seperti di lab keluarga */
.alloc{display:grid; gap:12px; margin-bottom:6px}
.arow{display:grid; grid-template-columns:200px 1fr 60px; gap:12px; align-items:center}
.arow .nm{font-family:var(--sans); font-size:.94rem}
.arow .nm small{display:block; color:var(--ink-soft); font-family:var(--serif); font-size:.8rem; line-height:1.3}
.arow output{font-family:var(--mono); font-size:.9rem; text-align:right}
input[type=range]{width:100%; accent-color:var(--amber)}

/* baris kode yang bisa ditandai (misi 3) */
.lines{background:#17202B; border-radius:3px; overflow-x:auto; margin:0 0 14px}
.lines button{display:flex; min-width:max-content; gap:11px; width:100%; text-align:left; background:none; border:0; border-left:3px solid transparent;
  padding:2px 12px 2px 8px; font-family:var(--mono); font-size:.8rem; line-height:1.75; color:#E7EAE2; cursor:pointer}
.lines button .n{color:#7E8A80; width:20px; flex:none; text-align:right}
.lines button .s{white-space:pre; overflow-x:auto}
.lines button:hover{background:#22303F}
.lines button[aria-pressed="true"]{background:#1E5E73; border-left-color:#4FA3B8}
.lines button.hit{background:#1B4634; border-left-color:#5FBF8A}
.lines button.miss{background:#4A1F1F; border-left-color:#E08A84}
.lines button .f{margin-left:auto; flex:none; padding-left:10px; font-size:.7rem; color:#A9B4AA; white-space:normal; text-align:right; max-width:20ch}

/* pemilih warna (misi 2) */
.sws{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px}
.sws button{width:30px; height:30px; border:2px solid var(--rule); border-radius:3px; padding:0; cursor:pointer}
.sws button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink); border-color:#fff}
.ratio{font-family:var(--mono); font-size:.82rem; padding:7px 10px; border:1px solid var(--rule); border-radius:3px; background:#fff; margin-bottom:8px}
.ratio.ya{border-color:var(--good); background:#F2F8F3; color:var(--good)}
.ratio.tidak{border-color:var(--bad); background:#FBF3F3; color:var(--bad)}
.mock{border:1px solid var(--rule); border-radius:3px; overflow:hidden; max-width:330px}
.mock .bar{display:flex; gap:5px; padding:6px 8px; background:#E6E9DC; border-bottom:1px solid var(--rule)}
.mock .bar i{width:8px; height:8px; border-radius:99px; background:var(--rule)}
.mock .in{padding:16px 14px 18px}
.mock .in h4{font-size:1.12rem; margin:0 0 5px}
.mock .in p{font-size:.82rem; margin:0 0 11px; line-height:1.45}
.mock .in span{display:inline-block; font-family:var(--sans); font-size:.8rem; padding:6px 12px; border-radius:3px}

/* kotak model (misi 4) */
.bxv{background:#fff; border:1px solid var(--rule); border-radius:3px; padding:14px; overflow-x:auto}
.bxm{background:#EDEFE4; border:1px dashed var(--rule); display:inline-block}
.bxb{background:#9CC0C8} .bxp{background:#DCEAEE}
.bxc{background:#fff; border:1px solid var(--rule); height:38px; display:grid; place-items:center; font-family:var(--mono); font-size:.7rem; color:var(--ink-soft)}
.readout{display:flex; gap:9px; flex-wrap:wrap; margin-top:11px; font-family:var(--mono); font-size:.78rem}
.readout span{padding:4px 8px; border:1px solid var(--rule); border-radius:3px; background:#fff}
.readout span.big{background:var(--ink); color:#fff; border-color:var(--ink)}

/* bingkai peranti (misi 4) */
.frames{display:flex; gap:12px; align-items:flex-end; overflow-x:auto; padding-bottom:6px; margin-bottom:6px}
.frames > div{flex:none}
.frames b{display:block; font-family:var(--mono); font-size:.68rem; color:var(--ink-soft); text-align:center; margin-bottom:4px}
.scr{border:1px solid var(--rule); border-radius:3px; background:#E6E9DC; padding:6px}
.scr .g{display:grid; gap:4px}
.scr .p{background:#fff; border:1px solid var(--rule); border-radius:2px; padding:4px 3px; font-size:.5rem; line-height:1.25;
  color:var(--ink-soft); text-align:center; overflow:hidden; white-space:nowrap; text-overflow:ellipsis}
.scr .p i{display:block; height:12px; border-radius:2px; background:#E2E5DA; margin-bottom:3px}

/* pratinjau hasil pencarian (misi 6) */
.serp{background:#fff; border:1px solid var(--rule); border-radius:3px; padding:13px}
.serp .u{font-family:var(--mono); font-size:.74rem; color:var(--ink-soft)}
.serp .t{font-family:var(--sans); font-size:1.05rem; color:var(--info); margin:3px 0; line-height:1.3}
.serp .d{font-size:.86rem; color:var(--ink-soft); line-height:1.5}
.count{display:flex; justify-content:space-between; font-family:var(--mono); font-size:.72rem; color:var(--ink-soft); margin:-8px 0 12px}
.count.ya{color:var(--good)}

@media (max-width:700px){ .arow{grid-template-columns:1fr 56px} .arow input[type=range]{grid-column:1/-1} }

@media (max-width:820px){
  .wrap{grid-template-columns:1fr}
  .rail{position:static; height:auto; padding-bottom:16px}
  .stage{padding:22px 16px 70px}
  h1{font-size:1.8rem} h2{font-size:1.4rem}
  .room{max-width:100%}
  .cell{font-size:.5rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{.rail,.btnrow,.tools,.modal{display:none!important} body{background:#fff} .stage{max-width:none;padding:0}}
</style>
</head>
<body>
<div class="wrap">
  <nav class="rail" aria-label="Daftar misi">
    <div class="wm">RUANG RANCANG<span>perancangan web &middot; d3 administrasi bisnis</span></div>
    <div class="who" id="who"></div>
    <div id="nav"></div>
    <div class="tools">
      <button id="btnRubrik">Bobot &amp; Sub-CPMK</button>
      <button id="btnPanduan">Panduan istilah</button>
      <button id="btnRapor">Rapor saya</button>
      <button id="btnExport">Export jawaban</button>
      <button id="btnImport">Import jawaban</button>
      <button id="btnReset">Kosongkan</button>
    </div>
  </nav>
  <main class="stage" id="stage" tabindex="-1"></main>
</div>
<div class="modal" id="modal" hidden><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast" hidden></div>
<script>
/* =======================================================================
   RUANG RANCANG — Perancangan Web (AN232507)
   Delapan misi mengikuti delapan Sub-CPMK pada RPS, dengan bobot yang
   sama persis: 8, 10, 14, 18, 10, 14, 14, 12 — berjumlah 100.
   Kasusnya memakai satu UMKM mitra, sama seperti tagihan tugas aslinya.
   ======================================================================= */
"use strict";

var KEY = "ruangrancang.v1";
var BLOK = { 1: "Sebelum UTS — pertemuan 1–7", 2: "Setelah UTS — pertemuan 9–15" };
var LEVELS = [
  { at: 0, t: "Anak Magang Studio" }, { at: 150, t: "Juru Gambar" },
  { at: 320, t: "Perakit Halaman" }, { at: 500, t: "Perancang Situs" },
  { at: 680, t: "Konsultan Web" }
];
var BADGES = [
  { id: "konsep", t: "Paham Mekanisme" }, { id: "rancang", t: "Perancang Antarmuka" },
  { id: "markah", t: "Markah Bersih" }, { id: "tampilan", t: "Penata Tampilan" },
  { id: "alat", t: "Pemilih Alat" }, { id: "bangun", t: "Pembangun Situs" },
  { id: "amanah", t: "Penjaga Amanah Mitra" }, { id: "serah", t: "Serah Terima Tuntas" },
  { id: "lengkap", t: "Delapan Misi Tuntas" }
];

/* palet yang boleh dipilih di Misi 2 */
var SWATCH = ["#FFFFFF", "#F1F2EC", "#EFE3C8", "#D9E7E8", "#C8A24B", "#9A6A18", "#1E5E73", "#2E6B45", "#7A2530", "#17202B"];

var S = null;
function fresh() { return { v: 1, nama: "", npm: "", mitra: "", xp: 0, badges: [], m: {}, cur: null }; }
function load() {
  try { var r = localStorage.getItem(KEY); S = r ? JSON.parse(r) : fresh(); }
  catch (e) { S = fresh(); }
  if (!S || S.v !== 1) S = fresh();
  if (!S.m) S.m = {}; if (!S.badges) S.badges = [];
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { toast("Browser menolak menyimpan. Pakai Export jawaban."); }
}
function award(id) {
  if (S.badges.indexOf(id) < 0) {
    S.badges.push(id);
    for (var i = 0; i < BADGES.length; i++) if (BADGES[i].id === id) { toast("Badge baru: " + BADGES[i].t); return; }
  }
}
function levelOf(xp) {
  var out = LEVELS[0];
  for (var i = 0; i < LEVELS.length; i++) if (xp >= LEVELS[i].at) out = LEVELS[i];
  return out;
}
function finish(id, score, data) {
  var prev = S.m[id] ? S.m[id].score : 0;
  S.m[id] = { score: Math.max(prev, Math.round(score)), attempts: ((S.m[id] && S.m[id].attempts) || 0) + 1, data: data || {}, at: Date.now() };
  S.xp = 0;
  for (var k in S.m) S.xp += S.m[k].score;
  var n = 0;
  for (var j = 0; j < MISSIONS.length; j++) if (S.m[MISSIONS[j].id]) n++;
  if (n === MISSIONS.length) award("lengkap");
  save(); paintRail();
}

function el(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]; }); }
var tt = null;
function toast(m) { var t = el("toast"); t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(function () { t.hidden = true; }, 3400); }
function modal(h) { el("sheet").innerHTML = h; el("modal").hidden = false; }
function closeModal() { el("modal").hidden = true; }
function mk(w, got, t, why) { return { w: w, got: Math.max(0, Math.min(1, got)), t: t, why: why || "" }; }
function total(cs) {
  var s = 0, m = 0;
  for (var i = 0; i < cs.length; i++) { s += cs[i].w * cs[i].got; m += cs[i].w; }

function missionById(id) {
  for (var i = 0; i < MISSIONS.length; i++) if (MISSIONS[i].id === id) return MISSIONS[i];
  return null;
}
function unlocked(i) { return i === 0 ? true : !!S.m[MISSIONS[i - 1].id]; }

   ======================================================================= */
var cur = null;
var tmp = {};   /* keadaan sementara sebelum jawaban dikirim */

function paintRail() {
  var lv = levelOf(S.xp), nx = null;
  for (var i = 0; i < LEVELS.length; i++) if (LEVELS[i].at > S.xp) { nx = LEVELS[i]; break; }
  var pct = nx ? Math.round((S.xp - lv.at) / (nx.at - lv.at) * 100) : 100;
  el("who").innerHTML = "<b>" + esc(lv.t) + "</b><em>" + S.xp + " poin" +
    (nx ? " · " + (nx.at - S.xp) + " lagi ke " + nx.t : " · tertinggi") + "</em>" +
    (S.nama ? "<em>" + esc(S.nama) + (S.npm ? " · " + esc(S.npm) : "") + "</em>" : "") +
    '<div class="xp"><i style="width:' + pct + '%"></i></div>' +
    '<div class="badges">' + BADGES.map(function (b) {
      return '<span class="badge' + (inArr(S.badges, b.id) ? " on" : "") + '">' + esc(b.t) + "</span>";
    }).join("") + "</div>";

  var html = "", blok = 0;
  for (var j = 0; j < MISSIONS.length; j++) {
    var m = MISSIONS[j];
    if (m.blok !== blok) {
      if (blok) html += "</ul>";
      blok = m.blok;
      html += '<div class="blok">' + esc(BLOK[blok]) + '</div><ul class="mlist">';
    }
    var dn = !!S.m[m.id], open = unlocked(j);
    html += '<li><button data-go="' + m.id + '" data-n="' + m.no + '" class="' + (dn ? "done" : "") +
      (open ? "" : " locked") + '"' + (open ? "" : " disabled") + (cur === m.id ? ' aria-current="true"' : "") + ">" +
      esc(m.title) + ' <span class="w">Sub-CPMK ' + m.sub + (dn ? " · " + S.m[m.id].score : "") + "</span></button></li>";
  }
  html += "</ul>";
  el("nav").innerHTML = html;
}

function shell(m, task) {
  return '<div class="tag">' + esc(BLOK[m.blok]) + " · Sub-CPMK " + m.sub + " · bobot " + m.bobot + "%</div>" +
    '<div class="mt"><span class="no">Misi ' + m.no + "</span><h2>" + esc(m.title) + "</h2></div>" +
    '<p class="goal">' + esc(m.goal) + "</p>" +
    '<div class="brief">' + m.brief + "</div>" +
    "<h3>Langkah kerja</h3><ol class=\"steps\">" + m.steps.map(function (s) { return "<li>" + s + "</li>"; }).join("") + "</ol>" +
    '<div class="note">' + m.note + "</div>" + task;
}
function nextBtn(m) {
  var i = MISSIONS.indexOf(m), n = MISSIONS[i + 1];
  return '<div class="btnrow" id="after" hidden>' +
    (n ? '<button class="btn ghost" id="bNext">Misi ' + n.no + ": " + esc(n.title) + "</button>"
       : '<button class="btn ghost" id="bRapor">Lihat rapor akhir</button>') + "</div>";
}
function wireNext(m) {
  var i = MISSIONS.indexOf(m), n = MISSIONS[i + 1];
  if (el("bNext") && n) el("bNext").onclick = function () { go(n.id); };
  if (el("bRapor")) el("bRapor").onclick = rapor;
}
function done(m, sc, data, at) {
  finish(m.id, sc, data);
  if (m.badge && sc >= (at || 75)) award(m.badge);
  save(); paintRail();
  el("after").hidden = false; wireNext(m);
}
function go(id) {
  cur = id; S.cur = id; save();
  var m = missionById(id); if (!m) return;
  var f = { match: vMatch, antarmuka: vAnt, markah: vMar, tampilan: vTam, bangun: vBgn, proyek: vPro, serah: vSer }[m.kind];
  tmp = {};
  el("stage").innerHTML = shell(m, f.view(m));
  paintRail(); window.scrollTo(0, 0);
  f.wire(m);
}

/* ---------------- potongan yang dipakai beberapa misi ---------------- */
function optsHtml(q, opts, picked) {
  return '<div class="opts">' + opts.map(function (o, j) {
    return '<button data-q="' + q + '" data-o="' + j + '" aria-pressed="' + (picked === j ? "true" : "false") + '">' + esc(o) + "</button>";
  }).join("") + "</div>";
}
function wireOpts(root, onPick) {
  root.addEventListener("click", function (e) {
    var b = e.target.closest("button[data-o]"); if (!b || b.disabled) return;
    var q = b.getAttribute("data-q"), o = +b.getAttribute("data-o");
    var box = b.parentNode.querySelectorAll("button[data-o]");
    for (var i = 0; i < box.length; i++) box[i].setAttribute("aria-pressed", "false");
    b.setAttribute("aria-pressed", "true");
    onPick(q, o);
  });
}
function markOpts(root, q, benar, dipilih) {
  var bs = root.querySelectorAll('button[data-q="' + q + '"]');
  for (var i = 0; i < bs.length; i++) {
    var j = +bs[i].getAttribute("data-o");
    bs[i].disabled = true;
    if (j === benar) bs[i].className = "right";
    else if (j === dipilih) bs[i].className = "wrong";
  }
}
function chipsHtml(list, picked) {
  return '<div class="chips">' + list.map(function (c, i) {
    return '<button class="chip" data-c="' + i + '" aria-pressed="' + (inArr(picked, i) ? "true" : "false") + '">' + esc(c.t) + "</button>";
  }).join("") + "</div>";
}
function wireChips(root, arr, after) {
  root.addEventListener("click", function (e) {
    var b = e.target.closest("button[data-c]"); if (!b || b.disabled) return;
    var i = +b.getAttribute("data-c"), k = arr.indexOf(i);
    if (k < 0) arr.push(i); else arr.splice(k, 1);
    b.setAttribute("aria-pressed", k < 0 ? "true" : "false");
    if (after) after();
  });
}
function markChips(root, list, picked) {
  var bs = root.querySelectorAll("button[data-c]");
  for (var i = 0; i < bs.length; i++) {
    var j = +bs[i].getAttribute("data-c"), benar = !!list[j].ok, amb = inArr(picked, j);
    bs[i].disabled = true;
    bs[i].className = "chip " + (benar && amb ? "right" : (!benar && amb ? "wrong" : (benar ? "miss" : "")));
  }
}
function seqHtml(id, items, order) {
  return '<ul class="seq" id="' + id + '">' + order.map(function (k, i) {
    var it = null;
    for (var x = 0; x < items.length; x++) if (items[x].id === k) it = items[x];
    return '<li data-i="' + i + '"><span class="n">' + (i + 1) + '</span><span>' + esc(it.t) + '</span>' +
      '<span class="mv"><button data-mv="u" data-i="' + i + '" aria-label="Naikkan">▲</button>' +
      '<button data-mv="d" data-i="' + i + '" aria-label="Turunkan">▼</button></span></li>';
  }).join("") + "</ul>";
}
function wireSeq(id, arr, redraw) {
  var root = el(id);
  root.addEventListener("click", function (e) {
    var b = e.target.closest("button[data-mv]"); if (!b || b.disabled) return;
    var i = +b.getAttribute("data-i"), d = b.getAttribute("data-mv") === "u" ? -1 : 1, j = i + d;
    if (j < 0 || j >= arr.length) return;
    var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    redraw();
  });
}
function markSeq(id, kunci, arr) {
  var lis = el(id).querySelectorAll("li");
  for (var i = 0; i < lis.length; i++) {
    lis[i].className = arr[i] === kunci[i] ? "ok" : "no";
    var bs = lis[i].querySelectorAll("button"); for (var j = 0; j < bs.length; j++) bs[j].disabled = true;
  }
}
function seqSkor(kunci, arr) {
  var hit = 0;
  for (var i = 0; i < kunci.length; i++) if (arr[i] === kunci[i]) hit++;
  return hit === kunci.length ? 1 : Math.max(0, (hit - 1) / kunci.length);
}
function acak(ids) {
  var a = ids.slice();
  for (var i = a.length - 1; i > 0; i--) { var j = (i * 7 + 3) % (i + 1), t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}

      var cs = [], i, dOk = -1;
      for (i = 0; i < m.deskripsi.length; i++) if (m.deskripsi[i].ok) dOk = i;
      cs.push(mk(3, tmp.desk === dOk ? 1 : 0, "Deskripsi produk", tmp.desk === dOk ? "" : m.deskripsi[dOk].why));
      var db = el("dkc").querySelectorAll("button[data-o]");
      for (i = 0; i < db.length; i++) {
        db[i].disabled = true;
        db[i].className = m.deskripsi[i].ok ? "right" : (tmp.desk === i ? "wrong" : "");
        var w0 = el("dkc").querySelectorAll(".why")[i]; w0.innerHTML = esc(m.deskripsi[i].why); w0.hidden = false;
      }
      for (i = 0; i < m.etika.length; i++) {
        var e2 = m.etika[i], got = tmp.et[i] === e2.ans ? 1 : 0;
        cs.push(mk(3, got, "Keputusan " + (i + 1), got ? "" : e2.why));
        markOpts(el("etc"), i, e2.ans, tmp.et[i]);
        var w = el("etc").querySelectorAll(".q")[i].querySelector(".why");
        w.innerHTML = esc(e2.why); w.hidden = false;
      }
      var hit = 0, salah = 0, benarN = 0;
      for (i = 0; i < m.fitur.length; i++) {
        if (m.fitur[i].ok) benarN++;
        if (inArr(tmp.fitur, i)) { if (m.fitur[i].ok) hit++; else salah++; }
      }
      var gf = Math.max(0, Math.min(1, (hit - salah) / benarN));
      cs.push(mk(3, gf, "Fitur toko online dasar", gf >= 1 ? "" : "Empat fitur dasar membuat pesanan masuk dan diproses rapi tanpa pembayaran daring."));
      markChips(el("ftc"), m.fitur, tmp.fitur);
      el("ftw").innerHTML = '<ul class="find">' + m.fitur.map(function (f) {
        return '<li class="' + (f.ok ? "ok" : "no") + '"><b>' + esc(f.t) + "</b> — " + esc(f.why) + "</li>";
      }).join("") + "</ul>";
      var sc = total(cs);
      el("out").innerHTML = scoreBox(sc, "tiga bagian", cs);
      el("bCek").disabled = true;
      done(m, sc, { desk: tmp.desk, et: tmp.et, fitur: tmp.fitur });
    };
  }
};

/* =========================== MISI 8 — SERAH TERIMA =========================== */
var vSer = {
  view: function (m) {
    var d = (S.m[m.id] && S.m[m.id].data) || {};
    tmp.tri = d.tri || {}; tmp.opt = d.opt;
    tmp.lang = (d.lang || acak(m.kunci_langkah)).slice();
    return '<section class="card"><h3>a. Triase temuan pengujian</h3>' +
      '<p class="hint">Dasarnya jumlah penguji dan dampaknya terhadap pesanan, bukan kemudahan memperbaiki.</p>' +
      '<div class="wrapx"><table class="t" id="tri"><tr><th>Temuan</th><th class="n">Penguji</th><th>Tingkat</th></tr>' +
      m.temuan.map(function (t, i) {
        return "<tr data-i=\"" + i + "\"><td>" + esc(t.t) + '</td><td class="n">' + esc(t.n) + "</td><td><select data-t=\"" + i + "\">" +
          '<option value="">tingkat…</option>' + m.sev.map(function (s) {
            return '<option value="' + s + '"' + (tmp.tri[i] === s ? " selected" : "") + ">" + s + "</option>";
          }).join("") + "</select></td></tr>";
      }).join("") + "</table></div></section>" +
      '<section class="card" id="opc"><h3>b. Optimasi kecepatan</h3>' +
      '<div class="q"><p class="stem">' + esc(m.optimasi.stem) + "</p>" + optsHtml("o", m.optimasi.opts, tmp.opt) +
      '<p class="why" hidden></p></div></section>' +
      '<section class="card"><h3>c. Langkah serah terima</h3>' + seqHtml("sq", m.langkah, tmp.lang) + "</section>" +
      '<div class="btnrow"><button class="btn go" id="bCek">Periksa jawaban</button></div><div id="out"></div>' + nextBtn(m);
  },
  wire: function (m) {
    var sels = el("tri").querySelectorAll("select");
    for (var i = 0; i < sels.length; i++) sels[i].onchange = function () { tmp.tri[this.getAttribute("data-t")] = this.value; };
    wireOpts(el("opc"), function (q, o) { tmp.opt = o; });
    function drawSeq() { el("sq").outerHTML = seqHtml("sq", m.langkah, tmp.lang); wireSeq("sq", tmp.lang, drawSeq); }
    wireSeq("sq", tmp.lang, drawSeq);

    el("bCek").onclick = function () {
      var cs = [], i, hit = 0;
      for (i = 0; i < m.temuan.length; i++) if (tmp.tri[i] === m.temuan[i].sev) hit++;
      var g1 = hit / m.temuan.length;
      cs.push(mk(4, g1, "Triase temuan", g1 >= 1 ? "" : "Temuan yang dialami empat dari lima penguji hampir pasti dialami pembeli sungguhan."));
      var rows = el("tri").querySelectorAll("tr[data-i]");
      for (i = 0; i < rows.length; i++) {
        var benar = tmp.tri[i] === m.temuan[i].sev;
        rows[i].querySelector("select").disabled = true;
        rows[i].lastElementChild.innerHTML = (benar ? "<b>" + esc(m.temuan[i].sev) + "</b> · tepat" : esc(tmp.tri[i] || "—") + " → <b>" + esc(m.temuan[i].sev) + "</b>") +
          '<br><span style="font-size:.8rem;color:var(--ink-soft)">' + esc(m.temuan[i].why) + "</span>";
      }
      var o = m.optimasi;
      cs.push(mk(3, tmp.opt === o.ans ? 1 : 0, "Optimasi kecepatan", tmp.opt === o.ans ? "" : o.why));
      markOpts(el("opc"), "o", o.ans, tmp.opt);
      var w = el("opc").querySelector(".why"); w.innerHTML = esc(o.why); w.hidden = false;

      var g3 = seqSkor(m.kunci_langkah, tmp.lang);
      cs.push(mk(3, g3, "Langkah serah terima", g3 >= 1 ? "" : "Perbaiki dan ukur ulang, lengkapi SEO, terbitkan, susun panduan, baru alihkan kepemilikan."));
      markSeq("sq", m.kunci_langkah, tmp.lang);

      var sc = total(cs);
      el("out").innerHTML = scoreBox(sc, "tiga bagian", cs);
      el("bCek").disabled = true;
      done(m, sc, { tri: tmp.tri, opt: tmp.opt, lang: tmp.lang });
    };
  }
};
/* =======================================================================
   PERKAKAS

function nilaiAkhir() {
  var t = 0;
  for (var i = 0; i < MISSIONS.length; i++) {
    var m = MISSIONS[i], r = S.m[m.id];
    if (r) t += r.score * m.bobot / 100;
  }
  return Math.round(t * 10) / 10;
}
function pad(s, n) { s = String(s); while (s.length < n) s += " "; return s; }

function laporan() {
  var L = [];
  L.push("LAPORAN HASIL LATIHAN — RUANG RANCANG");
  L.push("Mata kuliah Perancangan Web (AN232507) · D3 Administrasi Bisnis");
  L.push("");
  L.push("Nama      : " + (S.nama || "-"));
  L.push("NPM       : " + (S.npm || "-"));
  L.push("UMKM mitra: " + (S.mitra || "-"));
  L.push("");
  L.push(pad("Misi", 40) + pad("Sub-CPMK", 10) + pad("Bobot", 8) + pad("Nilai", 8) + "Percobaan");
  L.push(new Array(80).join("-"));
  for (var i = 0; i < MISSIONS.length; i++) {
    var m = MISSIONS[i], r = S.m[m.id];
    var t = m.no + ". " + m.title;
    if (t.length > 38) t = t.slice(0, 37) + "…";
    L.push(pad(t, 40) + pad(m.sub, 10) + pad(m.bobot + "%", 8) + pad(r ? r.score : "-", 8) + (r ? r.attempts + "×" : "-"));
  }
  L.push(new Array(80).join("-"));
  L.push(pad("Nilai akhir terbobot", 40) + pad("", 10) + pad("100%", 8) + nilaiAkhir());
  L.push("");
  var got = [];
  for (var b = 0; b < BADGES.length; b++) if (inArr(S.badges, BADGES[b].id)) got.push(BADGES[b].t);
  L.push("Badge: " + (got.length ? got.join(", ") : "belum ada"));
  L.push("");
  L.push("Catatan: nilai di latihan ini bukan nilai mata kuliah. Angkanya");
  L.push("menunjukkan seberapa sesuai keputusanmu dengan prosedur yang");
  L.push("diajarkan, dan dipakai untuk berlatih sebelum proyek website");
  L.push("mitra yang sesungguhnya.");
  return L.join("\n");
}
function rapor() {
  var rows = MISSIONS.map(function (m) {
    var r = S.m[m.id];
    return "<tr><td>" + m.no + "</td><td>" + esc(m.title) + '</td><td class="n">' + m.bobot + '%</td><td class="n">' +
      (r ? r.score : "—") + '</td><td class="n">' + (r ? (r.score * m.bobot / 100).toFixed(1) : "—") + "</td></tr>";
  }).join("");
  modal("<h2>Rapor saya</h2>" +
    '<div class="card"><label class="fl" for="rn">Nama</label><input type="text" id="rn" value="' + esc(S.nama) + '">' +
    '<label class="fl" for="rp">NPM</label><input type="text" id="rp" value="' + esc(S.npm) + '">' +
    '<label class="fl" for="rm">UMKM mitra <small>opsional</small></label><input type="text" id="rm" value="' + esc(S.mitra) + '"></div>' +
    '<div class="wrapx"><table class="t"><tr><th>#</th><th>Misi</th><th class="n">Bobot</th><th class="n">Nilai</th><th class="n">Kontribusi</th></tr>' + rows +
    '<tfoot><tr><td colspan="4">Nilai akhir terbobot</td><td class="n">' + nilaiAkhir() + "</td></tr></tfoot></table></div>" +
    '<textarea class="rep" id="repT" rows="16"></textarea>' +
    '<div class="btnrow"><button class="btn go" id="rC">Copy laporan</button>' +
    '<button class="btn ghost" onclick="window.print()">Cetak / PDF</button>' +
    '<button class="btn ghost" onclick="closeModal()">Tutup</button></div>');
  el("repT").value = laporan();
  function sync() { save(); paintRail(); el("repT").value = laporan(); }
  el("rn").oninput = function () { S.nama = this.value; sync(); };
  el("rp").oninput = function () { S.npm = this.value; sync(); };
  el("rm").oninput = function () { S.mitra = this.value; sync(); };
  el("rC").onclick = function () { copyBox("repT"); };
}

function rubrik() {
  var rows = MISSIONS.map(function (m) {
    var r = S.m[m.id];
    return "<tr><td>" + m.no + "</td><td>" + esc(m.title) + '</td><td class="n">' + m.sub + '</td><td class="n">' + m.bobot + '%</td><td class="n">' + (r ? r.score : "—") + "</td></tr>";
  }).join("");
  modal("<h2>Bobot dan Sub-CPMK</h2>" +
    "<p>Delapan misi ini mengikuti delapan Sub-CPMK pada RPS, dan bobotnya diambil persis dari sana — 8, 10, 14, 18, 10, 14, 14, dan 12, berjumlah 100. Misi 4 paling berat karena satu Sub-CPMK itu memang mencakup CSS, tata letak responsif, dan JavaScript sekaligus.</p>" +
    '<div class="wrapx"><table class="t"><tr><th>#</th><th>Misi</th><th class="n">Sub-CPMK</th><th class="n">Bobot</th><th class="n">Nilai</th></tr>' + rows + "</table></div>" +
    "<h3>Yang dinilai otomatis dan yang tidak</h3>" +
    "<p>Latihan ini menilai ketepatan keputusan: jenis website, urutan blok halaman, ambang kontras, kebersihan markah, cascade dan box model, kolom responsif, pemilihan alat, SEO on-page, dan triase temuan pengujian. Yang tidak bisa dinilai di sini adalah website yang benar-benar dibangun, laporan pengujian, dan presentasi proyek — tiga hal yang justru menjadi tagihan utama Tugas 7 dan 8.</p>" +
    "<h3>Cara memakainya di kelas</h3>" +
    "<p>Misi 1 dan 2 cocok dikerjakan sebelum pertemuan ke-3 sebagai pemanasan. Misi 3 dan 4 paling berguna sesudah praktikum HTML dan CSS, karena mahasiswa bisa mengulang sampai terbiasa membaca cascade dan box model. Misi 5 sampai 8 dikerjakan setelah UTS, dan Misi 7 paling baik dibahas bersama di kelas: dua soal etikanya sengaja tidak punya jalan pintas teknis, dan jawabannya bahan diskusi yang bagus.</p>" +
    '<div class="btnrow"><button class="btn ghost" onclick="closeModal()">Tutup</button></div>');
}
function panduan() {
  modal("<h2>Panduan istilah</h2>" +
    "<h3>Konsep dan mekanisme</h3>" +
    "<p><b>Domain</b> — alamat yang diketik pengunjung, disewa tahunan.<br>" +
    "<b>Hosting</b> — ruang di server yang menyala 24 jam agar berkas dapat diakses.<br>" +
    "<b>Statis dan dinamis</b> — statis menyajikan berkas tetap; dinamis merakit halaman dari basis data.<br>" +
    "<b>HTTPS</b> — HTTP yang dienkripsi; wajib pada halaman yang memuat formulir.</p>" +
    "<h3>Perancangan antarmuka</h3>" +
    "<p><b>Struktur informasi</b> — keputusan tentang apa saja yang ada di website dan bagaimana dikelompokkan.<br>" +
    "<b>Wireframe</b> — rangka halaman tanpa warna dan tanpa foto akhir.<br>" +
    "<b>Rasio kontras</b> — perbandingan terang teks dan latar; ambang WCAG 4,5 : 1 untuk teks isi.<br>" +
    "<b>Hero</b> — bagian teratas halaman: nilai jual, satu tombol, dan biasanya harga.</p>" +
    "<h3>Markah dan tampilan</h3>" +
    "<p><b>Tag semantik</b> — header, nav, main, section, article, aside, footer; menyatakan perannya sendiri.<br>" +
    "<b>scope</b> — atribut pada sel kepala tabel yang menyatakan arah penjelasannya.<br>" +
    "<b>Cascade dan specificity</b> — aturan mana yang menang: id 100, kelas 10, tipe elemen 1.<br>" +
    "<b>Box model</b> — content, padding, border, margin; border-box menghitung padding dan border ke dalam lebar.<br>" +
    "<b>Mobile-first</b> — aturan dasar ditulis untuk layar terkecil, media query min-width menambah untuk layar lebar.<br>" +
    "<b>DOM</b> — pohon objek halaman di memori peramban; yang diubah JavaScript, bukan berkasnya.</p>" +
    "<h3>Builder, SEO, dan serah terima</h3>" +
    "<p><b>CMS</b> — tempat isi disimpan sebagai data, terpisah dari tampilannya.<br>" +
    "<b>Repeater</b> — satu rancangan kartu yang diulang untuk setiap baris data.<br>" +
    "<b>Title tag</b> — judul halaman di hasil pencarian dan di tab peramban; ideal 50–60 karakter.<br>" +
    "<b>Meta description</b> — cuplikan di bawah judul pada hasil pencarian; ideal 140–160 karakter.<br>" +
    "<b>Uji kebergunaan</b> — mengamati orang memakai website tanpa dibantu; lima penguji sudah memadai.<br>" +
    "<b>Berita acara serah terima</b> — catatan tertulis tentang apa yang diserahkan, kepada siapa, dan kapan akses lama dicabut.</p>" +
    '<div class="btnrow"><button class="btn ghost" onclick="closeModal()">Tutup</button></div>');
}

/* ---------------- ekspor / impor ---------------- */
function copyBox(id) {
  var ta = el(id);
  ta.focus(); ta.select();
  try { ta.setSelectionRange(0, ta.value.length); } catch (e) {}
  var ok = false;
  try { ok = document.execCommand("copy"); } catch (e2) { ok = false; }
  if (!ok && navigator.clipboard) {
    navigator.clipboard.writeText(ta.value).then(function () { toast("Tersalin."); },
      function () { toast("Tekan lama di kotak teks, lalu Select All → Copy."); });
    return;
  }
  toast(ok ? "Tersalin. Tempel ke dokumen atau LMS." : "Tekan lama di kotak teks, lalu Select All → Copy.");
}
function exportDialog() {
  var json = JSON.stringify(S, null, 2);
  var name = "ruangrancang-" + (S.npm || "siswa").replace(/[^a-zA-Z0-9]+/g, "") + "-" + new Date().toISOString().slice(0, 10) + ".json";
  modal("<h2>Export jawaban</h2><p>Di iPhone dan iPad tombol download biasanya tidak berfungsi — pakai Copy, lalu tempel ke WhatsApp, email, atau kolom tugas di LMS.</p>" +
    '<div class="btnrow"><button class="btn go" id="eC">Copy semua teks</button><button class="btn ghost" id="eD">Download .json</button></div>' +
    '<textarea id="eT" rows="8">' + esc(json) + "</textarea>" +
    '<p class="hint">Nama berkas: ' + esc(name) + "</p>" +
    '<div class="btnrow"><button class="btn ghost" onclick="closeModal()">Tutup</button></div>');
  el("eC").onclick = function () { copyBox("eT"); };
  el("eD").onclick = function () {
    try {
      var b = new Blob([json], { type: "application/json" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(b); a.download = name;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
      toast("Berkas " + name + " diunduh.");
    } catch (e) { toast("Download tidak didukung di browser ini. Pakai Copy."); }
  };
}
function applyImport(txt) {
  try {
    var o = JSON.parse(txt);
    if (!o || o.v !== 1) throw 0;
    S = o; if (!S.m) S.m = {}; if (!S.badges) S.badges = [];
    save(); closeModal(); paintRail(); go(S.cur || MISSIONS[0].id); toast("Jawaban dimuat.");
  } catch (e) { toast("Teks tidak dikenali. Pastikan seluruh isi berkas .json tersalin."); }
}
function importDialog() {
  modal("<h2>Import jawaban</h2><p>Pilih berkas .json, atau tempel isinya ke kotak di bawah.</p>" +
    '<input type="file" id="iF" accept="application/json,text/plain,.json" style="margin-bottom:12px">' +
    '<textarea id="iT" rows="6" placeholder="Tempel isi berkas .json di sini."></textarea>' +
    '<div class="btnrow"><button class="btn go" id="iG">Muat</button><button class="btn ghost" onclick="closeModal()">Batal</button></div>');
  el("iF").onchange = function () {
    if (!this.files || !this.files[0]) return;
    var r = new FileReader();
    r.onload = function () { applyImport(r.result); };
    r.onerror = function () { toast("Berkas tidak bisa dibaca. Pakai cara tempel teks."); };
    r.readAsText(this.files[0]);
  };
  el("iG").onclick = function () {
    var v = el("iT").value.trim();
    if (!v) { toast("Kotaknya masih kosong."); return; }
    applyImport(v);
  };
}

/* ---------------- pembuka ---------------- */
function pembuka() {
  cur = null; paintRail();
  el("stage").innerHTML =
    '<div class="tag">Sebelum mulai</div><h1>Delapan keputusan membangun website mitra</h1>' +
    '<p class="goal" style="font-size:1.12rem">Satu semester Perancangan Web, dikerjakan sebagai rangkaian keputusan: menentukan jenis website yang tepat, menyusun antarmuka yang terbaca, menulis markah yang bersih, menata tampilan dan perilaku, memilih alat yang sesuai kemampuan mitra, membangun situs multi-halaman, menjaga amanah atas aset mitra, lalu menyerahkannya dengan benar.</p>' +
    '<div class="card"><h3>Isi identitas dulu</h3><p class="hint">Dipakai di rapor dan berkas yang kamu kumpulkan.</p>' +
    '<label class="fl" for="pn">Nama</label><input type="text" id="pn" value="' + esc(S.nama) + '">' +
    '<label class="fl" for="pp">NPM</label><input type="text" id="pp" value="' + esc(S.npm) + '">' +
    '<label class="fl" for="pm">UMKM mitra <small>opsional — kalau sudah ada</small></label><input type="text" id="pm" value="' + esc(S.mitra) + '"></div>' +
    '<div class="note"><b>Satu hal yang perlu disepakati dulu.</b> Beberapa misi tidak punya satu jawaban paling benar — palet warna pada Misi 2 misalnya punya banyak kombinasi yang sama-sama lolos ambang kontras. Yang dinilai adalah apakah keputusanmu memenuhi syarat yang bisa diperiksa dan bisa kamu pertahankan alasannya. Nilai di sini juga bukan nilai mata kuliah.</div>' +
    '<div class="btnrow"><button class="btn go" id="bGo">Mulai Misi 1</button>' +
    (Object.keys(S.m).length ? '<button class="btn ghost" id="bLanjut">Lanjutkan yang terakhir</button>' : "") + "</div>";
  function ambil() { S.nama = el("pn").value; S.npm = el("pp").value; S.mitra = el("pm").value; save(); }
  el("bGo").onclick = function () { ambil(); go(MISSIONS[0].id); };
  if (el("bLanjut")) el("bLanjut").onclick = function () { ambil(); go(S.cur || MISSIONS[0].id); };
}

/* ---------------- init ---------------- */
load();
el("modal").addEventListener("click", function (e) { if (e.target === el("modal")) closeModal(); });
document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeModal(); });
document.addEventListener("click", function (e) {
  var b = e.target.closest("button[data-go]");
  if (b && !b.disabled) { go(b.getAttribute("data-go")); el("stage").focus(); }
});
el("btnRubrik").onclick = rubrik;
el("btnPanduan").onclick = panduan;
el("btnRapor").onclick = rapor;
el("btnExport").onclick = exportDialog;
el("btnImport").onclick = importDialog;
el("btnReset").onclick = function () {
  modal("<h2>Kosongkan semua?</h2><p>Seluruh jawaban, nilai, dan badge di browser ini akan dihapus dan tidak bisa dikembalikan. Export dulu kalau masih dibutuhkan.</p>" +
    '<div class="btnrow"><button class="btn" id="rz">Ya, kosongkan</button><button class="btn ghost" onclick="closeModal()">Batal</button></div>');
  el("rz").onclick = function () { S = fresh(); save(); closeModal(); pembuka(); };
};
if (S.nama || Object.keys(S.m).length) { paintRail(); go(S.cur || MISSIONS[0].id); } else pembuka();
